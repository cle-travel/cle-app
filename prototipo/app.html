<style>
/* Layout: um app de celular (até 430px), tela única com cabeçalho grande estilo iOS, conteúdo rolável e barra de abas.
   No computador, o app fica centralizado como um aparelho. Visual sóbrio; um único destaque: azul-ardósia. */
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --fg:#1D1D1F; --fg2:#6E6E73; --fg3:#AEAEB2; --sep:#E3E3E8; --fill:#EBEBF0;
  --accent:#24476B; --accent-fg:#FFFFFF; --accent-soft:#E4EBF3;
  --ok:#1E6B34; --ok-bg:#E5F3E8; --warn:#8A4F00; --warn-bg:#FCEFD8; --bad:#B42318; --bad-bg:#FCE9E7;
  --map:#ECEAE4; --map2:#E3E0D8; --map-grid:#DFDCD4; --road:#FFFFFF; --orb:#24476B;
  --line:rgba(17,24,39,.07); --sh:0 1px 2px rgba(17,24,39,.04),0 2px 8px rgba(17,24,39,.05); --glass:rgba(255,255,255,.82);
  --font:"Geist",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:16px; --r-lg:22px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --card:#1C1C1E; --fg:#F5F5F7; --fg2:#98989D; --fg3:#636366; --sep:#38383A; --fill:#2C2C2E;
  --accent:#8FB3DA; --accent-fg:#0B1B2B; --accent-soft:#1A2837;
  --ok:#7DD89A; --ok-bg:#132A1B; --warn:#F2C36B; --warn-bg:#35270D; --bad:#FF7B72; --bad-bg:#3A1513;
  --map:#1B1C1F; --map2:#151618; --map-grid:#26272B; --road:#34363B; --orb:#8FB3DA;
  --line:rgba(255,255,255,.07); --sh:none; --glass:rgba(28,28,30,.82); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1C1C1E; --fg:#F5F5F7; --fg2:#98989D; --fg3:#636366; --sep:#38383A; --fill:#2C2C2E;
  --accent:#8FB3DA; --accent-fg:#0B1B2B; --accent-soft:#1A2837;
  --ok:#7DD89A; --ok-bg:#132A1B; --warn:#F2C36B; --warn-bg:#35270D; --bad:#FF7B72; --bad-bg:#3A1513;
  --map:#1B1C1F; --map2:#151618; --map-grid:#26272B; --road:#34363B; --orb:#8FB3DA;
  --line:rgba(255,255,255,.07); --sh:none; --glass:rgba(28,28,30,.82); color-scheme:dark}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;-webkit-font-smoothing:antialiased;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
a{color:var(--accent)}
.app{position:relative;height:100%;max-width:430px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
@media (min-width:600px){body{background:var(--fill)}.app{height:calc(100% - 40px);margin-block:20px;border-radius:34px;border:1px solid var(--sep);box-shadow:0 20px 60px rgba(0,0,0,.12)}}
.top{padding:14px 16px 8px;display:flex;align-items:center;gap:10px;min-height:52px}
.top .ttl{flex:1;min-width:0;text-align:center}
.top .ttl b{display:block;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl span{display:block;font-size:12px;color:var(--fg2)}
.iconbtn{width:36px;height:36px;border-radius:18px;display:flex;align-items:center;justify-content:center;color:var(--accent);flex-shrink:0}
.iconbtn.sos{color:var(--bad)}
main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.pad{padding:4px 16px 32px;display:flex;flex-direction:column;gap:18px}
h1{font-size:30px;font-weight:700;letter-spacing:-.8px;line-height:1.1;margin:2px 0 0;text-wrap:balance}
.sub{font-size:15px;color:var(--fg2);margin:4px 0 0;line-height:1.4}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--fg2);margin:4px 4px -8px}
.card{background:var(--card);border-radius:var(--r-lg);padding:18px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line);box-shadow:var(--sh)}
.list{background:var(--card);border-radius:var(--r);overflow:hidden;border:1px solid var(--line);box-shadow:var(--sh)}
.hero{display:flex;flex-direction:column;gap:6px}
.hero .kick{font-size:13px;font-weight:600;color:var(--accent);letter-spacing:.02em}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);box-shadow:var(--sh);border-radius:var(--r);padding:12px 12px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-size:20px;font-weight:650;letter-spacing:-.3px;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat span{font-size:12px;color:var(--fg2)}
.datebox{width:44px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;line-height:1}
.datebox small{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--fg2)}
.datebox b{font-size:21px;font-weight:650;margin-top:3px;font-variant-numeric:tabular-nums}
.thumb{width:54px;height:54px;border-radius:12px;overflow:hidden;flex-shrink:0;background:var(--map);border:1px solid var(--line)}
.thumb svg{display:block;width:100%;height:100%}
.avatar{width:28px;height:28px;border-radius:14px;background:var(--accent);color:var(--accent-fg);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;font-weight:700}
.who{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--fg2)}
.trip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--fg2)}
.trip i{width:6px;height:6px;border-radius:3px;background:var(--ok)}
#wallet{flex:1;width:100%;border:0;display:block;background:var(--bg)}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:48px;width:100%;text-align:left;position:relative}
a.row{color:inherit;text-decoration:none}
.row+.row::before{content:"";position:absolute;top:0;left:14px;right:0;border-top:.5px solid var(--sep)}
.row .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .main b{font-weight:500;font-size:16px}
.row .main span{font-size:13px;color:var(--fg2)}
.row .val{color:var(--fg2);font-size:15px;text-align:right;font-variant-numeric:tabular-nums}
.chev{color:var(--fg3);flex-shrink:0}
.btn{height:50px;border-radius:14px;letter-spacing:-.1px;text-decoration:none;background:var(--accent);color:var(--accent-fg);font-weight:600;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.btn.sec{background:var(--fill);color:var(--accent)}
.btn.ghost{background:none;color:var(--accent)}
.btn.danger{background:var(--bad);color:#fff}
.btns{display:flex;gap:10px}
.btns .btn{flex:1}
.pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:10px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.pill.ok{color:var(--ok);background:var(--ok-bg)}
.pill.warn{color:var(--warn);background:var(--warn-bg)}
.pill.bad{color:var(--bad);background:var(--bad-bg)}
.pill.acc{color:var(--accent);background:var(--accent-soft)}
.pill.neu{color:var(--fg2);background:var(--fill)}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:15px;padding:9px 0;border-top:.5px solid var(--sep)}
.kv:first-child{border-top:0}
.kv span:first-child{color:var(--fg2)}
.kv span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.tabbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:6px 6px calc(8px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:500;color:var(--fg3);padding:4px 0}
.tab.on{color:var(--accent)}
.tab .badge{position:absolute;margin-left:18px;margin-top:-2px;background:var(--bad);color:#fff;font-size:10px;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.tab>span{position:relative;display:flex}
.seg{display:flex;background:var(--fill);border-radius:10px;padding:2px}
.seg button{flex:1;padding:7px 4px;border-radius:8px;font-size:14px;font-weight:500;color:var(--fg2)}
.seg button.on{background:var(--card);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
/* conversa */
.chat{display:flex;flex-direction:column;gap:14px;padding:6px 16px 12px}
.msg-m{font-size:17px;line-height:1.45;max-width:100%}
.msg-u{align-self:flex-end;max-width:82%;background:var(--accent);color:var(--accent-fg);border-radius:20px 20px 6px 20px;padding:11px 15px;font-size:16px;line-height:1.4}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;border:.5px solid var(--sep);background:var(--card);border-radius:18px;padding:8px 13px;font-size:14px;color:var(--fg)}
.voz{display:flex;flex-direction:column;align-items:center;gap:8px;padding:6px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.voz .linha{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:300px}
.orb{position:relative;width:84px;height:84px;display:flex;align-items:center;justify-content:center}
.orb i{position:absolute;inset:0;border-radius:50%;background:var(--orb);opacity:.1}
.orb i+i{inset:10px;opacity:.2}
.orb button{position:relative;width:52px;height:52px;border-radius:26px;background:var(--orb);color:var(--accent-fg);display:flex;align-items:center;justify-content:center}
.orb.ouvindo i{animation:pulso 1.4s ease-in-out infinite}
.orb.ouvindo i+i{animation-delay:.2s}
.orb.pensando i{animation:gira 1s linear infinite;opacity:.18}
@keyframes pulso{0%,100%{transform:scale(.9)}50%{transform:scale(1.08)}}
@keyframes gira{0%{opacity:.08}50%{opacity:.3}100%{opacity:.08}}
@media (prefers-reduced-motion:reduce){.orb i{animation:none!important}}
.small{font-size:13px;color:var(--fg2)}
.transc{font-size:15px;color:var(--fg2);min-height:22px;text-align:center;max-width:320px}
/* mapa */
.mapa{background:var(--map);border-radius:var(--r-lg);overflow:hidden;position:relative}
.mapa svg{display:block;width:100%;height:auto}
.daynav{display:flex;align-items:center;gap:8px}
.daynav .t{flex:1;min-width:0;text-align:center}
.daynav .t b{display:block;font-size:17px}
.daynav .t span{font-size:13px;color:var(--fg2);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num{width:28px;height:28px;border-radius:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;background:var(--accent);color:var(--accent-fg)}
.num.warn{background:var(--card);color:var(--warn);border:2px dashed var(--warn)}
.num.bad{background:var(--card);color:var(--bad);border:2px dashed var(--bad)}
.hora{width:48px;flex-shrink:0;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.tl .row{align-items:flex-start}
.ico{width:32px;height:32px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.progress{height:6px;border-radius:3px;background:var(--fill);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:3px}
.bar{display:flex;flex-direction:column;gap:6px}
.bar .l{display:flex;justify-content:space-between;font-size:14px;font-variant-numeric:tabular-nums}
.bar .l span:last-child{color:var(--fg2)}
.check{width:24px;height:24px;border-radius:12px;border:1.5px solid var(--fg3);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:transparent}
.check.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.feito b{color:var(--fg3);text-decoration:line-through}
/* sobreposições */
.toast{position:absolute;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);border-radius:14px;padding:12px 14px;font-size:15px;display:flex;gap:10px;align-items:center;z-index:30;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.toast button{margin-left:auto;color:var(--bg);font-weight:600;text-decoration:underline}
.alerta{position:absolute;inset:0;background:#1C1C1E;color:#F5F5F7;z-index:50;display:flex;flex-direction:column;padding:calc(40px + env(safe-area-inset-top,0px)) 24px calc(28px + env(safe-area-inset-bottom,0px));gap:18px;overflow-y:auto}
.alerta .ic{width:64px;height:64px;border-radius:32px;background:#FF3B30;display:flex;align-items:center;justify-content:center;color:#fff;margin-top:12px}
.alerta h2{font-size:30px;line-height:1.15;margin:0;font-weight:700;text-wrap:balance}
.alerta p{margin:0;font-size:17px;line-height:1.45;color:#D1D1D6}
.alerta .bx{background:#2C2C2E;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:4px}
.alerta .bx small{color:#A1A1A6;font-size:13px}
.alerta .b1{height:52px;border-radius:14px;background:#FFFFFF;color:#1D1D1F;font-weight:600;font-size:17px}
.alerta .b2{height:52px;border-radius:14px;background:#2C2C2E;color:#FFFFFF;font-weight:600;font-size:17px}
.alerta .b3{height:44px;color:#A1A1A6;font-size:16px}
.notif{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:10px;right:10px;z-index:40;background:var(--card);border-radius:20px;padding:12px 14px;display:flex;gap:12px;box-shadow:0 10px 40px rgba(0,0,0,.22);text-align:left;width:auto}
.notif .app-ic{width:38px;height:38px;border-radius:9px;background:var(--accent);color:var(--accent-fg);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sheet{position:absolute;inset:0;z-index:45;background:rgba(0,0,0,.4);display:flex;align-items:flex-end}
.sheet .in{background:var(--bg);width:100%;border-radius:22px 22px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-height:92%;overflow-y:auto}
.grab{width:36px;height:5px;border-radius:3px;background:var(--fg3);align-self:center;opacity:.5}
/* onboarding */
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:7px;height:7px;border-radius:4px;background:var(--fg3);opacity:.5}
.dots i.on{width:20px;background:var(--accent);opacity:1}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.int{background:var(--card);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;text-align:left;border:1.5px solid transparent;min-height:78px}
.int b{font-size:15px;font-weight:600}
.int.amo{border-color:var(--accent)}
.int.nao{opacity:.45}
.swipe{background:var(--card);border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:10px;min-height:250px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
.swipe .ph{height:110px;border-radius:16px;background:linear-gradient(160deg,var(--accent-soft),var(--fill));display:flex;align-items:flex-end;padding:12px;color:var(--accent);font-weight:600}
.opt{background:var(--card);border-radius:14px;padding:14px;text-align:left;border:1.5px solid transparent;font-size:15px;line-height:1.35}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.ficha .kv span:last-child{font-weight:500}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:.2;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}}
.demo{border:1px dashed var(--fg3);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.mono{font-variant-numeric:tabular-nums}
.sel{user-select:all}
/* conversa real: texto sempre disponível ao lado da voz */
.entrada{display:flex;gap:8px;padding:0 16px 2px;align-items:center}
.entrada input{flex:1;min-width:0;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit;font-size:16px;padding:0 16px}
.entrada .enviar{background:var(--accent);color:var(--accent-fg);width:44px;height:44px;border-radius:22px}
.msg-m p{margin:0 0 8px}.msg-m p:last-child{margin:0}
.ptopo{display:flex;justify-content:space-between;align-items:center;gap:8px}
.motivo{font-size:14px;color:var(--fg2);line-height:1.45;border-left:3px solid var(--accent-soft);padding-left:10px}
.mini{display:flex;flex-direction:column;gap:6px}
.mini div{display:flex;gap:8px;font-size:14px;align-items:baseline}
.mini b{width:44px;flex-shrink:0;font-variant-numeric:tabular-nums}
/* formulários (onboarding, perfil, ficha médica) */
.campo{display:flex;flex-direction:column;gap:6px;min-width:0}
.campo label{font-size:13px;color:var(--fg2)}
.campo input,.campo select,.campo textarea{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit;font-size:16px;padding:0 12px;width:100%;min-width:0}
.campo textarea{height:auto;min-height:96px;padding:12px;line-height:1.45;resize:vertical}
.dois{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.slider{display:flex;flex-direction:column;gap:2px}
.slider .l{display:flex;justify-content:space-between;font-size:13px;color:var(--fg2)}
.slider input{width:100%;accent-color:var(--accent)}
.grupo-op{display:flex;flex-direction:column;gap:8px}
/* guia impresso: só aparece na impressão / "Salvar como PDF" */
#print{display:none}
@media print{
  html,body{height:auto;overflow:visible;background:#fff}
  .app{display:none!important}
  #print{display:block!important;color:#111;font-family:Georgia,"Times New Roman",serif;font-size:11pt;
    --map:#ECEAE4;--map2:#E3E0D8;--road:#fff;--accent:#24476B;--accent-fg:#fff;--card:#fff;--fg:#1D1D1F;--fg2:#6E6E73;--bg:#fff;--line:rgba(0,0,0,.12);--warn:#8A4F00;--bad:#B42318;--font:Georgia,serif}
  #print .pg{page-break-after:always;padding:4mm 2mm}
  #print .k{font-size:9pt;letter-spacing:.08em;text-transform:uppercase;color:#555}
  #print h1{font-size:24pt;margin:4px 0}#print h2{font-size:15pt;margin:4px 0}
  #print table{width:100%;border-collapse:collapse;margin-top:6px}
  #print td{border-top:.5pt solid #bbb;padding:5px 4px;vertical-align:top}
  #print td.h{width:46px;font-weight:700}
  #print .c{font-size:9pt;color:#555}
  #print .mp svg{width:100%;height:auto;max-height:80mm}
  #print .obs{border:1pt solid #8A4F00;padding:6px;color:#8A4F00}
}
</style>

<script>
// O app é "virgem": nenhuma viagem vem embutida. A Western é só um arquivo de exemplo (exemplos/), aberto pelo usuário.
if (!(/*__MONTADO__*/false)) {
  document.getElementById("app").innerHTML = '<div style="padding:40px 24px;display:flex;flex-direction:column;gap:12px"><b style="font-size:20px">Este arquivo é o modelo do app</b><span style="color:var(--fg2);line-height:1.5">Abra o <b>app/index.html</b>. Ele é gerado pelo comando <code>node montar.mjs</code>, que junta este modelo com a Carteira.</span></div>';
  throw new Error("modelo: abra app/index.html");
}

// ---------- utilidades ----------
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function garantirDias() {
  if (!S.viagem) return;
  for (let n = 1; n <= S.viagem.dias; n++) {
    if (diaObj(n)) continue;
    const dt = new Date(S.viagem.inicio + "T12:00:00"); dt.setDate(dt.getDate() + n - 1);
    DIAS.push({ dia: n, data: dt.toISOString().slice(0, 10), titulo: `Dia ${n}`, km: 0, min: 0, paradas: [], postos: [], poly: [], pernoite: null });
  }
  DIAS.sort((a, b) => a.dia - b.dia);
  for (const d of DIAS) { d.paradas = d.paradas || []; d.postos = d.postos || []; d.poly = d.poly || []; }
}
// a tela inicial muda com a fase (seção 16): pela data, a não ser que o teste tenha fixado a fase
function faseAuto() {
  if (!S.viagem || S.faseManual) return;
  const h = hojeISO(), fim = fimViagem();
  if (h >= S.viagem.inicio && h <= fim) { S.fase = "viagem"; S.diaHoje = Math.round((new Date(h + "T12:00:00") - new Date(S.viagem.inicio + "T12:00:00")) / 864e5) + 1; }
  else S.fase = "planejamento";
}

const HORAS_RITMO = { tranquilo: 8, equilibrado: 10, intenso: 12 };
function travasDia(d) {
  const a = [], pf = (S.viagem && S.viagem.perfil) || null, ps = paradasDo(d).filter((p) => p.t !== "inicio");
  if (pf && +pf.maxDirecao > 0 && d.min > +pf.maxDirecao * 60) a.push(`Direção acima do limite: ${fmtMin(d.min)} (limite de ${pf.maxDirecao} h por dia)`);
  if (pf && HORAS_RITMO[pf.ritmo]) {
    const ativo = d.min + ps.reduce((s, p) => s + durMin(p.dur), 0), lim = HORAS_RITMO[pf.ritmo] * 60;
    if (ativo > lim) a.push(`Dia sobrecarregado: ${fmtMin(ativo)} entre direção e atividades (ritmo ${pf.ritmo}: até ${HORAS_RITMO[pf.ritmo]} h)`);
  }
  const vistos = {};
  for (const p of ps) if (p.h && !["transito", "pernoite", "abastecimento"].includes(p.t)) { if (vistos[p.h]) a.push(`Dois compromissos às ${p.h}: ${nomeLimpo(vistos[p.h])} e ${nomeLimpo(p.n)}`); else vistos[p.h] = p.n; }
  return a;
}

const CLIMA_TXT = (c) => (c === 0 ? "Céu limpo" : c <= 3 ? "Parcialmente nublado" : c <= 48 ? "Neblina" : c <= 57 ? "Garoa" : c <= 67 ? "Chuva" : c <= 77 ? "Neve" : c <= 82 ? "Pancadas de chuva" : "Trovoadas");
function climaDe(d) {
  const k = d.data; if (S.clima[k]) return S.clima[k];
  const dist = Math.round((new Date(k + "T12:00:00") - new Date(hojeISO() + "T12:00:00")) / 864e5);
  if (dist < 0 || dist > 15 || navigator.onLine === false || climaPedido[k]) return null;
  const ps = paradasDo(d).filter((p) => p.lat != null), ref = ps.find((p) => p.t === "pernoite") || ps[ps.length - 1];
  if (!ref) return null;
  climaPedido[k] = true;
  fetch(`https://api.open-meteo.com/v1/forecast?latitude=${(+ref.lat).toFixed(3)}&longitude=${(+ref.lng).toFixed(3)}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&start_date=${k}&end_date=${k}`)
    .then((r) => r.json()).then((j) => { const x = j.daily; if (!x || !x.time || !x.time.length) return; S.clima[k] = { max: Math.round(x.temperature_2m_max[0]), min: Math.round(x.temperature_2m_min[0]), chuva: x.precipitation_probability_max[0], txt: CLIMA_TXT(x.weather_code[0]), ref: nomeLimpo(ref.n) }; render(); }).catch(() => {});
  return null;
}

function registrar(desc, tipo, dados) { const h = { id: novoId(), quando: new Date().toISOString(), quem: (S.viagem && S.viagem.dono) || "", desc, tipo, dados }; S.historico.unshift(h); return h.id; }
function desfazerHist(id) {
  const h = S.historico.find((x) => x.id === id); if (!h || h.desfeito) return false;
  const d = h.dados || {};
  if (h.tipo === "parada") { const dia = diaObj(d.dia); if (dia) { dia.paradas = dia.paradas.filter((p) => p.id !== d.id); if (d.pernoiteAntes !== undefined) dia.pernoite = d.pernoiteAntes; recalcRota(dia); } }
  else if (h.tipo === "dia") { const i = DIAS.findIndex((x) => x.dia === d.dia); if (i >= 0) DIAS[i] = d.antes; }
  else if (h.tipo === "lanc") { const c = cle(); if (!c || !c.desfazer(d.lancId)) { toast("Abra a Carteira para desfazer este lançamento."); return false; } }
  else if (h.tipo === "tarefa") { S.listas.tarefas = S.listas.tarefas.filter((t) => t.id !== d.id); }
  else if (h.tipo === "concluir") { S.tarefas[d.id] = false; }
  else if (h.tipo === "desejo") { S.listas.desejos = S.listas.desejos.filter((x) => x.id !== d.id); }
  else if (h.tipo === "info") { S.viagem.info = S.viagem.info || {}; if (d.antes == null) delete S.viagem.info[d.campo]; else S.viagem.info[d.campo] = d.antes; }
  else if (h.tipo === "confirmar") { delete S.confirmados[d.n]; }
  else if (h.tipo === "guia") { S.guiaAceito = false; }
  h.desfeito = new Date().toISOString();
  return true;
}

const fioVazio = () => ({ versao: null, msgs: [], tamanho: 0, resumo: null });

// pedidos de planejamento vão ao Opus; o resto fica no Sonnet (que também pode encaminhar ao planejador)
const PLANEJAR = /\b(mont(e|ar|a)\b[^.?!]*\b(roteiro|dias?\b)|reotimiz|otimiz[ae]|replanej|planej[ae]\b|reorganiz|refa(ç|z)a o (roteiro|dia)|troque o d\d|trocar o d\d|revise o roteiro|corrij[ae] os alertas|primeira vers[aã]o do roteiro|concili)/i;

const LIMITE_FIO = { conversa: 60000, planejamento: 90000 }; // sem compactação no servidor, recomeça com resumo acima disto

// resumo da viagem para UM turno: uma linha por dia; paradas só dos dias em foco (o resto, por consultar_dia)
function contextoTexto(pedido) {
  const v = S.viagem; if (!v) return "(sem viagem aberta)";
  const c = cle(), ml = (c && c.moedaLocal()) || v.moeda || {}, pf = v.perfil || {}, L = [];
  L.push(`Hoje: ${hojeISO()} ${agoraHM()} · ${S.fase === "viagem" ? `na viagem, dia ${S.diaHoje}` : "fase de planejamento"}`);
  L.push(`Viagem: ${v.nome}${v.destino && v.destino !== v.nome ? ` (${v.destino})` : ""} · ${v.inicio} a ${fimViagem()} (${v.dias} dias) · país ${v.pais || "?"} · moeda ${ml.cod || "?"}${v.cotacao ? ` (1 ${ml.cod} = R$ ${String(v.cotacao).replace(".", ",")})` : ""} · emergência ${v.emergencia || "?"}`);
  L.push(`Viajantes: ${v.viajantes.map((n, i) => n + (i === 0 ? " (organizador" + (n === v.dono ? ", este celular)" : ")") : n === v.dono ? " (este celular)" : "")).join(", ")}`);
  const nomes = (x) => INTERESSES.filter((n) => (pf.int || {})[n] === x).join(", ");
  const perfil = [pf.ritmo && `ritmo ${pf.ritmo}`, pf.maxDirecao && `máx ${pf.maxDirecao} h dirigindo/dia`, pf.acordar && `acorda ${pf.acordar}`, pf.regras && `regras: ${pf.regras}`, pf.alimentacao && `alimentação: ${pf.alimentacao}`, pf.limites && `limites: ${pf.limites}`,
    nomes(2) && `amam: ${nomes(2)}`, nomes(1) && `curtem: ${nomes(1)}`, nomes(3) && `não curtem: ${nomes(3)}`, pf.sl && Object.keys(pf.sl).length && `personalidade (0-100): ${SLIDERS.map(([k, a, b]) => `${a}→${b} ${pf.sl[k] ?? 50}`).join(", ")}`,
    pf.ocasiao && `ocasião: ${pf.ocasiao}`, pf.orcamento && `orçamento: ${pf.orcamento}`, pf.reservado && `já reservado: ${pf.reservado}`].filter(Boolean);
  if (perfil.length) L.push("Perfil: " + perfil.join("; "));
  const info = Object.entries(v.info || {}); if (info.length) L.push("Apoio: " + info.map(([k, x]) => `${k}=${x}`).join("; "));
  // dias em foco: os citados no pedido e, na viagem, hoje e amanhã
  const foco = new Set([...String(pedido || "").matchAll(/\b(?:d|dia)\s?(\d{1,3})\b/gi)].map((x) => +x[1]).slice(0, 3));
  if (S.fase === "viagem") { foco.add(S.diaHoje); foco.add(S.diaHoje + 1); }
  L.push("Roteiro (detalhes de outros dias: consultar_dia):");
  let vazios = [];
  const fechaVazios = () => { if (vazios.length) L.push(vazios.length > 1 ? `D${vazios[0]} a D${vazios[vazios.length - 1]}: vazios` : `D${vazios[0]}: vazio`); vazios = []; };
  for (const d of DIAS) {
    const ps = paradasDo(d);
    if (!ps.length) { vazios.push(d.dia); continue; }
    fechaVazios();
    const n = ps.filter((p) => seloDe(p) !== "verde").length, tv = travasDia(d);
    L.push(`D${d.dia} ${d.data.slice(8)}/${d.data.slice(5, 7)} · ${d.titulo} · ${d.km} km ${fmtMin(d.min)} · pernoite ${nomeLimpo(d.pernoite || "a definir")} · ${ps.length} paradas${n ? `, ${n} a conferir` : ""}${tv.length ? " · ALERTAS: " + tv.join("; ") : ""}`);
    if (foco.has(d.dia)) for (const p of ps) L.push(`  ${p.h || "--"} ${nomeLimpo(p.n)} (${p.t}${p.dur ? ", " + p.dur : ""}, selo ${seloDe(p)}) ${(+p.lat).toFixed(5)},${(+p.lng).toFixed(5)}`);
  }
  fechaVazios();
  const abertas = tarefasLista().filter((t) => !feitaTarefa(t));
  if (abertas.length) L.push("Checklist aberto: " + abertas.slice(0, 15).map((t) => `[${t.id}] ${textoTarefa(t)} (${t.g})`).join("; ") + (abertas.length > 15 ? ` …e mais ${abertas.length - 15}` : ""));
  const des = (S.listas && S.listas.desejos) || [];
  if (des.length) L.push("Desejos: " + des.slice(0, 20).map((x) => `${x.n} (${estadoDesejo(x)})`).join("; ") + (des.length > 20 ? ` …e mais ${des.length - 20}` : ""));
  L.push(`Locais a conferir no mapa: ${aConfirmar()}`);
  return L.join("\n");
}
// roteiro completo para a ferramenta consultar_dia (vai no corpo do pedido, não no prompt)
const dadosRoteiro = () => ({ dias: DIAS.map((d) => ({ dia: d.dia, data: d.data, titulo: d.titulo, km: d.km, min: d.min, paradas: paradasDo(d).map((p) => ({ h: p.h || "", n: nomeLimpo(p.n), t: p.t, dur: p.dur || "", selo: seloDe(p), lat: +(+p.lat).toFixed(5), lng: +(+p.lng).toFixed(5) })) })) });
async function lerSSE(resp, cada) {
  const leitor = resp.body.getReader(), dec = new TextDecoder(); let buf = "";
  for (;;) {
    const { value, done } = await leitor.read(); if (done) break;
    buf += dec.decode(value, { stream: true });
    let k; while ((k = buf.indexOf("\n\n")) >= 0) { const l = buf.slice(0, k); buf = buf.slice(k + 2); if (l.startsWith("data: ")) { let ev = null; try { ev = JSON.parse(l.slice(6)); } catch (e) {} if (ev) cada(ev); } }
  }
}
let rT = null;
const renderLogo = () => { if (rT) return; rT = setTimeout(() => { rT = null; render(); }, 80); };
const resultadosDe = (m) => m.toolUses.map((id) => ({ type: "tool_result", tool_use_id: id, content: id in m.servidor ? m.servidor[id] : ((m.cards || []).find((k) => k.id === id) || {}).resultado || "Sem resposta do viajante." }));
// numa conversa recomeçada, resultados de cartões antigos viram texto (os ids antigos não existem mais)
const semIdsAntigos = (novas) => novas.map((b) => (b.type === "tool_result" ? { type: "text", text: `Resultado de proposta anterior: ${b.content}` } : b));
// fotos reduzidas antes do primeiro envio (depois nada é alterado): até 1568 px, JPEG
async function reduzirImagem(file) {
  try {
    const img = await createImageBitmap(file), k = Math.min(1, 1568 / Math.max(img.width, img.height));
    if (k === 1 && file.size < 1.5e6) return file;
    const cv = document.createElement("canvas"); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
    cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
    const blob = await new Promise((ok) => cv.toBlob(ok, "image/jpeg", 0.85));
    return blob ? new File([blob], file.name.replace(/\.\w+$/, "") + ".jpg", { type: "image/jpeg" }) : file;
  } catch (e) { return file; }
}

async function enviarTexto(txt, opc = {}) {
  txt = (txt || "").trim(); if (!txt && !opc.anexo) return false;
  if (S.pensando) { toast("Espere o Marco terminar de responder."); render(); return false; }
  if (!S.chat) S.chat = chatInicial();
  S.rascunho = ""; garantirFios();
  const modo = opc.modo || rotaModo(txt);
  if (!opc.semBalao) S.chat.push({ de: "u", txt, anexo: opc.anexo && opc.anexo.nome });
  if (!marcoDisponivel()) { S.chat.push({ de: "m", txt: msgMarcoOff() }); S.rolarFim = true; render(); return false; }
  const novas = [];
  let pend = null, notasUsadas = 0;
  if (modo !== "comprovante") {
    // cartões desta conversa ainda sem resposta: o viajante mudou de assunto, e o Marco precisa saber
    pend = [...S.chat].reverse().find((x) => x.fio === modo && x.toolUses && !x.respondido);
    if (pend) { for (const k of pend.cards || []) if (k.estado === "aguardando") { k.estado = "ignorado"; k.resultado = "O viajante não respondeu a este cartão e mudou de assunto."; } novas.push(...resultadosDe(pend)); }
    if (modo === "conversa" && S.notas.length) { notasUsadas = S.notas.length; novas.push({ type: "text", text: S.notas.join("\n") }); }
  }
  if (opc.anexo) novas.push(opc.anexo.bloco);
  novas.push({ type: "text", text: txt });
  const ok = await rodarTurno(modo, novas, { reenvio: { txt, opc: { ...opc, semBalao: true, modo } } });
  if (ok) { if (pend) pend.respondido = true; if (notasUsadas) S.notas = S.notas.slice(notasUsadas); render(); }
  return ok;
}
async function rodarTurno(modo, novas, ctrl = {}) {
  const avulso = modo === "comprovante", fio = avulso ? fioVazio() : S.fios[modo];
  // conversa grande sem compactação no servidor: recomeça com resumo antes de crescer mais
  if (!avulso && fio.msgs.length && S.recursos && (S.recursos.compactacao === false || S.recursos.gatilhoCompactacao === false) && fio.tamanho > LIMITE_FIO[modo]) await recomecarFio(modo);
  let envio = novas;
  if (!avulso && !fio.msgs.length && fio.resumo) envio = [{ type: "text", text: "[Resumo da conversa anterior, feito para economizar]\n" + fio.resumo }, ...semIdsAntigos(novas)];
  else if (!avulso && !fio.msgs.length) envio = semIdsAntigos(novas);
  const m = { de: "m", txt: "", vivo: true, status: modo === "planejamento" ? "Planejando com calma…" : modo === "comprovante" ? "Lendo o comprovante…" : "Pensando…", fio: modo };
  S.chat.push(m); S.pensando = true; S.rolarFim = true; render();
  let ok = false, codigo = null;
  try {
    const r = await fetch(API + "/marco", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ modo, versao: fio.versao, historico: fio.msgs, novas: envio, contexto: contextoTexto(envio.filter((b) => b.type === "text").map((b) => b.text).join(" ")), dados: dadosRoteiro() }) });
    if (r.status === 409) codigo = "versao";
    else if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.erro || "O Marco não respondeu."); }
    else await lerSSE(r, (ev) => { if (tratarEvento(ev, m, fio, modo)) ok = true; if (ev.tipo === "erro" && ev.codigo) codigo = ev.codigo; });
  } catch (e) { m.erro = navigator.onLine === false ? "Sem internet: o Marco precisa de conexão. Roteiro, mapa, Carteira e Cofre continuam funcionando." : e.message || "O Marco não respondeu."; }
  m.vivo = false; m.status = null; S.pensando = false;
  // trava: versão nova do prefixo ou histórico recusado → recomeça a conversa com resumo e tenta uma vez
  if (!ok && (codigo === "versao" || codigo === "historico_invalido") && !avulso && !ctrl.recomecou) {
    S.chat.splice(S.chat.indexOf(m), 1);
    await recomecarFio(modo);
    return rodarTurno(modo, novas, { ...ctrl, recomecou: true });
  }
  if (ok && !avulso && fio.resumo && fio.msgs.length) fio.resumo = null;
  if (!ok && !m.erro) m.erro = "O Marco não respondeu. Tente de novo.";
  if (!ok) m.reenvio = ctrl.reenvio;
  S.rolarFim = true; render();
  if (ok) checarMarco();
  if (ok && m.encaminhar) await enviarTexto(m.encaminhar, { modo: "planejamento", semBalao: true });
  return ok;
}
// devolve true quando o turno terminou bem (fim ou propostas)
function tratarEvento(ev, m, fio, modo) {
  const avulso = modo === "comprovante";
  if (ev.consumo) m.consumo = ev.consumo;
  if (ev.tipo === "inicio") { if (!fio.msgs.length) fio.versao = ev.versao; m.modelo = ev.modelo; }
  else if (ev.tipo === "texto") { m.txt += ev.texto; m.status = null; S.rolarFim = true; renderLogo(); }
  else if (ev.tipo === "buscando") { m.status = ev.ferramenta === "calcular_rota" ? "Calculando a rota…" : ev.ferramenta === "buscar_lugar" ? `Procurando ${ev.consulta || "o lugar"} nas bases de mapas…` : ev.ferramenta === "consultar_dia" ? `Consultando o ${ev.consulta || "dia"}…` : "Pesquisando…"; renderLogo(); }
  else if (ev.tipo === "propostas" || ev.tipo === "fim") {
    if (!avulso) fio.msgs.push(...ev.anexadas); // R2: guardado exatamente como foi; nunca editado depois
    const c = ev.consumo; if (c && c.chamadas) fio.tamanho = Math.round((c.entrada + c.cacheLido + c.cacheEscrito) / c.chamadas);
    if (ev.aviso) m.txt += (m.txt ? "\n\n" : "") + ev.aviso;
    if (ev.tipo === "propostas") {
      const asst = ev.anexadas[ev.anexadas.length - 1].content;
      m.servidor = ev.resultadosServidor || {};
      m.toolUses = asst.filter((b) => b.type === "tool_use").map((b) => b.id);
      m.cards = asst.filter((b) => b.type === "tool_use" && !(b.id in m.servidor)).map((b) => ({ id: b.id, name: b.name, input: b.input || {}, estado: "aguardando" }));
      for (const k of m.cards) if (k.name === "encaminhar_ao_planejador") { k.estado = "aprovado"; k.resultado = "Encaminhado ao planejador; o resultado aparece na conversa."; m.encaminhar = k.input.pedido; }
      if (!m.txt.trim() && m.cards.some((k) => k.estado === "aguardando")) m.txt = m.cards.length > 1 ? "Preparei estas propostas para você decidir:" : "Preparei esta proposta para você decidir:";
      if (avulso) m.respondido = true; // comprovante: conversa avulsa, não continua
    }
    return true;
  }
  else if (ev.tipo === "erro") { m.erro = ev.mensagem; }
  return false;
}
// "simple compaction": resume o que foi conversado e começa uma conversa nova (nada antigo é reenviado)
async function recomecarFio(modo) {
  const linhas = S.chat.filter((x) => x.fio === modo || (x.de === "u" && modo === "conversa")).slice(-40).map((x) => x.de === "u" ? `Viajante: ${x.txt}` : `Marco: ${x.txt}${(x.cards || []).map((k) => ` [${k.name}: ${k.estado}${k.resultado ? " · " + k.resultado : ""}]`).join("")}`).join("\n");
  let resumo = null;
  try { const r = await fetch(API + "/resumir", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ texto: linhas }) }); if (r.ok) resumo = (await r.json()).resumo; } catch (e) {}
  for (const x of S.chat) if (x.fio === modo && x.toolUses) x.respondido = true;
  S.fios[modo] = { ...fioVazio(), resumo };
}

// aplica uma proposta aprovada; devolve o texto que volta ao Marco e a entrada do histórico
function paradaDeInput(i) {
  const est = i.chegada_lat != null && i.chegada_lng != null ? (() => { const km = kmEntre({ lat: i.chegada_lat, lng: i.chegada_lng }, { lat: i.lat, lng: i.lng }); return { n: i.chegada_nome || "Ponto de chegada", lat: i.chegada_lat, lng: i.chegada_lng, km: Math.round(km * 100) / 100, min: i.trecho_pe_min || Math.max(1, Math.round(km * 15)) }; })() : null;
  return { id: novoId(), n: i.nome, t: i.tipo || "passeio", h: i.horario || "", dur: i.duracao_min ? fmtDur(i.duracao_min) : "", lat: +i.lat, lng: +i.lng, end: i.endereco || "", tel: i.telefone || null, site: i.site || null, selo: i.selo || "vermelho", est, marco: true };
}
function aplicarProposta(k, v) {
  const i = k.input || {};
  if (k.name === "propor_parada") {
    const d = diaObj(i.dia); if (!d) throw new Error(`a viagem não tem o dia ${i.dia}`);
    if (!Number.isFinite(+i.lat) || !Number.isFinite(+i.lng)) throw new Error("a parada veio sem coordenadas");
    const p = paradaDeInput(i), pernoiteAntes = p.t === "pernoite" ? d.pernoite || null : undefined;
    d.paradas.push(p); if (p.t === "pernoite") d.pernoite = p.n; recalcRota(d);
    return { texto: `Aprovado e aplicado: ${p.n} no D${d.dia} às ${p.h}.`, hist: registrar(`D${d.dia}: ${p.n} incluído às ${p.h}`, "parada", { dia: d.dia, id: p.id, pernoiteAntes }) };
  }
  if (k.name === "propor_dia") {
    const idx = DIAS.findIndex((x) => x.dia === +i.dia); if (idx < 0) throw new Error(`a viagem não tem o dia ${i.dia}`);
    const antes = JSON.parse(JSON.stringify(DIAS[idx])), d = DIAS[idx];
    d.titulo = i.titulo; d.paradas = (i.paradas || []).filter((p) => Number.isFinite(+p.lat)).map(paradaDeInput);
    const pn = d.paradas.find((p) => p.t === "pernoite"); d.pernoite = pn ? pn.n : null; d.poly = []; recalcRota(d);
    return { texto: `Aprovado e aplicado: D${d.dia} montado (${d.paradas.length} paradas).`, hist: registrar(`D${d.dia} montado: ${d.titulo}`, "dia", { dia: d.dia, antes }) };
  }
  if (k.name === "propor_lancamento") {
    const c = cle(); if (!c) throw new Error("a Carteira ainda está carregando");
    const vs = c.viajantes(), acha = (n) => vs.find((x) => norm(x.nome) === norm(n));
    const por = acha(i.quem_pagou), resp = (i.dividir_com || []).map(acha);
    if (!por || resp.some((x) => !x)) throw new Error(`viajante não encontrado na Carteira (${[i.quem_pagou, ...(i.dividir_com || [])].filter((n) => !acha(n)).join(", ")})`);
    const ml = c.moedaLocal(), moeda = i.moeda === ml.cod ? ml.cod : i.moeda === "BRL" ? "BRL" : null;
    if (!moeda) throw new Error(`a Carteira usa ${ml.cod} e BRL; ${i.moeda} precisa ser convertido`);
    const dados = { desc: i.descricao, cat: CATS[i.categoria] ? i.categoria : "out", valor: Math.round(+i.valor * 100) / 100, moeda, status: SITUACAO[i.situacao] ? i.situacao : "realizado", por: por.id, resp: resp.map((x) => x.id), obs: "Lançado pelo Marco" + (i.motivo ? ": " + i.motivo : "") };
    if (i.dia != null) dados.dia = +i.dia;
    const id = c.lancar(dados); if (!id) throw new Error("a Carteira recusou o lançamento");
    return { texto: `Lançado na Carteira: ${i.descricao}, ${moeda} ${dados.valor.toFixed(2)}.`, hist: registrar(`Carteira: ${i.descricao} (${dinheiro(dados.valor, moeda === "BRL" ? "R$" : ml.simb)})`, "lanc", { lancId: id }) };
  }
  if (k.name === "propor_tarefa") {
    garantirListas(); const id = novoId();
    S.listas.tarefas.push({ id, g: i.grupo || "Fazer agora", t: i.titulo, s: i.detalhe || "" });
    return { texto: `Tarefa criada (id ${id}).`, hist: registrar(`Checklist: ${i.titulo}`, "tarefa", { id }) };
  }
  if (k.name === "propor_concluir_tarefa") {
    if (!tarefasLista().some((t) => t.id === i.id)) throw new Error("tarefa não encontrada");
    S.tarefas[i.id] = true;
    return { texto: "Tarefa marcada como concluída.", hist: registrar(`Checklist: concluída "${textoTarefa(tarefasLista().find((t) => t.id === i.id))}"`, "concluir", { id: i.id }) };
  }
  if (k.name === "propor_desejo") {
    garantirListas(); const id = novoId(), st = v === "talvez" ? "Ideia" : "Desejo";
    S.listas.desejos.push({ id, n: i.nome, s: [i.detalhe, i.cidade].filter(Boolean).join(" · "), st });
    return { texto: v === "talvez" ? "O viajante marcou Talvez: guardado como Ideia." : "O viajante quer: entrou na lista de desejos.", hist: registrar(`${st}: ${i.nome}`, "desejo", { id }) };
  }
  if (k.name === "propor_info_viagem") {
    S.viagem.info = S.viagem.info || {}; const antes = S.viagem.info[i.campo] ?? null; S.viagem.info[i.campo] = i.valor;
    return { texto: "Informação gravada.", hist: registrar(`Informação: ${i.campo.replace(/_/g, " ")} = ${i.valor}`, "info", { campo: i.campo, antes }) };
  }
  throw new Error("proposta desconhecida");
}
// traçado e tempos reais do dia (Mapbox, pelo servidor); sem servidor, o mapa liga as paradas em linha reta
function recalcRota(d) {
  if (!API || !S.rotasOn) return;
  const pts = paradasDo(d).filter((p) => Number.isFinite(+p.lat)).map((p) => (p.est ? { lat: p.est.lat, lng: p.est.lng } : { lat: +p.lat, lng: +p.lng }));
  if (pts.length < 2) { d.poly = []; d.km = 0; d.min = 0; return; }
  fetch(API + "/rota", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ pontos: pts.slice(0, 25), modo: "carro" }) })
    .then((r) => r.json()).then((j) => { if (j.erro) return; d.poly = j.poly; d.km = Math.round(j.km); d.min = j.min; render(); }).catch(() => {});
}

// ---------- mapa em SVG (traçado real da estrada quando houver; senão, paradas ligadas em linha reta) ----------
function svgMapa(d, { alto = 330, foco = -1, zoom = null } = {}) {
  const W = 360, H = alto, P = 22;
  const ps = paradasDo(d).filter((p) => Number.isFinite(+p.lat));
  const linha = d.poly && d.poly.length > 1 ? d.poly : ps.map((p) => [+p.lat, +p.lng]);
  let pts = zoom ? zoom : [...linha, ...ps.map((p) => [+p.lat, +p.lng])];
  if (!pts.length) return `<svg viewBox="0 0 ${W} ${Math.min(H, 120)}" role="img" aria-label="Mapa vazio"><rect width="${W}" height="${Math.min(H, 120)}" fill="var(--map)"/><text x="${W / 2}" y="${Math.min(H, 120) / 2 + 4}" text-anchor="middle" font-size="13" font-family="var(--font)" fill="var(--fg2)">Sem locais neste dia</text></svg>`;
  const lat0 = pts.reduce((s, p) => s + p[0], 0) / pts.length;
  const kx = Math.cos((lat0 * Math.PI) / 180);
  const xs = pts.map((p) => p[1] * kx), ys = pts.map((p) => -p[0]);
  let x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const span = Math.max((x1 - x0) / (W - 2 * P), (y1 - y0) / (H - 2 * P), 1e-4);
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  const X = (lng) => W / 2 + (lng * kx - cx) / span, Y = (lat) => H / 2 + (-lat - cy) / span;
  const path = linha.map((p, i) => `${i ? "L" : "M"}${X(p[1]).toFixed(1)} ${Y(p[0]).toFixed(1)}`).join("");
  const reta = !(d.poly && d.poly.length > 1);
  const uid = "m" + (++svgN);
  const kmPorPx = span * 111;
  const esc0 = [0.1, 0.2, 0.5, 1, 2, 5, 10, 20, 50, 100, 200].find((k) => k / kmPorPx >= 40) || 200;
  const escPx = esc0 / kmPorPx, escTxt = esc0 < 1 ? `${esc0 * 1000} m` : `${esc0} km`;
  const postos = zoom ? "" : (d.postos || []).map((p) => `<g transform="translate(${X(p.lng).toFixed(1)} ${Y(p.lat).toFixed(1)})"><circle r="7" fill="var(--card)" stroke="var(--line)" stroke-width="1" filter="url(#${uid}s)"/><path d="M-2.6 -3.4h3.6v6.6h-3.6zM1 -1.6l1.8 1.3v2.6" fill="none" stroke="var(--fg2)" stroke-width="1.1" stroke-linejoin="round"/></g>`).join("");
  const ini = linha[0], fim = linha[linha.length - 1];
  const marcas = zoom || !ini ? "" : `<circle cx="${X(ini[1]).toFixed(1)}" cy="${Y(ini[0]).toFixed(1)}" r="5" fill="var(--card)" stroke="var(--accent)" stroke-width="2.5"/><g transform="translate(${X(fim[1]).toFixed(1)} ${Y(fim[0]).toFixed(1)})"><rect x="-6" y="-6" width="12" height="12" rx="3" fill="var(--fg)"/><path d="M-3 2V-2.5M-3 0h6v2M3 0a1.6 1.6 0 0 0-1.6-1.6h-2" stroke="var(--bg)" stroke-width="1.1" fill="none"/></g>`;
  const todas = paradasDo(d);
  const pins = todas.map((p, i) => {
    if ((p.t === "inicio" && i > 0) || !Number.isFinite(+p.lat)) return "";
    const c = seloDe(p), x = X(+p.lng).toFixed(1), y = Y(+p.lat).toFixed(1);
    const fill = c === "verde" ? "var(--accent)" : c === "amarelo" ? "var(--warn)" : "var(--bad)";
    const tc = c === "verde" ? "var(--accent-fg)" : "var(--card)";
    const s = i === foco ? 1.25 : 1;
    const est = p.est ? `<g transform="translate(${X(p.est.lng).toFixed(1)} ${Y(p.est.lat).toFixed(1)})"><rect x="-7" y="-7" width="14" height="14" rx="4" fill="var(--fg)"/><text y="3.6" text-anchor="middle" font-size="9.5" font-weight="700" font-family="var(--font)" fill="var(--bg)">P</text></g>` : "";
    return `${zoom ? est : ""}<g transform="translate(${x} ${y}) scale(${s})" filter="url(#${uid}s)"><path d="M0 0C-1.5-4-9-8.5-9-14.5a9 9 0 0 1 18 0C9-8.5 1.5-4 0 0z" fill="${fill}" stroke="var(--card)" stroke-width="1.5"/><text y="-11" text-anchor="middle" font-size="9.5" font-weight="700" font-family="var(--font)" fill="${tc}">${i + 1}</text></g>`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Mapa do dia ${d.dia}"><defs>
    <linearGradient id="${uid}g" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" style="stop-color:var(--map)"/><stop offset="1" style="stop-color:var(--map2)"/></linearGradient>
    <filter id="${uid}s" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="1.2" stdDeviation="1.2" flood-color="#000" flood-opacity=".28"/></filter></defs>
    <rect width="${W}" height="${H}" fill="url(#${uid}g)"/>
    ${path ? `<path d="${path}" fill="none" stroke="var(--road)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"${reta ? ' stroke-dasharray="2 7"' : ""}/>` : ""}${marcas}${postos}${pins}
    ${H >= 120 ? `<g transform="translate(14 ${H - 14})"><path d="M0 -4V0H${escPx.toFixed(1)}V-4" fill="none" stroke="var(--fg2)" stroke-width="1.4"/><text x="${(escPx + 6).toFixed(1)}" y="1" font-size="10" font-family="var(--font)" fill="var(--fg2)">${escTxt}${reta && path ? " · trajeto ainda sem estradas" : ""}</text></g>` : ""}</svg>`;
}
let svgN = 0;
function miniRota(d) {
  const pts = d.poly && d.poly.length > 1 ? d.poly : paradasDo(d).filter((p) => Number.isFinite(+p.lat)).map((p) => [+p.lat, +p.lng]);
  if (!pts.length) return '<svg viewBox="0 0 54 54" aria-hidden="true"></svg>';
  const lat0 = pts[0][0], kx = Math.cos((lat0 * Math.PI) / 180);
  const xs = pts.map((p) => p[1] * kx), ys = pts.map((p) => -p[0]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const sp = Math.max(x1 - x0, y1 - y0, 1e-4) / 40;
  const X = (x) => 27 + (x - (x0 + x1) / 2) / sp, Y = (y) => 27 + (y - (y0 + y1) / 2) / sp;
  const p = pts.map((q, i) => `${i ? "L" : "M"}${X(q[1] * kx).toFixed(1)} ${Y(-q[0]).toFixed(1)}`).join("");
  const f = pts[pts.length - 1];
  return `<svg viewBox="0 0 54 54" aria-hidden="true"><path d="${p}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${X(f[1] * kx).toFixed(1)}" cy="${Y(-f[0]).toFixed(1)}" r="2.6" fill="var(--accent)"/></svg>`;
}
function telaMapa() {

    <div class="daynav"><button class="iconbtn" data-a="diaMapa" data-v="-1" aria-label="Dia anterior">${ic("back")}</button>

    ${ps.length ? `<div class="list">${ps.map((p, i) => `<button class="row" data-a="lugar" data-d="${d.dia}" data-i="${i}"><span class="num ${seloDe(p) === "amarelo" ? "warn" : seloDe(p) === "vermelho" ? "bad" : ""}">${i + 1}</span>

  </div></main>`;

function telaConsumo() {
  const c = S.consumo;
  if (!c && API) setTimeout(() => A.consumoAtualizar(), 0);
  const usd = (v) => "US$ " + (+v || 0).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const cache = (x) => { const t = x.entrada + x.cacheLido + x.cacheEscrito; return t ? Math.round((100 * x.cacheLido) / t) + "%" : "–"; };
  const NOMES = { conversa: "Conversa (Sonnet 5.5)", planejamento: "Planejamento (Opus 5.5)", comprovante: "Comprovantes (Sonnet 5.5)", ficha: "Ficha da viagem", resumo: "Resumos para recomeçar conversa" };
  let corpo;
  if (!API) corpo = `<div class="card"><span class="small">O consumo aparece quando o Marco estiver ligado (computador de testes ou servidor na nuvem).</span></div>`;
  else if (!c) corpo = `<div class="small">Carregando…</div>`;
  else if (c.erro) corpo = `<div class="card"><span class="small">Não foi possível ler o consumo agora.</span></div>`;
  else corpo = `<div class="stats"><div class="stat"><b>${usd(c.hoje.usd)}</b><span>hoje</span></div><div class="stat"><b>${usd(c.mes.usd)}</b><span>no mês</span></div><div class="stat"><b>${cache(c.mes)}</b><span>vindo do cache</span></div></div>
      ${c.limiteDiaUsd ? `<div class="bar"><div class="l"><span>Limite do dia</span><span>${usd(c.hoje.usd)} de ${usd(c.limiteDiaUsd)}</span></div><div class="progress"><i style="width:${Math.min(100, (100 * c.hoje.usd) / c.limiteDiaUsd).toFixed(0)}%"></i></div></div>` : `<div class="small">Sem limite diário de gasto (desligado durante os testes).</div>`}
      <div class="list">${Object.entries(c.porModo).map(([k, x]) => `<div class="row"><div class="main"><b>${esc(NOMES[k] || k)}</b><span>${x.turnos} pedido(s) · ${x.chamadas} chamada(s) · cache ${cache(x)}${x.buscas ? ` · ${x.buscas} busca(s) na web` : ""}</span></div><span class="val">${usd(x.usd)}</span></div>`).join("") || `<div class="row"><span class="small">Nenhum uso neste mês.</span></div>`}</div>`;
  return `${header({ titulo: "Consumo do Marco", sub: "Inteligência artificial", voltar: true })}<main id="main"><div class="pad"><h1>Consumo</h1>
    <p class="sub">Cada pedido ao Marco é medido: tokens novos, tokens lidos do cache (bem mais baratos), resposta e buscas na web. Valores estimados pela tabela de preços da Anthropic.</p>
    ${corpo}
    <button class="btn sec" data-a="consumoAtualizar">Atualizar</button>
    <p class="small" style="margin:0">Quando houver limite diário, ao passar dele o Marco pausa até o dia seguinte e o resto do app continua funcionando. O limite fica no arquivo de chaves do servidor (LIMITE_DIARIO_USD).</p></div></main>`;
}

  diaHoje(ds) { S.diaHoje = Math.min(DIAS.length, Math.max(1, S.diaHoje + +ds.v)); render(); },
  fase(ds) {
    if (ds.v === "auto") { S.faseManual = false; faseAuto(); } else { S.faseManual = true; S.fase = ds.v; }
    render(); toast(S.fase === "viagem" ? "Na viagem, a tela inicial passa a ser o painel do dia." : "No planejamento, a tela inicial é a conversa com o Marco."); render();
  },
  perg(ds, el) { if (ds.k === "txt") { S.hist = []; S.tela = "conversa"; enviarTexto(el.textContent); } else pergunta(ds.k, el.textContent); },
  pedirMarco(ds) { S.hist = []; S.tela = "conversa"; enviarTexto(ds.q); },
  retry() { const m = S.chat[S.chat.length - 1]; if (!m || !m.reenvio) return; S.chat.pop(); enviarTexto(m.reenvio.txt, m.reenvio.opc); },
  async consumoAtualizar() { if (!API) return; try { S.consumo = await (await fetch(API + "/consumo")).json(); } catch (e) { S.consumo = { erro: true }; } render(); },
  falar() {
    if (exemploWestern() && !marcoDisponivel()) {
      if (S.voz === "ouvindo") return;
      const frase = "Tem posto de gasolina no caminho hoje?"; S.voz = "ouvindo"; S.transc = ""; render();
      let i = 0; const t = setInterval(() => { i += 3; S.transc = frase.slice(0, i); render(); if (i >= frase.length) { clearInterval(t); setTimeout(() => { S.voz = "parado"; S.transc = ""; pergunta("posto", frase); }, 400); } }, 60);
      return;
    }
    toast("A conversa por voz (ElevenLabs: voz do Eric e transcrição Scribe) entra na próxima etapa. Por enquanto, escreva para o Marco."); render();
    const el = $("#txtMarco"); if (el) el.focus();
  },
  sairCarteira() { A.voltar(); },
  async dono(ds) {
    S.viagem.dono = ds.n; S.overlay = null;
    if (!S.chat || !S.chat.some((m) => m.de === "u")) S.chat = null; // a saudação recomeça com o nome de quem usa o celular
    const c = await carteiraPronta();
    if (c && ds.id) c.definirDono(ds.id);
    render(); toast(`Pronto. Este celular é de ${ds.n}.`); render();
  },
  async exportar() {
    const d = await montarArquivo();
    await salvarArquivo(`viagem-${slug(S.viagem.nome)}-${slug(S.viagem.dono || "celular")}.json`, JSON.stringify(d));
  },
  async enviarPdf() {
    const d = await montarArquivo(), c = await carteiraPronta();
    if (!c) { toast("A Carteira ainda está carregando. Tente de novo em instantes."); render(); return; }
    const quando = new Date().toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
    const pdf = await c.pdf(JSON.stringify(d), ["Clé · Arquivo da viagem", "Viagem: " + S.viagem.nome, "Enviado por " + (S.viagem.dono || "?") + " em " + quando, "",
      "Para usar: no outro celular, abra o app Clé, toque em Mais > Arquivo da viagem", "e em Juntar arquivo recebido.", "", "A viagem inteira está guardada dentro deste arquivo."]);
    const nome = `viagem-${slug(S.viagem.nome)}-${slug(S.viagem.dono || "celular")}.pdf`;
    const file = new File([pdf], nome, { type: "application/pdf" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file] }); toast("No outro celular: Mais > Arquivo da viagem > Juntar arquivo recebido."); render(); return; } catch (e) { if (e.name === "AbortError") return; }
    }
    await salvarArquivo(nome, pdf);
  },
  async syncQR() { ir("carteira"); const c = await carteiraPronta(); if (c && c.tem()) c.sincronizar(); else { toast("Abra uma viagem primeiro."); render(); } },
  ajustesViagem() { ir("carteira"); const c = cle(); if (c) c.abrir("ajustes"); else { toast("A Carteira ainda está carregando. Tente de novo em instantes."); render(); } },
  aprovarLanc() {
    const c = cle();
    if (!c) { toast("A Carteira ainda está carregando. Tente de novo em instantes."); render(); return; }
    S.lancId = c.lancar({ desc: "Almoço", cat: "ali", valor: 38.5, resp: c.viajantes().map((v) => v.id), obs: "Lançado pelo Marco por voz" });
    render(); toast("Lançado na Carteira. Tudo continua editável lá."); render();
  },
  desfazerLanc() { const c = cle(); if (c && S.lancId) c.desfazer(S.lancId); S.lancId = null; render(); toast("Lançamento desfeito."); render(); },
  verLanc() { ir("carteira"); const c = cle(); if (c) c.abrir("lista"); },
  aprovar() { S.extras[3] = [SYLVAN]; render(); toast("Adicionado ao D3. Roteiro e mapa atualizados.", "desfazer"); render(); },
  desfazer() { S.extras[3] = []; S.toast = null; render(); toast("Alteração desfeita."); render(); },
  decidir(ds) {
    const m = S.chat[+ds.m], k = m && m.cards && m.cards[+ds.c]; if (!k || k.estado !== "aguardando" || S.pensando) return;
    if (ds.v === "aprovar" || ds.v === "talvez") {
      try { const r = aplicarProposta(k, ds.v); k.estado = ds.v === "talvez" ? "talvez" : "aprovado"; k.resultado = r.texto; k.hist = r.hist; }
      catch (e) { k.estado = "erro"; k.resultado = "Não foi possível aplicar: " + e.message + "."; }
    } else if (ds.v === "recusar") { k.estado = "recusado"; k.resultado = k.name === "propor_desejo" ? "O viajante respondeu Não: não quer este item." : "Recusado pelo viajante."; }
    else { k.estado = "ajustar"; k.resultado = "O viajante quer ajustar esta proposta antes de aprovar. Pergunte o que mudar."; }
    render();
    // os resultados seguem com a próxima mensagem desta conversa (sem chamada extra ao Marco);
    // comprovante é conversa avulsa: o que foi decidido vira uma nota para a conversa principal
    if (m.fio === "comprovante" && m.cards.every((x) => x.estado !== "aguardando")) S.notas.push(`[Comprovante lido em conversa à parte; decisões do viajante: ${m.cards.map((x) => `${x.name.replace("propor_", "")} ${x.estado}: ${x.resultado}`).join(" | ")}]`);
  },
  desfazerHist(ds) { if (desfazerHist(ds.id)) { render(); toast("Alteração desfeita."); } render(); },
  toast(ds) { toast(ds.m); render(); },
  tarefa(ds) { if (ds.id === "conf") return; S.tarefas[ds.id] = !S.tarefas[ds.id]; render(); },
  comprovante(ds) { S.comp = { id: ds.id || null, cat: ds.cat || "Outros", etapa: 0 }; S.overlay = "comprovante"; render(); },
  compCat(ds) { S.comp.cat = ds.v; render(); },
  async cofreAbrir(ds) { try { const x = await cofreOp("readonly", (st) => st.get(ds.id)); if (!x) return; const u = URL.createObjectURL(x.blob); const w = window.open(u, "_blank"); if (!w) { const a = document.createElement("a"); a.href = u; a.download = x.nome; a.click(); } } catch (e) { toast("Não foi possível abrir o documento."); render(); } },
  async cofreApagar(ds) { if (!confirm("Remover este documento do Cofre deste celular?")) return; await cofreOp("readwrite", (st) => st.delete(ds.id)); await cofreAtualizar(); render(); toast("Documento removido."); render(); },
  confirmarLocal() { S.overlay = "confirmar"; render(); },
  confOk() { const p = paradasDo(diaObj(S.lugar.d))[S.lugar.i]; S.confirmados[p.n] = true; registrar(`Local confirmado no mapa: ${nomeLimpo(p.n)}`, "confirmar", { n: p.n }); S.overlay = null; render(); toast("Local confirmado. O selo ficou verde."); render(); },
  ajustarLocal() { const p = paradasDo(diaObj(S.lugar.d))[S.lugar.i]; S.overlay = null; S.hist = []; S.tela = "conversa"; enviarTexto(`O ponto de "${nomeLimpo(p.n)}" no D${S.lugar.d} não está certo. Procure de novo, de preferência o ponto de chegada de carro, e proponha a correção.`); },
  aceitarGuia() { S.guiaAceito = true; registrar(`Guia liberado com ${aConfirmar()} local(is) a confirmar`, "guia", {}); render(); },
  imprimirGuia() { if (aConfirmar() && !S.guiaAceito) return; $("#print").innerHTML = htmlGuia(); setTimeout(() => window.print(), 60); },
  convidar() { toast("Convites por link chegam com o servidor da viagem. Por enquanto, envie o arquivo da viagem: cada um abre no próprio celular e vocês juntam os arquivos."); ir("arquivo"); },
  buscaAbrir() { S.busca = { q: "", res: null }; S.overlay = "busca"; render(); setTimeout(() => { const e = $("#qBusca"); if (e) e.focus(); }, 50); },
  buscaAdd(ds) {
    const r = S.busca.res, x = +ds.i === 0 ? r.escolhido : r.alternativas[+ds.i - 1]; garantirListas();
    const id = novoId(); S.listas.desejos.push({ id, n: x.nome, s: x.endereco || "", st: "Desejo", lat: x.lat, lng: x.lng, selo: +ds.i === 0 ? r.selo : "amarelo" });
    registrar(`Desejo: ${x.nome}`, "desejo", { id }); S.overlay = null; render(); toast(`${x.nome} entrou na lista de desejos.`); render();
  },
  compartilharLocal() {
    toast("Obtendo sua localização…"); render();
    comPosicao(async (la, lo) => {
      const txt = `${(S.viagem && S.viagem.dono) || "Estou"} aqui agora: https://maps.google.com/?q=${la.toFixed(6)},${lo.toFixed(6)}`;
      if (navigator.share) { try { await navigator.share({ text: txt }); return; } catch (e) { if (e.name === "AbortError") return; } }
      try { await navigator.clipboard.writeText(txt); toast("Localização copiada. Cole no WhatsApp do grupo."); } catch (e) { toast(`Sua localização: ${la.toFixed(5)}, ${lo.toFixed(5)}`); }
      render();
    });
  },
  hospitais() { comPosicao((la, lo) => { window.open(`https://www.google.com/maps/search/hospital/@${la.toFixed(5)},${lo.toFixed(5)},14z`, "_blank"); }); },
  falarFrase(ds) { const l = idiomaLocal(); falarTexto(FRASES[+ds.i][l], l); },
  setPerfil(ds) { const pf = ds.alvo === "onb" ? S.onb.pf : perfilAtual(); pf[ds.k] = ds.v; render(); },
  setInteresse(ds) { const pf = ds.alvo === "onb" ? S.onb.pf : perfilAtual(); pf.int = pf.int || {}; pf.int[ds.n] = ((pf.int[ds.n] || 0) + 1) % 4; render(); },
  alerta() { S.overlay = "alerta"; render(); }, notif() { S.overlay = "notif"; render(); setTimeout(() => { if (S.overlay === "notif") { S.overlay = null; render(); } }, 6000); },
  fechar(ds) { S.overlay = null; render(); if (ds && ds.m) { toast(ds.m); render(); } },
  fecharIr(ds) { S.overlay = null; S.hist = []; S.tela = ds.t; S.rolarFim = true; render(); },
  fecharFundo(ds, el, ev) { if (ev.target === el) { S.overlay = null; render(); } },
  pedirFechar() { S.overlay = "fechar"; render(); },
  async fecharViagem() {
    const c = await carteiraPronta(); if (c) c.apagar();
    try { await cofreOp("readwrite", (st) => st.clear()); } catch (e) {}
    S.cofreDocs = [];
    memApagar(); DIAS = []; S.viagem = null; aplicarEstado(null); S.overlay = null; S.hist = []; S.tela = "boasvindas"; render();
    toast("Viagem fechada neste aparelho. O arquivo exportado continua valendo."); render();
  },
  onb() { S.onb = novaOnb(); ir("onboarding"); },
  async onbMarco() {
    const o = S.onb; if (!o.f.fala.trim()) { toast("Conte primeiro sobre a viagem, no campo acima."); render(); return; }
    o.lendo = true; render();
    try {
      // pedido avulso e barato (sem histórico): só extrai a ficha; o viajante confere cada campo
      const r = await fetch(API + "/ficha", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ fala: o.f.fala, hoje: hojeISO(), quem: o.f.nome || null }) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.erro || "O Marco não respondeu.");
      if (j.ficha) preencherFicha(j.ficha); else toast("O Marco não encontrou dados suficientes na fala. Complete a ficha abaixo.");
    } catch (e) { toast(e.message || "O Marco não respondeu. Preencha a ficha abaixo."); }
    o.lendo = false; render();
  },
  onbNext() {
    const o = S.onb, f = o.f;
    if (o.step === 0) {
      const falta = [["nome", "seu nome"], ["destino", "o destino"], ["pais", "o país principal"], ["inicio", "a data de início"], ["dias", "quantos dias"]].filter(([k]) => !String(f[k] || "").trim()).map(([, l]) => l);
      if (!(+f.dias > 0) && !falta.includes("quantos dias")) falta.push("quantos dias");
      if (falta.length) { toast(`Para começar falta: ${falta.join(", ")}.`); render(); return; }
    }
    o.step++; if (o.step === 4) { aplicarCenarios(o); buscarCambio(); }
    render(); $("#main").scrollTop = 0;
  },
  onbVoltar() { S.onb.step = Math.max(0, S.onb.step - 1); render(); },
  onbCen(ds) { S.onb.cen[+ds.s] = +ds.i; render(); },
  async onbFim() {
    const o = S.onb, f = o.f, p = paisDe(f.pais);
    const cot = p && p.moeda === "BRL" ? 1 : numBR(f.cotacao);
    if (!(cot > 0)) { toast(`Informe o câmbio: quantos reais vale 1 ${p ? p.moeda : "unidade"} hoje.`); render(); return; }
    const nome = f.nome.trim(), outrosN = f.outros.split(",").map((x) => x.trim()).filter((x) => x && norm(x) !== norm(nome));
    const pf = { ...o.pf, maxDirecao: o.pf.maxDirecao ? numBR(o.pf.maxDirecao) : null, ocasiao: f.ocasiao, saindoDe: f.saindoDe, reservado: f.reservado, orcamento: f.orcamento, fala: f.fala };
    S.viagem = { nome: (f.nomeViagem || f.destino).trim(), destino: f.destino.trim(), pais: f.pais, idioma: p.lang, inicio: f.inicio, dias: +f.dias, viajantes: [nome, ...outrosN], dono: nome, emergencia: p.sos, moeda: { cod: p.moeda, simb: p.simb }, cotacao: cot, perfil: pf, info: {} };
    DIAS = []; aplicarEstado(null); garantirDias(); garantirListas(); faseAuto();
    const c = await carteiraPronta(); if (c) c.criar(cfgCarteira(S.viagem), outrosN, nome);
    S.hist = []; S.tela = S.fase === "viagem" ? "hoje" : "conversa"; S.chat = null; render();
    toast("Viagem criada. A Carteira já nasceu configurada."); render();
    if (marcoDisponivel()) { S.tela = "conversa"; enviarTexto("Acabei de criar a viagem. Sugira as principais atrações dos destinos para escolhermos (Quero, Talvez ou Não), de acordo com o nosso perfil."); }
  },
};

document.addEventListener("click", (ev) => {
  const el = ev.target.closest("[data-a]"); if (!el) return;
  const f = A[el.dataset.a]; if (!f) return;
  if (el.dataset.a !== "fecharFundo") ev.preventDefault();
  f(el.dataset, el, ev);
});
document.addEventListener("submit", async (ev) => {
  const fm = ev.target.closest("[data-f]"); if (!fm) return;
  ev.preventDefault();
  if (fm.dataset.f === "marco") { const t = S.rascunho; S.rascunho = ""; await enviarTexto(t); }
  if (fm.dataset.f === "busca") {
    const b = S.busca; if (!b.q.trim()) return;
    if (!API) { b.res = { erro: "A busca de lugares usa o servidor do Marco, que ainda não está ligado neste endereço. Peça o lugar ao Marco no computador de testes." }; render(); return; }
    b.carregando = true; b.res = null; render();
    const ref = DIAS.flatMap((d) => paradasDo(d)).find((p) => p.t === "pernoite" && Number.isFinite(+p.lat));
    try { b.res = await (await fetch(API + "/lugar", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ consulta: b.q, pais: S.viagem && S.viagem.pais, perto: ref ? { lat: +ref.lat, lng: +ref.lng } : null }) })).json(); }
    catch (e) { b.res = { erro: "A busca não respondeu. Verifique a internet." }; }
    b.carregando = false; render();
  }
});
document.addEventListener("change", (ev) => {
  const t = ev.target;
  const f = t.files && t.files[0];
  if (f) {
    if (t.id === "arquivo") receberComprovante(f);
    if (t.id === "arqViagem") abrirArquivoViagem(f);
    if (t.id === "arqJuntar") juntarArquivo(f);
    t.value = ""; return;
  }
  if (t.dataset.onb === "pais" && S.onb) { S.onb.f.pais = t.value; S.onb.f.cotacao = ""; }
  if (t.dataset.onbSl || t.dataset.pfSl) render();
});
document.addEventListener("input", (ev) => {
  const t = ev.target, ds = t.dataset;
  if (t.id === "txtMarco") S.rascunho = t.value;
  else if (t.id === "qBusca" && S.busca) S.busca.q = t.value;
  else if (ds.onb && S.onb) { if (ds.onb in S.onb.f) S.onb.f[ds.onb] = t.value; else S.onb.pf[ds.onb] = t.value; }
  else if (ds.onbSl && S.onb) { S.onb.pf.sl[ds.onbSl] = +t.value; S.onb.slManual = true; }
  else if (ds.pf && S.viagem) { perfilAtual()[ds.pf] = ds.pf === "maxDirecao" ? (t.value ? numBR(t.value) : null) : t.value; memSalvar(); }
  else if (ds.pfSl && S.viagem) { const pf = perfilAtual(); pf.sl = pf.sl || {}; pf.sl[ds.pfSl] = +t.value; memSalvar(); }
  else if (ds.saude) { const s = saudeLer(); s[ds.saude] = t.value; saudeSalvar(s); }
});

// ---------- partida ----------
const _mem = memLer();
if (_mem && _mem.viagem && _mem.viagem.dono) {
  S.viagem = _mem.viagem; DIAS = (_mem.roteiro && _mem.roteiro.dias) || []; aplicarEstado(_mem.estado); garantirDias(); faseAuto(); S.diaSel = S.diaHoje;
  S.tela = S.fase === "viagem" ? "hoje" : "conversa";
} else S.tela = "boasvindas";
checarMarco();
cofreAtualizar().then(render);
// app instalável (PWA): funciona sem internet depois da primeira abertura
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  const jaTinha = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (jaTinha) { toast("Nova versão do app instalada. Feche e abra de novo para usar."); render(); } });
  navigator.serviceWorker.register("sw.js").then((r) => r.update()).catch(() => {});
}
render();
</script>
