  if (mandarEstrutura && peer) L.estrEnviada[peer] = { hash: vh, ts };
  return { t:'fvs', v:2, viagem:S.viagem.id, de:eu, nome:nomeP(S.aparelho), ts, acks:{...L.recebido}, vh,
    lanc, exc, ...(ajuste ? { aj: ajuste } : {}), ...(mandarEstrutura ? { via:S.viagem.viajantes, cats:S.categorias } : {}), rg: resumoGrupos() };
}
function aplicarPacote(P){
  if (!P || P.t !== 'fvs') throw new Error('Código não reconhecido');
  if (P.viagem !== S.viagem.id) throw new Error('Este código é de outra viagem');
  if (P.de === meuDisp()) throw new Error('Este é o código deste próprio celular');
  if (P.v === 2) P.lanc = P.lanc.map(expandir);
  for (const l of P.lanc) { l.partes ??= null; l.obs ??= ''; l.fatura ??= null; l.fonte ??= null; l.pagamentos ??= null; l.foto = null; l.incluir ??= true; }
  const r = juntar({ lanc:P.lanc, excluidos:P.exc, viagem:{viajantes:P.via || []}, categorias:P.cats || [] }, P.de);
  const L = S.local;
  L.hashOutro ||= {}; if (P.vh) L.hashOutro[P.de] = P.vh;
  L.recebido[P.de] = Math.max(L.recebido[P.de] || 0, P.ts);
  const ack = P.acks && P.acks[meuDisp()];
  if (ack) L.enviadoOk[P.de] = Math.max(L.enviadoOk[P.de] || 0, ack);
  L.ultimaSync[P.de] = { quando: Date.now(), nome: P.nome || 'outro celular' };
  save(); render();
  return r;
}
// pacote → partes para QR: JSON → deflate → base45 (modo alfanumérico do QR, ~25% mais compacto) → pedaços
// Cada parte: "FV2:SESS:i:n:dados". Pedaços pequenos (249 caracteres) = QR com pontos grandes, fácil de ler.
const B45 = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ $%*+-./:';
const TAM_PARTE = 249; // múltiplo de 3 (cada 2 bytes viram 3 caracteres)
function b45enc(b){ let t = ''; for (let i = 0; i < b.length; i += 2) { if (i + 1 < b.length) { const n = b[i] * 256 + b[i + 1]; t += B45[n % 45] + B45[Math.floor(n / 45) % 45] + B45[Math.floor(n / 2025)]; } else { const n = b[i]; t += B45[n % 45] + B45[Math.floor(n / 45)]; } } return t; }
function b45dec(t){ const out = []; for (let i = 0; i < t.length; i += 3) { const c = B45.indexOf(t[i]), d = B45.indexOf(t[i + 1]);
  if (c < 0 || d < 0) throw new Error('Código inválido');
  if (i + 2 < t.length) { const e = B45.indexOf(t[i + 2]); if (e < 0) throw new Error('Código inválido'); const n = c + d * 45 + e * 2025; out.push(n >> 8, n & 255); } else out.push(c + d * 45); }
  return new Uint8Array(out); }
async function codificar(P){
  const bytes = new Uint8Array(await new Response(new Blob([JSON.stringify(P)]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer());
  const txt = b45enc(bytes), n = Math.max(1, Math.ceil(txt.length / TAM_PARTE));
  let sid = ''; for (let i = 0; i < 4; i++) sid += '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ'[Math.floor(Math.random() * 36)];
  return Array.from({length:n}, (_, i) => `FV2:${sid}:${i + 1}:${n}:${txt.slice(i * TAM_PARTE, (i + 1) * TAM_PARTE)}`);
}
async function descomprimir(bytes){ return JSON.parse(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text()); }
async function decodificar(pedacos, versao){
  if (versao === 1) { const bin = atob(pedacos.join('')), bytes = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i); return descomprimir(bytes); }
  return descomprimir(b45dec(pedacos.join('')));
}
function desenharQR(canvas, texto){
  const qr = qrcode(0, 'M'); qr.addData(texto, /^[0-9A-Z $%*+\-./:]*$/.test(texto) ? 'Alphanumeric' : 'Byte'); qr.make();
  const n = qr.getModuleCount(), borda = 4;
  const alvo = Math.min(380, (document.getElementById('sheetIn')?.clientWidth || 360) - 56);
  const px = Math.max(3, Math.floor(alvo / (n + borda * 2)));
  canvas.width = canvas.height = (n + borda * 2) * px;
  const g = canvas.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, canvas.width, canvas.height); g.fillStyle = '#000';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) g.fillRect((c + borda) * px, (r + borda) * px, px, px);
}
async function manterTelaAcesa(){ try { if ('wakeLock' in navigator && !SYNC.lock) SYNC.lock = await navigator.wakeLock.request('screen'); } catch(e){} }
function pararSync(){
  clearInterval(SYNC.timer); SYNC.timer = null; cancelAnimationFrame(SYNC.loop); SYNC.loop = null;
  if (SYNC.stream) { SYNC.stream.getTracks().forEach(t => t.stop()); SYNC.stream = null; }
  if (SYNC.lock) { SYNC.lock.release().catch(() => {}); SYNC.lock = null; }
}
function resumo(r){ return r.novos + r.atualizados + r.removidos ? `${r.novos} novo(s) · ${r.atualizados} atualizado(s) · ${r.removidos} removido(s)` : 'nenhuma mudança nova'; }
const PARTES_GRANDE = 8; // acima disso, sugere enviar por arquivo

function abrirSync(){
  pararSync(); SYNC.meio = null;
  $('#sheetIn').innerHTML = `<div class="grab"></div><div class="shead"><h2>Sincronizar celulares</h2><button class="iconbtn" data-close><svg class="i"><use href="#i-x"/></svg></button></div>
    <p class="sub" style="margin:0 0 6px">Os dois celulares lado a lado, com o app aberto. Não precisa de internet.</p>
    <div class="passo"><b>1</b><span>Neste celular, toque em <b style="all:unset;font-weight:700">Começar</b>. Ele mostra um QR Code.</span></div>
    <div class="passo"><b>2</b><span>No outro, toque em <b style="all:unset;font-weight:700">Ler o código do outro</b> e aponte a câmera, a uns 20 cm.</span></div>
    <div class="passo"><b>3</b><span>O outro celular mostra o código dele. Aqui, toque em <b style="all:unset;font-weight:700">Ler a resposta</b>. Quem começa também termina; não precisa inverter.</span></div>
    <button class="btn pri" id="syHost">Começar (mostrar meu código)</button>
    <button class="btn ghost" id="syCli" style="margin-top:8px">Ler o código do outro</button>
    <div class="hint" style="margin-top:12px">Muita coisa mudou desde a última vez (ex.: a primeira sincronização)? Envie por arquivo e, no outro celular, toque em <b>Juntar arquivo recebido</b> aqui nesta tela.</div>
    <button class="btn ghost" id="compArq" style="margin-top:8px">Enviar (Quick Share / WhatsApp)</button>
    <button class="btn ghost" id="impBtn" style="margin-top:8px"><svg class="i" style="vertical-align:-4px"><use href="#i-down"/></svg> Juntar arquivo recebido (PDF)</button>`;
  abrirSheet();
  $('#syHost').onclick = async () => mostrarCodigo(await codificar(montarPacote(null)), 'host');
  $('#syCli').onclick = () => lerCodigo(async P => {
    const r = aplicarPacote(P);
    // código de ajuste: responde com os mesmos grupos por inteiro (o que só este celular tiver também volta)
    mostrarCodigo(await codificar(montarPacote(P.de, P.aj)), 'client', r, P.nome);
  });
}
// host leu a resposta: confere se os dois ficaram iguais; se não, oferece o código de ajuste (só os grupos diferentes)
async function concluirSync(P, tentativa){
  const r2 = aplicarPacote(P);
  const dif = gruposDiferentes(P.rg), nome = esc(P.nome || 'o outro celular');
  SYNC.meio = dif.length ? 'ajuste' : null;
  if (!dif.length) {
    $('#sheetIn').innerHTML = `<div class="grab"></div><div class="ok-grande"><div class="ico">✓</div><h2 style="margin:0 0 4px">Sincronizado com ${nome}</h2><p class="sub">${resumo(r2)}${P.rg ? '<br>Conferido: os dois celulares estão iguais.' : ''}</p></div><button class="btn pri" data-close>Concluir</button>`;
    return;
  }
  const partes = await codificar(montarPacote(P.de, dif));
  $('#sheetIn').innerHTML = `<div class="grab"></div><div class="shead"><h2>Falta um ajuste</h2><button class="iconbtn" data-close><svg class="i"><use href="#i-x"/></svg></button></div>
    <p class="sub" style="margin:0 0 10px">Recebido: ${resumo(r2)}. Na conferência final, alguns lançamentos ainda estão diferentes entre os dois celulares.
    ${tentativa > 1 ? 'O ajuste pelo QR não resolveu; envie o arquivo completo (Quick Share ou WhatsApp) e, no outro celular, use <b>Juntar arquivo</b>.' : `Mostre o código de ajuste para ${nome} ler (${partes.length} parte${partes.length > 1 ? 's' : ''}); depois leia a resposta dele aqui.`}</p>
    ${tentativa > 1 ? '<button class="btn pri" id="compArq">Enviar arquivo completo</button>' : '<button class="btn pri" id="syAjuste">Mostrar código de ajuste</button>'}`;
  if ($('#syAjuste')) $('#syAjuste').onclick = () => mostrarCodigo(partes, 'host', null, null, tentativa + 1);
}
function mostrarCodigo(partes, papel, r, nomeOutro, tentativa = 1){
  pararSync(); manterTelaAcesa();
  const host = papel === 'host', varias = partes.length > 1;
  SYNC.meio = papel;
  $('#sheetIn').innerHTML = `<div class="grab"></div><div class="shead"><h2>${host ? 'Mostre ao outro celular' : 'Recebido de ' + esc(nomeOutro || 'outro celular')}</h2><button class="iconbtn" data-close><svg class="i"><use href="#i-x"/></svg></button></div>
    ${host ? '' : `<p class="sub" style="margin:0">✓ ${resumo(r)}.</p><div class="aviso-grande"><b>Falta 1 passo:</b> no outro celular, toque em <b>Ler a resposta do outro celular</b> e aponte para este código. Só assim as mudanças deste celular chegam lá.</div>`}
    ${partes.length > PARTES_GRANDE ? `<div class="aviso-grande">Sincronização grande: <b>${partes.length} partes</b> (normal quando muita coisa mudou). Pelo QR leva alguns minutos; <b>mais rápido: enviar por arquivo</b>. <button class="btn ghost sm" id="compArq" style="margin-top:8px;width:100%">Enviar por Quick Share / WhatsApp</button></div>` : ''}
    <div class="qrbox"><canvas id="qrc"></canvas></div>
    <div class="qrinfo" id="qri"></div>
    ${varias ? '<div class="qrctl"><button id="qAnt" aria-label="Parte anterior">◀</button><button id="qPausa">Pausar</button><button id="qProx" aria-label="Próxima parte">▶</button></div>' : ''}
    ${host ? '<button class="btn pri" id="syLerResp">Ler a resposta do outro celular</button>' : '<button class="btn pri" id="syCliOk">Pronto, o outro já leu</button>'}`;
  const cv = $('#qrc'); let i = 0, pausado = false;
  const mostra = () => { desenharQR(cv, partes[i]); $('#qri').textContent = varias ? `Parte ${i + 1} de ${partes.length}${pausado ? ' · pausado' : ''}` : 'Aponte a câmera do outro celular para este código'; };
  const avanca = d => { i = (i + d + partes.length) % partes.length; mostra(); };
  mostra();
  if (varias) {
    SYNC.timer = setInterval(() => { if (!pausado) avanca(1); }, 1500);
    $('#qAnt').onclick = () => { pausado = true; $('#qPausa').textContent = 'Continuar'; avanca(-1); };
    $('#qProx').onclick = () => { pausado = true; $('#qPausa').textContent = 'Continuar'; avanca(1); };
    $('#qPausa').onclick = () => { pausado = !pausado; $('#qPausa').textContent = pausado ? 'Continuar' : 'Pausar'; mostra(); };
  }
  if (host) $('#syLerResp').onclick = () => lerCodigo(P => concluirSync(P, tentativa));
  else $('#syCliOk').onclick = () => { SYNC.meio = null; fecharSheet(); };
}
async function carregarJsQR(){
  if (window.jsQR) return window.jsQR;
  await new Promise((ok, erro) => { const sc = document.createElement('script'); sc.src = 'lib/jsQR.js'; sc.onload = ok; sc.onerror = erro; document.head.appendChild(sc); });
  return window.jsQR;
}
async function lerCodigo(aoTerminar){
  pararSync(); manterTelaAcesa();
  $('#sheetIn').innerHTML = `<div class="grab"></div><div class="shead"><h2>Aponte para o código</h2><button class="iconbtn" data-close><svg class="i"><use href="#i-x"/></svg></button></div>
    <div class="cam"><video id="vid" playsinline muted></video><div class="mira"></div></div>
    <div class="qrinfo" id="lst">Abrindo a câmera…</div><div class="progresso"><i id="lpr"></i></div><div class="pontos" id="lpt"></div>
    <div class="hint" style="text-align:center">Segure a uns 20 cm. Se faltar alguma parte, use ◀ ▶ no outro celular para mostrá-la.</div>`;
  abrirSheet();
  const info = t => { const e = $('#lst'); if (e) e.textContent = t; };
  try { SYNC.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false }); }
  catch(e){ info('Não foi possível abrir a câmera. Permita o acesso à câmera para o app e tente de novo.'); return; }
  // foco contínuo quando o aparelho permite
  try { const tr = SYNC.stream.getVideoTracks()[0], cap = tr.getCapabilities ? tr.getCapabilities() : {}; if (cap.focusMode && cap.focusMode.includes('continuous')) await tr.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }); } catch(e){}
  const vid = $('#vid'); vid.srcObject = SYNC.stream; await vid.play().catch(() => {});
  let detector = null, jsqr = null;
  if ('BarcodeDetector' in window) { try { if ((await BarcodeDetector.getSupportedFormats()).includes('qr_code')) detector = new BarcodeDetector({ formats: ['qr_code'] }); } catch(e){} }
  if (!detector) { try { jsqr = await carregarJsQR(); } catch(e){ info('Leitor de QR indisponível neste aparelho.'); return; } }
  const tela = document.createElement('canvas'), ctx = tela.getContext('2d', { willReadFrequently: true });
  let sid = null, total = 0, versao = 2; const partes = {};
  info('Procurando o código…');
  const desenharPontos = ultima => { const el = $('#lpt'); if (!el || total < 2) return; el.innerHTML = Array.from({length: total}, (_, k) => `<i class="${partes[k + 1] ? 'ok' : ''}${ultima === k + 1 ? ' at' : ''}"></i>`).join(''); };
  const tratar = async texto => {
    let m = /^FV2:([0-9A-Z]{4}):(\d+):(\d+):([\s\S]*)$/.exec(texto || ''), v = 2;
    if (!m) { m = /^FV1\|(\w+)\|(\d+)\|(\d+)\|([\s\S]*)$/.exec(texto || ''); v = 1; }
    if (!m) return false;
    if (sid !== m[1]) { sid = m[1]; total = +m[3]; versao = v; for (const k in partes) delete partes[k]; }
    partes[+m[2]] = m[4];
    const n = Object.keys(partes).length;
    const faltam = Array.from({length: total}, (_, k) => k + 1).filter(k => !partes[k]);
    info(total > 1 ? (faltam.length ? `Recebidas ${n} de ${total}${faltam.length <= 6 ? ' · faltam: ' + faltam.join(', ') : ''}` : 'Todas as partes recebidas!') : 'Lido!');
    const pr = $('#lpr'); if (pr) pr.style.width = (n / total * 100) + '%';
    desenharPontos(+m[2]);
    if (n < total) return false;
    pararSync();
    try { const P = await decodificar(Array.from({length: total}, (_, k) => partes[k + 1]), versao); await aoTerminar(P); }
    catch(e){ info(e.message || 'Código inválido'); toast(e.message || 'Código inválido'); }
    return true;
  };
  let ocupado = false;
  const rodar = async () => {
    if (!SYNC.stream) return;
    if (!ocupado && vid.readyState >= 2) {
      ocupado = true;
      try {
        if (detector) { const cods = await detector.detect(vid); for (const c of cods) if (await tratar(c.rawValue)) return; }
        else { tela.width = vid.videoWidth; tela.height = vid.videoHeight; ctx.drawImage(vid, 0, 0); const img = ctx.getImageData(0, 0, tela.width, tela.height);
          const c = jsqr(img.data, img.width, img.height, { inversionAttempts: 'dontInvert' }); if (c && await tratar(c.data)) return; }
      } catch(e){}
      ocupado = false;
    }
    SYNC.loop = requestAnimationFrame(rodar);
  };
  rodar();
}

function telaBoasVindas(){
  document.querySelector('.nav').style.display = 'none';
  $('#app').innerHTML = `<div class="welcome">
    <div class="logo"><svg class="i"><use href="#i-wallet"/></svg></div>
    <h1>Carteira</h1>
    <p>Controle de gastos da viagem, em duas moedas, funcionando sem internet. Os dados ficam só neste celular.</p>
    <button class="btn pri" id="wAbrir">Abrir arquivo da viagem</button>
    <button class="btn ghost" id="wNova">Criar uma viagem nova</button>
    <div class="hint" style="margin-top:16px">O arquivo da viagem (.json) vem de quem organizou a viagem ou da exportação de outro celular.</div>
  </div>`;
  $('#wAbrir').onclick = () => { MODO_IMP = 'abrir'; $('#imp').click(); };
  $('#wNova').onclick = formNovaViagem;
}
function formNovaViagem(){
  const hojeISO = new Date().toISOString().slice(0,10);
  $('#sheetIn').innerHTML = `<div class="grab"></div><div class="shead"><h2>Nova viagem</h2><button class="iconbtn" data-close><svg class="i"><use href="#i-x"/></svg></button></div>
    <div class="flabel">Nome da viagem</div><input class="field" id="nNome" placeholder="Ex.: Férias no Chile">
    <div class="row2"><div><div class="flabel">Primeiro dia</div><input class="field" type="date" id="nIni" value="${hojeISO}"></div>
      <div><div class="flabel">Número de dias</div><input class="field num" inputmode="numeric" id="nDias" value="10"></div></div>
    <div class="flabel">Seu nome</div><input class="field" id="nEu" placeholder="Ex.: Ana">
    <div class="row2"><div><div class="flabel">Moeda do destino</div><div style="display:flex;gap:6px"><input class="field" id="nLc" value="USD"><input class="field" id="nLs" value="US$"></div></div>
      <div><div class="flabel">Sua moeda</div><div style="display:flex;gap:6px"><input class="field" id="nNc" value="BRL"><input class="field" id="nNs" value="R$"></div></div></div>
    <div class="flabel">Cotação (1 moeda do destino = ? sua moeda)</div><input class="field num" inputmode="decimal" id="nCot" value="5,18">
    <button class="btn pri" id="nOk">Criar viagem</button>`;
  abrirSheet();
  $('#nOk').onclick = () => {
    const g = id => $('#' + id).value.trim();
    const cfg = { nome:g('nNome'), inicio:g('nIni'), dias:parseInt(g('nDias'),10), seuNome:g('nEu'), localCod:g('nLc'), localSimb:g('nLs'), nativaCod:g('nNc'), nativaSimb:g('nNs'), cotacao:numBR(g('nCot')) };
    if (!cfg.nome || !cfg.inicio || !(cfg.dias > 0) || !cfg.seuNome || !(cfg.cotacao > 0)) return toast('Preencha todos os campos');
    S = novaViagem(cfg); S.aparelho = S.viagem.viajantes[0].id; save(); fecharSheet(); iniciar(); toast('Viagem criada');
  };
}
function avisarVersaoNova(){
  if (document.querySelector('.atualizar')) return;
  const b = document.createElement('div'); b.className = 'atualizar';
  b.innerHTML = '<span>Nova versão do app disponível. Seus dados continuam como estão.</span><button>Atualizar</button>';
  b.querySelector('button').onclick = () => location.reload();
  document.body.appendChild(b);
}
function iniciar(){ document.querySelector('.nav').style.display = ''; render(); }

(async () => {
  const d = await DB.ler();
  if (d && d.viagem) { S = normalizar(d); iniciar(); if (!S.aparelho && !window.CLE_APP) perguntarDono(); }
  else telaBoasVindas();
  window.CLE_INICIADO = true; // Clé: o app só conversa com a Carteira depois da leitura inicial
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  if ('serviceWorker' in navigator && location.protocol !== 'file:' && !window.CLE_APP) { // Clé: dentro do app, quem cuida do offline é o app
    // quando uma versão nova assume o controle, oferece atualizar (sem recarregar sozinho no meio de um lançamento)
    const jaTinha = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (jaTinha) avisarVersaoNova(); });
    navigator.serviceWorker.register('sw.js').then(r => r.update()).catch(() => {});
    // ao voltar para o app (ele fica aberto em segundo plano no celular), procura versão nova de novo
    document.addEventListener('visibilitychange', () => { if (!document.hidden) navigator.serviceWorker.getRegistration().then(r => r && r.update()).catch(() => {}); });
  }
})();
