<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clé</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#24476B">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Clé">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
<style>
/* Layout adaptável (tela única com cabeçalho grande estilo iOS, conteúdo rolável e barra de abas):
   - celular e tela externa de dobráveis: ocupa a tela toda;
   - dobrável aberto e tablet (toque, tela larga): ocupa a tela toda, com o conteúdo centralizado em largura confortável;
   - computador com mouse: o app aparece como um aparelho no centro (útil para testar).
   Respeita as áreas seguras (entalhe da câmera, barra de status, bordas no modo paisagem).
   Visual sóbrio; um único destaque: azul-ardósia. */
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --fg:#1D1D1F; --fg2:#6E6E73; --fg3:#AEAEB2; --sep:#E3E3E8; --fill:#EBEBF0;
  --accent:#24476B; --accent-fg:#FFFFFF; --accent-soft:#E4EBF3;
  --ok:#1E6B34; --ok-bg:#E5F3E8; --warn:#8A4F00; --warn-bg:#FCEFD8; --bad:#B42318; --bad-bg:#FCE9E7;
  --map:#ECEAE4; --map2:#E3E0D8; --map-grid:#DFDCD4; --road:#FFFFFF; --orb:#24476B;
  --line:rgba(17,24,39,.07); --sh:0 1px 2px rgba(17,24,39,.04),0 2px 8px rgba(17,24,39,.05); --glass:rgba(255,255,255,.82);
  --font:"Geist",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:16px; --r-lg:22px;
  --col:760px; /* largura máxima do conteúdo em telas largas */
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --card:#1C1C1E; --fg:#F5F5F7; --fg2:#98989D; --fg3:#636366; --sep:#38383A; --fill:#2C2C2E;
  --accent:#8FB3DA; --accent-fg:#0B1B2B; --accent-soft:#1A2837;
  --ok:#7DD89A; --ok-bg:#132A1B; --warn:#F2C36B; --warn-bg:#35270D; --bad:#FF7B72; --bad-bg:#3A1513;
  --map:#1B1C1F; --map2:#151618; --map-grid:#26272B; --road:#34363B; --orb:#8FB3DA;
  --line:rgba(255,255,255,.07); --sh:none; --glass:rgba(28,28,30,.82); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1C1C1E; --fg:#F5F5F7; --fg2:#98989D; --fg3:#636366; --sep:#38383A; --fill:#2C2C2E;
  --accent:#8FB3DA; --accent-fg:#0B1B2B; --accent-soft:#1A2837;
  --ok:#7DD89A; --ok-bg:#132A1B; --warn:#F2C36B; --warn-bg:#35270D; --bad:#FF7B72; --bad-bg:#3A1513;
  --map:#1B1C1F; --map2:#151618; --map-grid:#26272B; --road:#34363B; --orb:#8FB3DA;
  --line:rgba(255,255,255,.07); --sh:none; --glass:rgba(28,28,30,.82); color-scheme:dark}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;-webkit-font-smoothing:antialiased;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
a{color:var(--accent)}
.app{position:relative;height:100%;height:100dvh;height:var(--altura-app,100dvh);margin:0 auto;display:flex;flex-direction:column;background:var(--bg);overflow:hidden;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
/* computador com mouse: aparelho no centro */
@media (min-width:600px) and (hover:hover) and (pointer:fine){body{background:var(--fill)}.app{max-width:430px;height:calc(100dvh - 40px);margin-block:20px;border-radius:34px;border:1px solid var(--sep);box-shadow:0 20px 60px rgba(0,0,0,.12)}}
/* telas largas (dobrável aberto, tablet, paisagem): o conteúdo fica numa coluna central confortável */
.top,.pad,.chat,.chips,.entrada,.voz{width:100%;max-width:var(--col);margin-inline:auto}
.top{padding:calc(14px + env(safe-area-inset-top,0px)) 16px 8px;display:flex;align-items:center;gap:10px;min-height:52px}
.top .ttl{flex:1;min-width:0;text-align:center}
.top .ttl b{display:block;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl span{display:block;font-size:12px;color:var(--fg2)}
.iconbtn{width:36px;height:36px;border-radius:18px;display:flex;align-items:center;justify-content:center;color:var(--accent);flex-shrink:0}
.iconbtn.sos{color:var(--bad)}
main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.pad{padding:4px 16px 32px;display:flex;flex-direction:column;gap:18px}
h1{font-size:30px;font-weight:700;letter-spacing:-.8px;line-height:1.1;margin:2px 0 0;text-wrap:balance}
.sub{font-size:15px;color:var(--fg2);margin:4px 0 0;line-height:1.4}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--fg2);margin:4px 4px -8px}
.card{background:var(--card);border-radius:var(--r-lg);padding:18px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line);box-shadow:var(--sh)}
.list{background:var(--card);border-radius:var(--r);overflow:hidden;border:1px solid var(--line);box-shadow:var(--sh)}
.hero{display:flex;flex-direction:column;gap:6px}
.hero .kick{font-size:13px;font-weight:600;color:var(--accent);letter-spacing:.02em}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);box-shadow:var(--sh);border-radius:var(--r);padding:12px 12px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-size:20px;font-weight:650;letter-spacing:-.3px;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat span{font-size:12px;color:var(--fg2)}
.datebox{width:44px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;line-height:1}
.datebox small{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--fg2)}
.datebox b{font-size:21px;font-weight:650;margin-top:3px;font-variant-numeric:tabular-nums}
.thumb{width:54px;height:54px;border-radius:12px;overflow:hidden;flex-shrink:0;background:var(--map);border:1px solid var(--line)}
.thumb svg{display:block;width:100%;height:100%}
.avatar{width:28px;height:28px;border-radius:14px;background:var(--accent);color:var(--accent-fg);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;font-weight:700}
.who{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--fg2)}
.trip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--fg2)}
.trip i{width:6px;height:6px;border-radius:3px;background:var(--ok)}
#wallet{flex:1;width:100%;border:0;display:block;background:var(--bg)}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:48px;width:100%;text-align:left;position:relative}
a.row{color:inherit;text-decoration:none}
.row+.row::before{content:"";position:absolute;top:0;left:14px;right:0;border-top:.5px solid var(--sep)}
.row .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .main b{font-weight:500;font-size:16px}
.row .main span{font-size:13px;color:var(--fg2)}
.row .val{color:var(--fg2);font-size:15px;text-align:right;font-variant-numeric:tabular-nums}
.chev{color:var(--fg3);flex-shrink:0}
.btn{height:50px;border-radius:14px;letter-spacing:-.1px;text-decoration:none;background:var(--accent);color:var(--accent-fg);font-weight:600;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.btn.sec{background:var(--fill);color:var(--accent)}
.btn.ghost{background:none;color:var(--accent)}
.btn.danger{background:var(--bad);color:#fff}
.btns{display:flex;gap:10px}
.btns .btn{flex:1}
.pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:10px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.pill.ok{color:var(--ok);background:var(--ok-bg)}
.pill.warn{color:var(--warn);background:var(--warn-bg)}
.pill.bad{color:var(--bad);background:var(--bad-bg)}
.pill.acc{color:var(--accent);background:var(--accent-soft)}
.pill.neu{color:var(--fg2);background:var(--fill)}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:15px;padding:9px 0;border-top:.5px solid var(--sep)}
.kv:first-child{border-top:0}
.kv span:first-child{color:var(--fg2)}
.kv span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.tabbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:6px max(6px,calc((100% - 560px) / 2)) calc(8px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:500;color:var(--fg3);padding:4px 0}
.tab.on{color:var(--accent)}
.tab .badge{position:absolute;margin-left:18px;margin-top:-2px;background:var(--bad);color:#fff;font-size:10px;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.tab>span{position:relative;display:flex}
.seg{display:flex;background:var(--fill);border-radius:10px;padding:2px}
.seg button{flex:1;padding:7px 4px;border-radius:8px;font-size:14px;font-weight:500;color:var(--fg2)}
.seg button.on{background:var(--card);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
/* conversa */
.chat{display:flex;flex-direction:column;gap:14px;padding:6px 16px 12px}
.msg-m{font-size:17px;line-height:1.45;max-width:100%}
.msg-u{align-self:flex-end;max-width:82%;background:var(--accent);color:var(--accent-fg);border-radius:20px 20px 6px 20px;padding:11px 15px;font-size:16px;line-height:1.4}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;border:.5px solid var(--sep);background:var(--card);border-radius:18px;padding:8px 13px;font-size:14px;color:var(--fg)}
.voz{display:flex;flex-direction:column;align-items:center;gap:8px;padding:6px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.voz .linha{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:300px}
.orb{position:relative;width:84px;height:84px;display:flex;align-items:center;justify-content:center}
.orb i{position:absolute;inset:0;border-radius:50%;background:var(--orb);opacity:.1}
.orb i+i{inset:10px;opacity:.2}
.orb button{position:relative;width:52px;height:52px;border-radius:26px;background:var(--orb);color:var(--accent-fg);display:flex;align-items:center;justify-content:center}
.orb.ouvindo i{animation:pulso 1.4s ease-in-out infinite}
.orb.ouvindo i+i{animation-delay:.2s}
.orb.pensando i{animation:gira 1s linear infinite;opacity:.18}
@keyframes pulso{0%,100%{transform:scale(.9)}50%{transform:scale(1.08)}}
@keyframes gira{0%{opacity:.08}50%{opacity:.3}100%{opacity:.08}}
@media (prefers-reduced-motion:reduce){.orb i{animation:none!important}}
/* botão do Marco, estilo Siri: esfera com luz girando; ao ouvir, acelera e pulsa */
.siri{position:relative;width:68px;height:68px;border-radius:50%;flex-shrink:0;isolation:isolate;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
.siri::before,.siri::after{content:"";position:absolute;border-radius:50%;z-index:-1;background:conic-gradient(from 0deg,#24476B,#5B8DC9,#A9C4EE,#7C74D9,#3FA6BF,#24476B)}
.siri::before{inset:-3px;filter:blur(8px);opacity:.85;animation:siriGira 7s linear infinite}
.siri::after{inset:3px;filter:blur(3px);animation:siriGira 4s linear infinite reverse}
.siri .nucleo{position:absolute;inset:9px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.5),rgba(255,255,255,0) 42%),linear-gradient(160deg,#2F5D8C,#162E47);box-shadow:inset 0 0 12px rgba(169,196,238,.35)}
.siri.ouvindo::before{inset:-12px;filter:blur(14px);opacity:1;animation-duration:1.6s}
.siri.ouvindo::after{animation-duration:1.2s}
.siri.ouvindo .nucleo{animation:siriPulsa 1s ease-in-out infinite}
.siri.pensando::before{animation-duration:2.4s;opacity:.6}
.siri.falando::before{inset:-8px;filter:blur(12px);opacity:.95;animation-duration:2.2s}
.siri.falando .nucleo{animation:siriPulsa 1.6s ease-in-out infinite}
@keyframes siriGira{to{transform:rotate(360deg)}}
@keyframes siriPulsa{50%{transform:scale(1.07)}}
@media (prefers-reduced-motion:reduce){.siri::before,.siri::after,.siri .nucleo{animation:none!important}}
/* doca flutuante: o botão do Marco sempre ao alcance do polegar, com uma dica curta */
.doca{position:absolute;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none;z-index:20}
.doca>*{pointer-events:auto}
.doca::before{content:"";position:absolute;left:0;right:0;bottom:calc(-18px - env(safe-area-inset-bottom,0px));height:190px;z-index:-1;pointer-events:none;background:linear-gradient(to bottom,transparent,var(--bg) 62%)}
.doca-dica{max-width:min(320px,calc(100% - 32px));text-align:center;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border:1px solid var(--line);box-shadow:var(--sh);border-radius:16px;padding:9px 14px;font-size:14px;line-height:1.35;color:var(--fg)}
.com-doca{padding-bottom:150px!important}
/* teclado aberto: o botão do Marco sai do caminho do campo que está sendo digitado */
body.teclado .doca,body.teclado .siri-flutua{display:none}
/* botão do Marco flutuante nas telas da viagem (acima das abas), sempre à mão */
.siri-flutua{position:absolute;right:16px;bottom:calc(74px + env(safe-area-inset-bottom,0px));width:58px;height:58px;z-index:30}
.siri-flutua .nucleo{inset:8px}
.toast~.siri-flutua,.atualizar~.siri-flutua{bottom:calc(150px + env(safe-area-inset-bottom,0px))}
.doca-dica{transition:opacity .5s ease}
.doca-linha{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;width:100%;max-width:var(--col);padding:0 16px;pointer-events:none}.doca-linha>*{pointer-events:auto}
.doca-fim{justify-self:start;white-space:nowrap;font-size:13px;line-height:1.2;padding:8px 12px;border-radius:16px;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border:1px solid var(--line);color:var(--fg2)}.doca-dica.some{opacity:0;pointer-events:none}
/* legendas do Marco (modo para quem não pode ouvir): pequenas, embaixo do botão do Marco, trocadas como em filme */
body.legendas .doca{bottom:calc(74px + env(safe-area-inset-bottom,0px))}
/* telas com abas embaixo (tela do Marco): o botão e as legendas ficam acima das abas */
body.com-tabbar .doca{bottom:calc(10px + var(--abas,62px))}
body.com-tabbar.legendas .doca{bottom:calc(64px + var(--abas,62px))}
body.com-tabbar #legenda{bottom:calc(14px + var(--abas,62px))}
body.com-tabbar .doca::before{bottom:-10px}
body.legendas .doca::before{bottom:calc(-74px - env(safe-area-inset-bottom,0px));height:250px}
body.legendas .com-doca{padding-bottom:210px!important}
#legenda{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:40;width:max-content;max-width:min(560px,calc(100% - 32px));text-align:center;pointer-events:none;opacity:0;transition:opacity .25s ease}
#legenda.on{opacity:1}
#legenda span{display:inline;background:rgba(0,0,0,.78);color:#fff;font-size:16px;line-height:1.5;padding:3px 9px;border-radius:6px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.iconbtn.cc.on{background:var(--accent);color:var(--accent-fg)}
/* abertura da nova viagem: limpa, antes de qualquer fala */
.abertura{display:flex;flex-direction:column;gap:18px;padding-top:6vh}
.abertura h1{font-size:30px;line-height:1.15;letter-spacing:-.4px}
.abertura p{font-size:17px;line-height:1.5;color:var(--fg2);margin:0}
.abertura .nota{display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:1.45;color:var(--fg2)}
.abertura .nota .iconbtn{width:30px;height:30px;pointer-events:none}
.saudacao{display:flex;flex-direction:column;gap:10px}
/* telas de conta (entrar, cadastrar, recuperar senha): estilo das redes sociais, no visual do Clé */
.conta{max-width:440px!important;min-height:100%;padding-top:calc(24px + env(safe-area-inset-top,0px))!important;gap:14px!important}
.conta-topo{display:flex;flex-direction:column;gap:8px;margin-bottom:6px}
.conta-form{display:flex;flex-direction:column;gap:12px}
.campo-linha{position:relative;display:flex}
.campo-linha input{padding-right:84px}
.olho{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:13px;font-weight:600;color:var(--accent);padding:8px 10px;border-radius:8px}
.btn.social{font-weight:600;gap:10px}
.btn.social.google{background:var(--card);color:var(--fg);border:1px solid var(--sep)}
.btn.social.apple{background:#000;color:#fff}
:root[data-theme="dark"] .btn.social.apple{background:#fff;color:#000}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.social.apple{background:#fff;color:#000}}
.btn.social[disabled]{opacity:.55;cursor:not-allowed}
.btn.contorno{background:none;color:var(--accent);border:1px solid var(--accent)}
.btn[disabled]{opacity:.6}
.ou{display:flex;align-items:center;gap:12px;color:var(--fg2);font-size:13px}
.ou::before,.ou::after{content:"";flex:1;border-top:1px solid var(--sep)}
.saudacao .msg-m{font-size:20px;line-height:1.45;letter-spacing:-.2px}
.small{font-size:13px;color:var(--fg2)}
.transc{font-size:15px;color:var(--fg2);min-height:22px;text-align:center;max-width:320px}
/* mapa */
.mapa{background:var(--map);border-radius:var(--r-lg);overflow:hidden;position:relative}
.mapa svg{display:block;width:100%;height:auto;max-height:62vh}
.daynav{display:flex;align-items:center;gap:8px}
.daynav .t{flex:1;min-width:0;text-align:center}
.daynav .t b{display:block;font-size:17px}
.daynav .t span{font-size:13px;color:var(--fg2);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num{width:28px;height:28px;border-radius:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;background:var(--accent);color:var(--accent-fg)}
.num.warn{background:var(--card);color:var(--warn);border:2px dashed var(--warn)}
.num.bad{background:var(--card);color:var(--bad);border:2px dashed var(--bad)}
.hora{width:48px;flex-shrink:0;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.tl .row{align-items:flex-start}
.ico{width:32px;height:32px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.progress{height:6px;border-radius:3px;background:var(--fill);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:3px}
.bar{display:flex;flex-direction:column;gap:6px}
.bar .l{display:flex;justify-content:space-between;font-size:14px;font-variant-numeric:tabular-nums}
.bar .l span:last-child{color:var(--fg2)}
.check{width:24px;height:24px;border-radius:12px;border:1.5px solid var(--fg3);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:transparent}
.check.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.feito b{color:var(--fg3);text-decoration:line-through}
/* sobreposições */

    decidirCartao(msg, alvo, d.decisao, d.ajuste || "", true);
    res.push(`${resumoCartao(alvo)}: ${alvo.estado}${alvo.estado === "erro" ? " (" + alvo.resultado + ")" : ""}`);
  }
  kDec.estado = "aprovado"; kDec.resultado = res.length ? "Aplicado pelo app: " + res.join("; ") + "." : "Nenhuma decisão aplicada.";
}
const resultadosDe = (m) => m.toolUses.map((id) => ({ type: "tool_result", tool_use_id: id, content: id in m.servidor ? m.servidor[id] : ((m.cards || []).find((k) => k.id === id) || {}).resultado || "Sem resposta do viajante." }));

// fotos reduzidas antes do primeiro envio (depois nada é alterado): até 1568 px, JPEG
async function reduzirImagem(file) {
  try {
    const img = await createImageBitmap(file), k = Math.min(1, 1568 / Math.max(img.width, img.height));
    if (k === 1 && file.size < 1.5e6) return file;
    const cv = document.createElement("canvas"); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
    cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
    const blob = await new Promise((ok) => cv.toBlob(ok, "image/jpeg", 0.85));
    return blob ? new File([blob], file.name.replace(/\.\w+$/, "") + ".jpg", { type: "image/jpeg" }) : file;
  } catch (e) { return file; }
}

async function enviarTexto(txt, opc = {}) {
  txt = (txt || "").trim(); if (!txt && !opc.anexo) return false;
  if (S.pensando) { toast("Espere o Marco terminar de responder."); render(); return false; }
  if (!S.chat) S.chat = chatInicial();
  S.rascunho = ""; garantirFios();
  const modo = opc.modo || rotaModo(txt);
  if (!opc.semBalao) S.chat.push({ de: "u", txt, anexo: opc.anexo && opc.anexo.nome });
  if (!marcoDisponivel()) { S.chat.push({ de: "m", txt: msgMarcoOff() }); S.rolarFim = true; render(); return false; }
  const novas = [];
  let pend = null, notasUsadas = 0;
  if (modo !== "comprovante") {
    // cartões desta conversa ainda sem resposta: o viajante mudou de assunto, e o Marco precisa saber
    // Cartões sem decisão quando a pessoa fala: continuam NA TELA esperando (bug de 02/10/2026: eram marcados
    // "sem resposta" e sumiam, ex.: o dia 2 sumia quando ela respondia "pode montar os próximos"). O Marco recebe
    // que ainda não há decisão e, se a fala decidir, aplica com decidir_cartoes.
    pend = [...S.chat].reverse().find((x) => x.fio === modo && x.toolUses && !x.respondido);
    if (pend) { for (const k of pend.cards || []) if (k.estado === "aguardando") { k.pendenteEnviado = true; k.resultado = `Ainda sem decisão; o cartão continua na tela (id ${k.id}). Se a fala a seguir decidir este cartão, use decidir_cartoes.`; } novas.push(...resultadosDe(pend)); }
    if (S.notas.length) { notasUsadas = S.notas.length; novas.push({ type: "text", text: S.notas.join("\n") }); }
  }
  if (opc.anexo) novas.push(opc.anexo.bloco);
  const naTela = modo === "comprovante" ? [] : cartoesNaTela();
  if (naTela.length) novas.push({ type: "text", text: `[Cartões na tela esperando decisão: ${naTela.map((k) => `id=${k.id} (${resumoCartao(k)})`).join("; ")}]` });
  novas.push({ type: "text", text: txt });
  const ok = await rodarTurno(modo, novas, { reenvio: { txt, opc: { ...opc, semBalao: true, modo } }, emPartes: opc.emPartes });
  if (ok) { if (pend) pend.respondido = true; if (notasUsadas) S.notas = S.notas.slice(notasUsadas); render(); }
  return ok;
}
async function rodarTurno(modo, novas, ctrl = {}) {
  const avulso = modo === "comprovante", fio = avulso ? ctrl.fioAvulso || fioVazio() : S.fios[modo];
  // conversa grande sem compactação no servidor: recomeça com resumo antes de crescer mais
  if (!avulso && fio.msgs.length && S.recursos && (S.recursos.compactacao === false || S.recursos.gatilhoCompactacao === false) && fio.tamanho > LIMITE_FIO[modo]) await recomecarFio(modo);
  let envio = novas;
  if (!avulso && !fio.msgs.length && fio.resumo) envio = [{ type: "text", text: "[Resumo da conversa anterior, feito para economizar]\n" + fio.resumo }, ...semIdsAntigos(novas)];
  else if (!avulso && !fio.msgs.length) envio = semIdsAntigos(novas);
  const m = { de: "m", txt: "", vivo: true, status: modo === "planejamento" ? "Planejando com calma…" : modo === "comprovante" ? "Lendo o comprovante…" : "Pensando…", fio: modo };
  S.chat.push(m); S.pensando = true; S.rolarFim = true; render();
  let ok = false, codigo = null;
  try {
    const r = await apiFetch("/marco", { method: "POST", body: JSON.stringify({ modo, versao: fio.versao, historico: fio.msgs, novas: envio, contexto: contextoTexto(envio.filter((b) => b.type === "text").map((b) => b.text).join(" ")), dados: dadosRoteiro() }) });
    if (r.status === 409) codigo = "versao";
    else if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.erro || "O Marco não respondeu."); }
    else await lerSSE(r, (ev) => { if (tratarEvento(ev, m, fio, modo)) ok = true; if (ev.tipo === "erro" && ev.codigo) codigo = ev.codigo; });
  } catch (e) {
    // mensagens do navegador em inglês ("network error", "Failed to fetch") viram uma explicação clara
    const rede = /network|failed to fetch|load failed|fetch|aborted|terminated/i.test(String(e && e.message));
    m.erro = navigator.onLine === false ? "Sem internet: o Marco precisa de conexão. Roteiro, mapa, Carteira e Cofre continuam funcionando."
      : rede ? "A conexão com o Marco caiu no meio da resposta. Tente de novo; se for um pedido grande, como o roteiro inteiro, peça alguns dias por vez." : e.message || "O Marco não respondeu.";
  }
  m.vivo = false; m.status = null; S.pensando = false;
  if (m.continuar && !ok && !m.erro) { if (!m.txt.trim()) S.chat.splice(S.chat.indexOf(m), 1); return rodarTurno(modo, [], { ...ctrl, fioAvulso: avulso ? fio : undefined }); }
  // trava: versão nova do prefixo ou histórico recusado → recomeça a conversa com resumo e tenta uma vez
  if (!ok && (codigo === "versao" || codigo === "historico_invalido") && !avulso && !ctrl.recomecou) {
    S.chat.splice(S.chat.indexOf(m), 1);
    await recomecarFio(modo);
    return rodarTurno(modo, novas, { ...ctrl, recomecou: true });
  }
  // tarefa grande demais para uma vez (o servidor interrompeu antes do limite da nuvem): refaz em partes, uma vez
  if (!ok && codigo === "tempo" && modo === "planejamento" && !ctrl.emPartes) {
    m.erro = null; m.status = null; m.txt = "Essa tarefa é grande; vou montar em partes, alguns dias por vez.";
    S.rolarFim = true; render();
    return enviarTexto("Faça em partes menores: monte agora só os próximos 2 dias ainda sem roteiro e diga quantos faltam.", { modo: "planejamento", semBalao: true, emPartes: true });
  }
  if (ok && !avulso && fio.resumo && fio.msgs.length) fio.resumo = null;
  if (!ok && !m.erro) m.erro = "O Marco não respondeu. Tente de novo.";
  if (!ok) m.reenvio = ctrl.reenvio;
  S.rolarFim = true; render();
  if (ok) checarMarco();
  // tela do Marco por voz: ele fala a resposta (ou legenda, com CC) e volta a ouvir; com erro, a conversa pausa
  if (ok && m.autoContinuar && !ctrl.autoContinuou) { m.respondido = true; render(); return rodarTurno(modo, resultadosDe(m), { autoContinuou: true }); }
  if (ok) falarRespostaMarco(m); else if (S.vozAtiva && S.tela === "conversa") { encerrarVoz(); render(); }
  if (ok && m.encaminhar) await enviarTexto(m.encaminhar, { modo: "planejamento", semBalao: true });
  return ok;
}
// devolve true quando o turno terminou bem (fim ou propostas)
function tratarEvento(ev, m, fio, modo) {
  const avulso = modo === "comprovante";
  if (ev.consumo) m.consumo = ev.consumo;
  if (ev.tipo === "inicio") { if (!fio.msgs.length) fio.versao = ev.versao; m.modelo = ev.modelo; }
  else if (ev.tipo === "texto") { m.txt += ev.texto; m.status = null; S.rolarFim = true; renderLogo(); }
  else if (ev.tipo === "buscando") { m.status = ev.ferramenta === "calcular_rota" ? "Calculando a rota…" : ev.ferramenta === "buscar_lugar" ? `Procurando ${ev.consulta || "o lugar"} nas bases de mapas…` : ev.ferramenta === "consultar_dia" ? `Consultando o ${ev.consulta || "dia"}…` : "Pesquisando…"; renderLogo(); }
  else if (ev.tipo === "propostas" || ev.tipo === "fim") {
    if (!avulso) fio.msgs.push(...ev.anexadas); // R2: guardado exatamente como foi; nunca editado depois
    const c = ev.consumo; if (c && c.chamadas) fio.tamanho = Math.round((c.entrada + c.cacheLido + c.cacheEscrito) / c.chamadas);
    if (ev.aviso) m.txt += (m.txt ? "\n\n" : "") + ev.aviso;
    if (ev.tipo === "propostas") {
      const asst = ev.anexadas[ev.anexadas.length - 1].content;
      m.servidor = ev.resultadosServidor || {};
      m.toolUses = asst.filter((b) => b.type === "tool_use").map((b) => b.id);
      m.cards = asst.filter((b) => b.type === "tool_use" && !(b.id in m.servidor)).map((b) => ({ id: b.id, name: b.name, input: b.input || {}, estado: "aguardando" }));
      // decisão falada sobre cartões da tela: o app aplica na hora; se for só isso, o Marco continua sozinho
      for (const k of m.cards) if (k.name === "decidir_cartoes") aplicarDecisoesFaladas(k);
      if (m.cards.length && m.cards.every((k) => k.name === "decidir_cartoes")) m.autoContinuar = true;
      for (const k of m.cards) if (k.name === "encaminhar_ao_planejador") { k.estado = "aprovado"; k.resultado = "Encaminhado ao planejador; o resultado aparece na conversa."; m.encaminhar = k.input.pedido; }
      if (!m.txt.trim() && m.cards.some((k) => k.estado === "aguardando")) {
        // fala padrão quando o Marco não escreveu nada: diz o que preparou (a voz não pode ficar vaga)
        const dias = m.cards.filter((k) => k.name === "propor_dia").map((k) => +k.input.dia).filter(Boolean).sort((a, b) => a - b);
        m.txt = dias.length && dias.length === m.cards.length
          ? (dias.length === 1 ? `Montei o dia ${dias[0]}.` : `Montei os dias ${dias[0]} a ${dias[dias.length - 1]}.`) + " Confere aqui e me diz se posso seguir com os próximos."
          : m.cards.length > 1 ? "Preparei estas propostas para vocês decidirem." : "Preparei esta proposta para vocês decidirem.";
      }
      if (avulso) m.respondido = true; // comprovante: conversa avulsa, não continua
    }
    return true;
  }
  else if (ev.tipo === "continuar") { fio.msgs.push(...ev.anexadas); m.continuar = true; m.status = "Continuando…"; renderLogo(); }
  else if (ev.tipo === "erro") { m.erro = ev.mensagem; }
  return false;
}
// "simple compaction": resume o que foi conversado e começa uma conversa nova (nada antigo é reenviado)
async function recomecarFio(modo) {
  const linhas = S.chat.filter((x) => x.fio === modo || (x.de === "u" && modo === "conversa")).slice(-40).map((x) => x.de === "u" ? `Viajante: ${x.txt}` : `Marco: ${x.txt}${(x.cards || []).map((k) => ` [${k.name}: ${k.estado}${k.resultado ? " · " + k.resultado : ""}]`).join("")}`).join("\n");

  }
  if (k.name === "propor_lancamento") {
    const c = cle(); if (!c) throw new Error("a Carteira ainda está carregando");
    const vs = c.viajantes(), acha = (n) => vs.find((x) => norm(x.nome) === norm(n));
    const por = acha(i.quem_pagou), resp = (i.dividir_com || []).map(acha);
    if (!por || resp.some((x) => !x)) throw new Error(`viajante não encontrado na Carteira (${[i.quem_pagou, ...(i.dividir_com || [])].filter((n) => !acha(n)).join(", ")})`);
    const ml = c.moedaLocal(), moeda = i.moeda === ml.cod ? ml.cod : i.moeda === "BRL" ? "BRL" : null;
    if (!moeda) throw new Error(`a Carteira usa ${ml.cod} e BRL; ${i.moeda} precisa ser convertido`);
    const dados = { desc: i.descricao, cat: CATS[i.categoria] ? i.categoria : "out", valor: Math.round(+i.valor * 100) / 100, moeda, status: SITUACAO[i.situacao] ? i.situacao : "realizado", por: por.id, resp: resp.map((x) => x.id), obs: "Lançado pelo Marco" + (i.motivo ? ": " + i.motivo : "") };
    if (i.dia != null) dados.dia = +i.dia;
    const id = c.lancar(dados); if (!id) throw new Error("a Carteira recusou o lançamento");
    return { texto: `Lançado na Carteira: ${i.descricao}, ${moeda} ${dados.valor.toFixed(2)}.`, hist: registrar(`Carteira: ${i.descricao} (${dinheiro(dados.valor, moeda === "BRL" ? "R$" : ml.simb)})`, "lanc", { lancId: id }) };
  }
  if (k.name === "propor_tarefa") {
    garantirListas(); const id = novoId();
    S.listas.tarefas.push({ id, g: i.grupo || "Fazer agora", t: i.titulo, s: i.detalhe || "" });
    return { texto: `Tarefa criada (id ${id}).`, hist: registrar(`Checklist: ${i.titulo}`, "tarefa", { id }) };
  }
  if (k.name === "propor_concluir_tarefa") {
    if (!tarefasLista().some((t) => t.id === i.id)) throw new Error("tarefa não encontrada");
    S.tarefas[i.id] = true;
    return { texto: "Tarefa marcada como concluída.", hist: registrar(`Checklist: concluída "${textoTarefa(tarefasLista().find((t) => t.id === i.id))}"`, "concluir", { id: i.id }) };
  }
  if (k.name === "propor_desejo") {
    garantirListas(); const id = novoId(), st = v === "talvez" ? "Ideia" : "Desejo";
    S.listas.desejos.push({ id, n: i.nome, s: [i.detalhe, i.cidade].filter(Boolean).join(" · "), st });
    return { texto: v === "talvez" ? "O viajante marcou Talvez: guardado como Ideia." : "O viajante quer: entrou na lista de desejos.", hist: registrar(`${st}: ${i.nome}`, "desejo", { id }) };
  }
  if (k.name === "propor_info_viagem") {
    S.viagem.info = S.viagem.info || {}; const antes = S.viagem.info[i.campo] ?? null; S.viagem.info[i.campo] = i.valor;
    return { texto: "Informação gravada.", hist: registrar(`Informação: ${i.campo.replace(/_/g, " ")} = ${i.valor}`, "info", { campo: i.campo, antes }) };
  }
  throw new Error("proposta desconhecida");
}
// traçado e tempos reais do dia (Mapbox, pelo servidor); sem servidor, o mapa liga as paradas em linha reta
function recalcRota(d) {
  if (!API || !S.rotasOn) return;
  const pts = paradasDo(d).filter((p) => Number.isFinite(+p.lat)).map((p) => (p.est ? { lat: p.est.lat, lng: p.est.lng } : { lat: +p.lat, lng: +p.lng }));
  if (pts.length < 2) { d.poly = []; d.km = 0; d.min = 0; return; }
  apiFetch("/rota", { method: "POST", body: JSON.stringify({ pontos: pts.slice(0, 25), modo: "carro" }) })
    .then((r) => r.json()).then((j) => { if (j.erro) return; d.poly = j.poly; d.km = Math.round(j.km); d.min = j.min; render(); }).catch(() => {});
}

// ---------- mapa em SVG (traçado real da estrada quando houver; senão, paradas ligadas em linha reta) ----------
function svgMapa(d, { alto = 330, foco = -1, zoom = null } = {}) {
  const W = 360, H = alto, P = 22;
  const ps = paradasDo(d).filter((p) => Number.isFinite(+p.lat));
  const linha = d.poly && d.poly.length > 1 ? d.poly : ps.map((p) => [+p.lat, +p.lng]);
  let pts = zoom ? zoom : [...linha, ...ps.map((p) => [+p.lat, +p.lng])];
  if (!pts.length) return `<svg viewBox="0 0 ${W} ${Math.min(H, 120)}" role="img" aria-label="Mapa vazio"><rect width="${W}" height="${Math.min(H, 120)}" fill="var(--map)"/><text x="${W / 2}" y="${Math.min(H, 120) / 2 + 4}" text-anchor="middle" font-size="13" font-family="var(--font)" fill="var(--fg2)">Sem locais neste dia</text></svg>`;
  const lat0 = pts.reduce((s, p) => s + p[0], 0) / pts.length;
  const kx = Math.cos((lat0 * Math.PI) / 180);
  const xs = pts.map((p) => p[1] * kx), ys = pts.map((p) => -p[0]);
  let x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const span = Math.max((x1 - x0) / (W - 2 * P), (y1 - y0) / (H - 2 * P), 1e-4);
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  const X = (lng) => W / 2 + (lng * kx - cx) / span, Y = (lat) => H / 2 + (-lat - cy) / span;
  const path = linha.map((p, i) => `${i ? "L" : "M"}${X(p[1]).toFixed(1)} ${Y(p[0]).toFixed(1)}`).join("");
  const reta = !(d.poly && d.poly.length > 1);
  const uid = "m" + (++svgN);
  const kmPorPx = span * 111;
  const esc0 = [0.1, 0.2, 0.5, 1, 2, 5, 10, 20, 50, 100, 200].find((k) => k / kmPorPx >= 40) || 200;
  const escPx = esc0 / kmPorPx, escTxt = esc0 < 1 ? `${esc0 * 1000} m` : `${esc0} km`;
  const postos = zoom ? "" : (d.postos || []).map((p) => `<g transform="translate(${X(p.lng).toFixed(1)} ${Y(p.lat).toFixed(1)})"><circle r="7" fill="var(--card)" stroke="var(--line)" stroke-width="1" filter="url(#${uid}s)"/><path d="M-2.6 -3.4h3.6v6.6h-3.6zM1 -1.6l1.8 1.3v2.6" fill="none" stroke="var(--fg2)" stroke-width="1.1" stroke-linejoin="round"/></g>`).join("");
  const ini = linha[0], fim = linha[linha.length - 1];
  const marcas = zoom || !ini ? "" : `<circle cx="${X(ini[1]).toFixed(1)}" cy="${Y(ini[0]).toFixed(1)}" r="5" fill="var(--card)" stroke="var(--accent)" stroke-width="2.5"/><g transform="translate(${X(fim[1]).toFixed(1)} ${Y(fim[0]).toFixed(1)})"><rect x="-6" y="-6" width="12" height="12" rx="3" fill="var(--fg)"/><path d="M-3 2V-2.5M-3 0h6v2M3 0a1.6 1.6 0 0 0-1.6-1.6h-2" stroke="var(--bg)" stroke-width="1.1" fill="none"/></g>`;
  const todas = paradasDo(d);
  const pins = todas.map((p, i) => {
    if ((p.t === "inicio" && i > 0) || !Number.isFinite(+p.lat)) return "";
    const c = seloDe(p), x = X(+p.lng).toFixed(1), y = Y(+p.lat).toFixed(1);
    const fill = c === "verde" ? "var(--accent)" : c === "amarelo" ? "var(--warn)" : "var(--bad)";
    const tc = c === "verde" ? "var(--accent-fg)" : "var(--card)";
    const s = i === foco ? 1.25 : 1;
    const est = p.est ? `<g transform="translate(${X(p.est.lng).toFixed(1)} ${Y(p.est.lat).toFixed(1)})"><rect x="-7" y="-7" width="14" height="14" rx="4" fill="var(--fg)"/><text y="3.6" text-anchor="middle" font-size="9.5" font-weight="700" font-family="var(--font)" fill="var(--bg)">P</text></g>` : "";
    return `${zoom ? est : ""}<g transform="translate(${x} ${y}) scale(${s})" filter="url(#${uid}s)"><path d="M0 0C-1.5-4-9-8.5-9-14.5a9 9 0 0 1 18 0C9-8.5 1.5-4 0 0z" fill="${fill}" stroke="var(--card)" stroke-width="1.5"/><text y="-11" text-anchor="middle" font-size="9.5" font-weight="700" font-family="var(--font)" fill="${tc}">${i + 1}</text></g>`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Mapa do dia ${d.dia}"><defs>
    <linearGradient id="${uid}g" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" style="stop-color:var(--map)"/><stop offset="1" style="stop-color:var(--map2)"/></linearGradient>
    <filter id="${uid}s" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="1.2" stdDeviation="1.2" flood-color="#000" flood-opacity=".28"/></filter></defs>
    <rect width="${W}" height="${H}" fill="url(#${uid}g)"/>
    ${path ? `<path d="${path}" fill="none" stroke="var(--road)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"${reta ? ' stroke-dasharray="2 7"' : ""}/>` : ""}${marcas}${postos}${pins}
    ${H >= 120 ? `<g transform="translate(14 ${H - 14})"><path d="M0 -4V0H${escPx.toFixed(1)}V-4" fill="none" stroke="var(--fg2)" stroke-width="1.4"/><text x="${(escPx + 6).toFixed(1)}" y="1" font-size="10" font-family="var(--font)" fill="var(--fg2)">${escTxt}${reta && path ? " · trajeto ainda sem estradas" : ""}</text></g>` : ""}</svg>`;
}
let svgN = 0;
function miniRota(d) {
  const pts = d.poly && d.poly.length > 1 ? d.poly : paradasDo(d).filter((p) => Number.isFinite(+p.lat)).map((p) => [+p.lat, +p.lng]);
  if (!pts.length) return '<svg viewBox="0 0 54 54" aria-hidden="true"></svg>';
  const lat0 = pts[0][0], kx = Math.cos((lat0 * Math.PI) / 180);
  const xs = pts.map((p) => p[1] * kx), ys = pts.map((p) => -p[0]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const sp = Math.max(x1 - x0, y1 - y0, 1e-4) / 40;
  const X = (x) => 27 + (x - (x0 + x1) / 2) / sp, Y = (y) => 27 + (y - (y0 + y1) / 2) / sp;
  const p = pts.map((q, i) => `${i ? "L" : "M"}${X(q[1] * kx).toFixed(1)} ${Y(-q[0]).toFixed(1)}`).join("");
  const f = pts[pts.length - 1];
  return `<svg viewBox="0 0 54 54" aria-hidden="true"><path d="${p}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${X(f[1] * kx).toFixed(1)}" cy="${Y(-f[0]).toFixed(1)}" r="2.6" fill="var(--accent)"/></svg>`;
}
function telaMapa() {

    <div class="daynav"><button class="iconbtn" data-a="diaMapa" data-v="-1" aria-label="Dia anterior">${ic("back")}</button>

  </div></main>`;

function estadoDesejo(x) {
  if (x.tarefa && S.tarefas[x.tarefa]) return "Reservado";
  if (DIAS.some((d) => paradasDo(d).some((p) => norm(nomeLimpo(p.n)) === norm(x.n)))) return "No roteiro";
  return x.st || "Desejo";
}

// ---------- consumo do Marco (regra de contexto e custo, seção 27): medido em cada chamada, com trava diária ----------
function telaConsumo() {
  const c = S.consumo;
  if (!c && API) setTimeout(() => A.consumoAtualizar(), 0);
  const usd = (v) => "US$ " + (+v || 0).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const cache = (x) => { const t = x.entrada + x.cacheLido + x.cacheEscrito; return t ? Math.round((100 * x.cacheLido) / t) + "%" : "–"; };
  const NOMES = { conversa: "Conversa (Sonnet 5.5)", planejamento: "Planejamento (Opus 5.5)", comprovante: "Comprovantes (Sonnet 5.5)", ficha: "Ficha da viagem", resumo: "Resumos para recomeçar conversa" };
  let corpo;
  if (!API) corpo = `<div class="card"><span class="small">O consumo aparece quando o Marco estiver ligado (computador de testes ou servidor na nuvem).</span></div>`;
  else if (!c) corpo = `<div class="small">Carregando…</div>`;
  else if (c.erro) corpo = `<div class="card"><span class="small">Não foi possível ler o consumo agora.</span></div>`;
  else corpo = `<div class="stats"><div class="stat"><b>${usd(c.hoje.usd)}</b><span>hoje</span></div><div class="stat"><b>${usd(c.mes.usd)}</b><span>no mês</span></div><div class="stat"><b>${cache(c.mes)}</b><span>vindo do cache</span></div></div>
      ${c.limiteDiaUsd ? `<div class="bar"><div class="l"><span>Limite do dia</span><span>${usd(c.hoje.usd)} de ${usd(c.limiteDiaUsd)}</span></div><div class="progress"><i style="width:${Math.min(100, (100 * c.hoje.usd) / c.limiteDiaUsd).toFixed(0)}%"></i></div></div>` : `<div class="small">Sem limite diário de gasto (desligado durante os testes).</div>`}
      <div class="list">${Object.entries(c.porModo).map(([k, x]) => `<div class="row"><div class="main"><b>${esc(NOMES[k] || k)}</b><span>${x.turnos} pedido(s) · ${x.chamadas} chamada(s) · cache ${cache(x)}${x.buscas ? ` · ${x.buscas} busca(s) na web` : ""}</span></div><span class="val">${usd(x.usd)}</span></div>`).join("") || `<div class="row"><span class="small">Nenhum uso neste mês.</span></div>`}</div>`;
  return `${header({ titulo: "Consumo do Marco", sub: "Inteligência artificial", voltar: true })}<main id="main"><div class="pad"><h1>Consumo</h1>
    <p class="sub">Cada pedido ao Marco é medido: tokens novos, tokens lidos do cache (bem mais baratos), resposta e buscas na web. Valores estimados pela tabela de preços da Anthropic.</p>
    ${corpo}
    <button class="btn sec" data-a="consumoAtualizar">Atualizar</button>
    <p class="small" style="margin:0">Quando houver limite diário, ao passar dele o Marco pausa até o dia seguinte e o resto do app continua funcionando. O limite fica no arquivo de chaves do servidor (LIMITE_DIARIO_USD).</p></div></main>`;
}

function prepararCarrossel() {
  document.querySelectorAll(".carrossel[data-id]").forEach((c) => { c.scrollLeft = (S.rolagens || {})[c.dataset.id] || 0; });
  const c = $("#carInt"); if (!c) return;
  c.scrollLeft = S.rolagemInt || 0;
  const pontos = () => {
    const p = $("#pontosInt"); if (!p) return;
    const paginas = Math.max(1, Math.ceil(c.scrollWidth / Math.max(1, c.clientWidth) - 0.05)), max = c.scrollWidth - c.clientWidth;
    const atual = max > 0 ? Math.round((c.scrollLeft / max) * (paginas - 1)) : 0;
    p.innerHTML = paginas > 1 ? Array.from({ length: paginas }, (_, i) => `<i class="${i === atual ? "on" : ""}"></i>`).join("") : "";
  };
  c.addEventListener("scroll", () => { S.rolagemInt = c.scrollLeft; pontos(); }, { passive: true });
  pontos();
}

t-size:11.5px;color:var(--warn);margin-top:3px;line-height:1.25}\n.fonte .prev + .prev{margin-top:1px}\n/* camadas da barra: estimado (azul listrado) < a pagar (âmbar listrado) < gasto (sólido, por cima) */\n:root{--pat-apagar:repeating-linear-gradient(135deg,var(--warn) 0 4px,color-mix(in srgb,var(--warn) 45%,transparent) 4px 8px);\n      --pat-est:repeating-linear-gradient(45deg,var(--est) 0 4px,color-mix(in srgb,var(--est) 40%,transparent) 4px 8px)}\n.minibar i.prev,.bar i.prev{background:var(--pat-apagar);opacity:1}\n.seg i{border-radius:0}.seg i:first-child{border-top-left-radius:9px;border-bottom-left-radius:9px}\n.seg i:last-child{border-top-right-radius:9px;border-bottom-right-radius:9px}\n.minibar i.est,.bar i.est{background:var(--pat-est);opacity:1}\n.fonte .prev .e{color:var(--est)}\n.wal .minibar{height:8px;border:1px solid var(--line)}\n.leg-prev[data-ajuda]{cursor:pointer;-webkit-user-select:none;user-select:none}\n.leg-prev[data-ajuda] span{padding:3px 0}\n.wal-ajuda{display:none}\n.wal-ajuda.on{display:block}\n.leg-prev{display:flex;gap:14px;font-size:11.5px;color:var(--ink-2);margin:4px 0 0}\n.leg-prev i{display:inline-block;width:14px;height:8px;border-radius:3px;margin-right:5px;vertical-align:0}\n.secao{font-size:12.5px;font-weight:700;color:var(--ink-2);margin:16px 0 6px;display:flex;justify-content:space-between}\n/* saldo projetado da fonte: âmbar = só a pagar · roxo = só estimado · laranja = os dois · vermelho = negativo */\n.fonte .vals .proj{font-weight:700;font-size:13px;margin-top:5px;white-space:nowrap}\n.fonte .vals .proj small{font-weight:500;font-size:10.5px;opacity:.9;margin-right:3px;display:inline}\n.proj.ap{color:var(--warn)}.proj.es{color:var(--est)}.proj.mx{color:var(--mix)}.proj.neg{color:var(--bad)}\n.pgrow{display:grid;grid-template-columns:1fr 1.25fr;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}\n.pgrow:first-child{border-top:0}\n.pgrow .quem{grid-column:1/-1;display:flex;align-items:center;gap:8 ategorias\" style=\"grid-column:4 / span 2\"><svg class=\"i\"><use href=\"#i-tag\"/></svg>Categorias</button>\n  <\!-- Clé: a aba Ajustes saiu daqui; os dados da viagem vêm do Marco e se editam em Mais → Ajustes da viagem -->\n</div></nav>\n\n<div class=\"scrim\" id=\"scrim\"></div>\n<div class=\"sheet\" id=\"sheet\"><div class=\"in\" id=\"sheetIn\"></div></div>\n<div class=\"toast\" id=\"toast\"></div>\n<input type=\"file\" id=\"cam\" accept=\"image/*\" capture=\"environment\" hidden>\n<input type=\"file\" id=\"imp\" accept=\".json,.txt,.pdf,application/json,text/plain,application/pdf\" hidden>\n\n<svg width=\"0\" height=\"0\" style=\"position:absolute\">\n  <symbol id=\"i-home\" viewBox=\"0 0 24 24\"><path d=\"M3 10.5 12 3l9 7.5\"/><path d=\"M5 9v12h14V9\"/><path d=\"M10 21v-6h4v6\"/></symbol>\n  <symbol id=\"i-list\" viewBox=\"0 0 24 24\"><path d=\"M8 6h13M8 12h13M8 18h13\"/><circle cx=\"3.5\" cy=\"6\" r=\".8\"/><circle cx=\"3.5\" cy=\"12\" r=\".8\"/><circle cx=\"3.5\" cy=\"18\" r=\".8\"/></symbol>\n  <symbol id=\"i-plus\" viewBox=\"0 0 24 24\"><path d=\"M12 5v14M5 12h14\"/></symbol>\n  <symbol id=\"i-tag\" viewBox=\"0 0 24 24\"><path d=\"M3 12V3h9l9 9-9 9z\"/><circle cx=\"7.5\" cy=\"7.5\" r=\"1.4\"/></symbol>\n  <symbol id=\"i-sliders\" viewBox=\"0 0 24 24\"><path d=\"M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0\"/><circle cx=\"16\" cy=\"6\" r=\"2\"/><circle cx=\"10\" cy=\"12\" r=\"2\"/><circle cx=\"18\" cy=\"18\" r=\"2\"/></symbol>\n  <symbol id=\"i-plane\" viewBox=\"0 0 24 24\"><path d=\"M10.5 13.5 3 11l1.5-1.5 8 1 4-4.5a2 2 0 0 1 3 3l-4.5 4 1 8L14.5 22 12 14.5\"/></symbol>\n  <symbol id=\"i-shield\" viewBox=\"0 0 24 24\"><path d=\"M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z\"/><path d=\"m9 12 2 2 4-4\"/></symbol>\n  <symbol id=\"i-bed\" viewBox=\"0 0 24 24\"><path d=\"M3 19V6M3 14h18v5M21 14v-2a3 3 0 0 0-3-3h-8v5\"/><circle cx=\"6.5\" cy=\"10.5\" r=\"1.8\"/></symbol>\n  <symbol id=\"i-key\" viewBox=\"0 0 24 24\"><circle cx=\"8\" cy=\"15\" r=\"4\"/><path d=\"m
