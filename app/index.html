l id=\"i-card\" viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><path d=\"M3 10h18M7 15h4\"/></symbol>\n  <symbol id=\"i-cash\" viewBox=\"0 0 24 24\"><rect x=\"2.5\" y=\"6\" width=\"19\" height=\"12\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"2.5\"/><path d=\"M6 9.5v.01M18 14.5v.01\"/></symbol>\n  <symbol id=\"i-down\" viewBox=\"0 0 24 24\"><path d=\"M12 4v12M6 10l6 6 6-6M4 20h16\"/></symbol>\n</svg>\n\n<script src=\"lib/qrcode.js\"><\/script>\n<script>\n/* ============================================================\n   Financeiro da Viagem — v1\n   Offline (PWA). Os dados ficam só no aparelho (IndexedDB) e entram por arquivo.\n   Este código não contém dados pessoais.\n   ============================================================ */\nconst VERSAO_APP = '1.15.0';\n\nconst CAT_DEF = [\n  {id:'pass',  nome:'Passagens',            icone:'plane',  cor:'#3F6FB0', subs:['Aéreo','Taxas e bagagem']},\n  {id:'seg',   nome:'Seguros e documentos', icone:'shield', cor:'#6C5BA8', subs:['Seguro viagem','Seguro do carro','PID / CNH','Vacinas / CIVP','Passe de parques']},\n  {id:'hosp',  nome:'Hospedagem',           icone:'bed',    cor:'#1D5C5D', subs:['Hotel','Motel','Camping','Taxas do hotel']},\n  {id:'loc',   nome:'Locação do carro',     icone:'key',    cor:'#4F6470', subs:['Diárias','Taxas da locadora']},\n  {id:'comb',  nome:'Combustível',          icone:'fuel',   cor:'#B23A32', subs:['Gasolina']},\n  {id:'desl',  nome:'Deslocamentos',        icone:'car',    cor:'#8A6A3D', subs:['Estacionamento','Pedágio','Monotrilho / transporte','Uber / táxi']},\n  {id:'pas',   nome:'Passeios e ingressos', icone:'ticket', cor:'#C2410C', subs:['Parques','Tours','Shows','Museus']},\n  {id:'ali',   nome:'Alimentação',          icone:'food',   cor:'#B8892A', subs:['Café da manhã','Almoço','Jantar','Lanches','Mercado']},\n  {id:'comp',  nome:'Compras',              icone:'bag',    cor:'#2E7D4F', subs:['Vestuário','Calçados','Eletrônicos','Ferramentas','Souvenirs','Cosméticos','Presentes','Tabacaria','Outdoor / camping','Casa']},\n  {id:'con',   nome:'Conectividade',        icone:'wifi',   cor:'#0E7490', subs:['Starlink','eSIM / chip']},\n  {id:'out',   nome:'Outros',               icone:'dots',   cor:'#6B7280', subs:['Imprevistos','Lavanderia','Farmácia','Gorjetas avulsas']},\n];\n\nconst CORES_P = ['#1D5C5D','#B8892A','#3F6FB0','#BE185D','#6C5BA8','#2E7D4F','#C2410C','#4F6470'];\n\n// viagem nova, sem lançamentos (as regras de responsável começam em \"quem lança\")\nfunction novaViagem(c){\n  return {\n    formato:'finviagem', versao:1,\n    viagem:{ id:'v'+Date.now().toString(36), nome:c.nome, inicio:c.inicio, dias:c.dias,\n      local:{cod:c.localCod, simb:c.localSimb}, nativa:{cod:c.nativaCod, simb:c.nativaSimb}, cotacao:c.cotacao, iofPadrao:3.5,\n      orcamento:{}, hojeManual:null, viajantes:[{id:'p'+Date.now().toString(36), nome:c.seuNome, cor:CORES_P[0], fontes:[]}] },\n    categorias: CAT_DEF.map(x => ({...JSON.parse(JSON.stringify(x)), regra:'eu'})),\n    lanc: [], excluidos:{}, ultFonte:{}, aparelho:null\n  };\n}\n\n/* ---------- armazenamento: IndexedDB, com localStorage como reserva ---------- */\nconst DB = {\n  nome:'finviagem', loja:'estado', chave:'atual',\n  abrir(){ return new Promise((ok, erro) => { const r = indexedDB.open(this.nome, 1);\n    r.onupgradeneeded = () => r.result.createObjectStore(this.loja); r.onsuccess = () => ok(r.result); r.onerror = () => erro(r.error); }); },\n  async ler(){\n    try { const db = await this.abrir(); return await new Promise((ok, erro) => { const t = db.transaction(this.loja).objectStore(this.loja).get(this.chave); t.onsuccess = () => ok(t.result || null); t.onerror = () => erro(t.error); }); }\n    catch(e){ try { return JSON.parse(localStorage.getItem('finviagem')); } catch(_){ return null; } }\n  },\n  async gravar(v){\n    try { const db = await this.abrir(); await new Promise((ok, erro) => { const t = db.transaction(this.loja, 'readwrite'); t.objectStore(this.loja).put(v, this.chave); t.oncomplete = ok; t.onerror = () => erro(t.error); }); }\n    catch(e){ try { localStorage.setItem('finviagem', JSON.stringify(v)); } catch(_){} }\n  },\n  async apagar(){ try { const db = await this.abrir(); db.transaction(this.loja, 'readwrite').objectStore(this.loja).delete(this.chave); } catch(e){} try { localStorage.removeItem('finviagem'); } catch(_){} }\n};\n\nlet S = null;\nlet _gravando = null;\nfunction save(){ if (!S) return; clearTimeout(_gravando); _gravando = setTimeout(() => DB.gravar(S), 150); }\nfunction normalizar(d){\n  d.excluidos ||= {}; d.ultFonte ||= {};\n  d.local ||= {}; d.local.enviadoOk ||= {}; d.local.recebido ||= {}; d.local.excLoc ||= {}; d.local.ultimaSync ||= {};\n  d.viagem.orcamento ||= {}; d.viagem.iofPadrao ??= 3.5;\n  for (const v of d.viagem.viajantes) v.fontes ||= [];\n  for (const l of d.lanc) { l.partes ??= null; l.obs ??= ''; l.upd ??= 0; l.pagamentos ??= null; }\n  return d;\n}\n\nconst UI = { tab:'painel', pessoa:'t', filtroStatus:'todos', filtroCat:null, filtroDia:null, busca:'', moedaVer:'local' };\n\n/* ---------- utilidades ---------- */\nconst $ = s => document.querySelector(s);\nconst esc = s => String(s).replace(/[&<>\"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));\nconst cat = id => S.categorias.find(c => c.id === id) || {nome:'—',cor:'#888',icone:'dots',subs:[]};\n// dia da viagem hoje: 0 = antes de começar · 1..dias = durante · dias+1 = depois\nfunction diaAtual(){\n  const v = S.viagem;\n  if (v.hojeManual) return v.hojeManual;\n  const ini = new Date(v.inicio + 'T00:00:00'), agora = new Date();\n  const d = Math.floor((new Date(agora.getFullYear(), agora.getMonth(), agora.getDate()) - ini) / 864e5) + 1;\n  return Math.max(0, Math.min(v.dias + 1, d));\n}\n// pagamentos do lançamento: [{por, fonte, valor}] com valor na moeda do lançamento.\n// Lançamento antigo (um só pagador) vira uma lista de um item.\nfunction pagtos(l){ return (l.pagamentos && l.pagamentos.length) ? l.pagamentos : [{ por:l.por, fonte:l.fonte, valor:l.valor }]; }\nfunction fonteObj(pg){ const v = trav(pg.por); return v && pg.fonte ? (v.fontes||[]).find(x => x.id === pg.fonte) || null : null; }\nfunction fonteDe(l){ return fonteObj(pagtos(l)[0]); }\nfunction semFormaPgto(l, p){\n  if (l.status === 'pago') return false;\n  return pagtos(l).filter(pg => p === 't' || pg.por === p).some(pg => !pg.fonte);\n}\nconst ICONE_SEM_PGTO = `<svg viewBox=\"0 0 30 26\" aria-hidden=\"true\"><g transform=\"rotate(-22 15 8)\"><rect x=\"8.5\" y=\"2\" width=\"13\" height=\"9\" rx=\"1.3\" fill=\"#36A474\"/><circle cx=\"15\" cy=\"6.5\" r=\"2\" fill=\"#fff\" opacity=\".9\"/><circle cx=\"10.6\" cy=\"6.5\" r=\".8\" fill=\"#fff\" opacity=\".7\"/><circle cx=\"19.4\" cy=\"6.5\" r=\".8\" fill=\"#fff\" opacity=\".7\"/></g><rect x=\"2\" y=\"8.5\" width=\"21\" height=\"14.5\" rx=\"2.6\" fill=\"var(--ink)\"/><rect x=\"16.8\" y=\"13.2\" width=\"7.2\" height=\"5.2\" rx=\"2.4\" fill=\"var(--ink)\" stroke=\"var(--surface)\" stroke-width=\"1.3\"/><circle cx=\"19.6\" cy=\"15.8\" r=\"1\" fill=\"var(--surface)\"/><circle cx=\"24\" cy=\"20.5\" r=\"5.2\" fill=\"var(--bad)\" stroke=\"var(--surface)\" stroke-width=\"1.6\"/><path d=\"M22 18.5l4 4M26 18.5l-4 4\" stroke=\"#fff\" stroke-width=\"1.7\" stroke-linecap=\"round\"/></svg>`;\nfunction dividaNoLanc(l){\n  const saldo = {};\n  for (const pg of pagtos(l)) saldo[pg.por] = (saldo[pg.por] || 0) + (+pg.valor || 0);\n  for (const id of l.resp) saldo[id] = (saldo[id] || 0) - l.valor * parte(l, id);\n  const dev = Object.entries(saldo).filter(([,x]) => x < -0.009).map(([id,x]) => [id,-x]);\n  const cre = Object.entries(saldo).filter(([,x]) => x > 0.009);\n  const out = []; let i = 0, j = 0;\n  while (i < dev.length && j < cre.length) {\n    const x = Math.min(dev[i][1], cre[j][1]);\n    if (x >= 0.01) out.push({ de: dev[i][0], para: cre[j][0], v: x });\n    dev[i][1] -= x; cre[j][1] -= x;\n    if (dev[i][1] < 0.009) i++; if (cre[j][1] < 0.009) j++;\n  }\n  return out;\n}\nfunction dividasVisiveis(l, p){ return dividaNoLanc(l).filter(d => p === 't' || d.de === p || d.para === p); }\nconst ICONE_DIVIDA = `<svg viewBox=\"0 0 28 26\" aria-hidden=\"true\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n  <path d=\"M7.4 8.6a6.8 6.8 0 0 1 11.8-3.5\" stroke=\"var(--warn)\" stroke-width=\"1.9\"/><path d=\"M19.6 2.3l-.3 2.9-2.9-.4\" stroke=\"var(--warn)\" stroke-width=\"1.9\"/>\n  <path d=\"M20.6 9.6a6.8 6.8 0 0 1-11.8 3.5\" stroke=\"var(--warn)\" stroke-width=\"1.9\"/><path d=\"M8.4 15.9l.3-2.9 2.9.4\" stroke=\"var(--warn)\" stroke-width=\"1.9\"/>\n  <circle cx=\"14\" cy=\"9.1\" r=\"4.3\" fill=\"var(--warn)\" stroke=\"none\"/>\n  <path d=\"M15.4 7.4c-.3-.5-.8-.7-1.4-.7-.9 0-1.5.5-1.5 1.1 0 1.5 3 .8 3 2.4 0 .6-.6 1.1-1.5 1.1-.7 0-1.2-.3-1.5-.8M14 5.9v.8M14 11.6v.8\" stroke=\"#fff\" stroke-width=\"1.1\"/>\n  <path d=\"M2.5 19.6h3l4.3-1.8c.8-.3 1.6-.3 2.4 0l3.4 1.3c.9.4.7 1.7-.3 1.7h-3.2\" stroke=\"var(--ink)\" stroke-width=\"1.6\"/>\n  <path d=\"M12.1 20.8h5l5-2.8c.8-.5 1.8-.2 2.2.6.3.6.1 1.3-.5 1.7l-6 4H2.5\" stroke=\"var(--ink)\" stroke-width=\"1.6\"/>\n</svg>`;\nfunction pgDe(l, p, id){ return pagtos(l).find(pg => pg.por === p && pg.fonte === id) || null; }\n// quantos R$ custa 1 unidade da moeda local, conforme a fonte usada\nfunction fatorNativa(fo){\n  const v = S.viagem;\n  if (fo && fo.moeda === v.local.cod && fo.cambio > 0) return fo.cambio;\n  if (fo && fo.moeda === v.nativa.cod) return v.cotacao * (1 + (fo.iof ?? v.iofPadrao)/100);\n  return v.cotacao * (1 + v.iofPadrao/100);\n}\nfunction descConv(fo){\n  const v = S.viagem;\n  if (fo && fo.moeda === v.local.cod && fo.cambio > 0) return 'câmbio pago de ' + fmt(fo.cambio, v.nativa.simb);\n  if (fo && fo.moeda === v.nativa.cod) return 'com IOF de ' + pct(fo.iof ?? v.iofPadrao) + '%';\n  return 'com IOF de ' + pct(v.iofPadrao) + '%';\n}\nfunction fmt(v, simb){ return simb + ' ' + (v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }\nconst pct = x => (x||0).toLocaleString('pt-BR',{maximumFractionDigits:2});\nfunction numBR(v){\n  if (typeof v === 'number') return v;\n  const t = String(v ?? '').trim().replace(/\\s/g, ''); if (!t) return NaN;\n  return parseFloat(t.includes(',') ? t.replace(/\\./g, '').replace(',', '.') : t);\n}\nfunction fmt0(v, simb){ return fmt(v, simb); } // valores sempre com centavos exatos\nfunction emNativa(l){\n  if (l.fatura) return l.fatura;\n  if (l.moeda === S.viagem.nativa.cod) return l.valor;\n  return pagtos(l).reduce((a, pg) => a + (+pg.valor || 0) * fatorNativa(fonteObj(pg)), 0);\n}\nfunction emLocal(l){ return l.moeda === S.viagem.local.cod ? l.valor : l.valor / S.viagem.cotacao; }\n// Parte de cada responsável em CENTAVOS EXATOS (a soma é sempre o total da conta):\n// 1) se cada responsável pagou a própria parte, a parte dele é o que ele pagou;\n// 2) senão, cada parte é arredondada ao centavo e o centavo que sobra fica com o primeiro responsável\n//    (mesma regra que o formulário usa para sugerir os valores de pagamento).\nfunction partesCent(l){\n  const c = x => Math.round(x * 100);\n  const total = c(l.valor), ids = l.resp;\n  const exata = id => l.partes ? (+l.partes[id] || 0) : l.valor / ids.length;\n  const pgs = pagtos(l);\n  if (pgs.length > 1) {\n    const pago = {}; for (const pg of pgs) pago[pg.por] = (pago[pg.por] || 0) + c(+pg.valor || 0);\n    const mesmos = Object.keys(pago).length === ids.length && ids.every(id => pago[id] !== undefined);\n    if (mesmos && ids.every(id => Math.abs(pago[id] - exata(id) * 100) <= 1.01) && ids.reduce((a, id) => a + pago[id], 0) === total) return pago;\n  }\n  const r = {}; ids.forEach(id => r[id] = c(exata(id)));\n  const dif = total - ids.reduce((a, id) => a + r[id], 0);\n  if (ids.length) r[ids[0]] += dif;\n  return r;\n}\nfunction parte(l, p){\n  if (p === 't') return 1;\n  if (!l.resp.includes(p) || !(l.valor > 0)) return 0;\n  return (partesCent(l)[p] || 0) / Math.round(l.valor * 100);\n}\nconst trav = id => S.viagem.viajantes.find(v => v.id === id);\nconst inicial = n => (n||'?').trim().charAt(0).toUpperCase() || '?';\n// iniciais que diferenciam as pessoas: inicial do nome; se repetir, nome + sobrenome (MA/MS);\n// sem sobrenome, duas primeiras letras do nome (Ma/Mr); em último caso, numera.\nfunction iniciaisPessoas(){\n  const vs = S.viagem.viajantes, out = {};\n  const palavras = v => (v.nome || '?').trim().split(/\\s+/).filter(Boolean);\n  const nivel1 = v => (palavras(v)[0] || '?').charAt(0).toUpperCase();\n  const nivel2 = v => { const w = palavras(v); return w.length > 1 ? (w[0].charAt(0) + w[w.length - 1].charAt(0)).toUpperCase() : (w[0] || '?').charAt(0).toUpperCase() + (w[0] || '?').charAt(1).toLowerCase(); };\n  const conta = (f, v) => vs.filter(x => f(x) === f(v)).length;\n  for (const v of vs) out[v.id] = conta(nivel1, v) === 1 ? nivel1(v) : conta(nivel2, v) === 1 ? nivel2(v) : nivel2(v) + (vs.filter(x => nivel2(x) === nivel2(v)).indexOf(v) + 1);\n  return out;\n}\nfunction iniciais(id){ return iniciaisPessoas()[id] || '?'; }\nfunction av(id){ const v = trav(id) || {nome:'?',cor:'#888'}; return `<span class=\"av\" style=\"background:${v.cor}\" title=\"${esc(v.nome)}\">${esc(iniciais(id))}</span>`; }\n\n/* ---------- selo do meio de pagamento ---------- */\nconst TIPO_SELO = { credito:'Cred', debito:'Débt', especie:'Esp' };\nconst CORES_SELO = ['#1A1A1A','#F5C518','#820AD1','#FF7A00','#EC0000','#0B4AA2','#00A650','#9FE870','#00B2E3','#8A6A3D','#6B7280','#2E7D4F'];\n// sugestão de sigla e cor pelo nome (o usuário pode trocar ao editar a fonte)\nfunction padraoSelo(fo){\n  const n = (fo.nome || '').toLowerCase();\n  if (fo.tipo === 'especie') return { sigla:'$', cor:'#2E7D4F' };\n  // cores aproximadas das marcas (sem logos); a ordem importa: nomes mais específicos primeiro\n  const regras = [\n    // contas globais / câmbio\n    [/nomad/,'NMD','#F5C518'],[/wise/,'WISE','#9FE870'],[/revolut/,'REV','#0666EB'],[/\\bn26\\b/,'N26','#36A18B'],[/paypal/,'PAYPAL','#003087'],\n    [/payoneer/,'PAYON','#FF4800'],[/avenue/,'AVE','#0B4AA2'],[/\\bmonzo\\b/,'MONZO','#FF4F40'],\n    // Brasil\n    [/\\bc6\\b/,'C6','#1A1A1A'],[/nubank|\\bnu\\b/,'NU','#820AD1'],[/banco inter|\\binter\\b/,'INTER','#FF7A00'],[/ita[uú]/,'ITAÚ','#EC7000'],\n    [/bradesco/,'BRAD','#CC092F'],[/santander/,'SAN','#EC0000'],[/banco do brasil|\\bbb\\b/,'BB','#F5C518'],[/caixa/,'CAIXA','#0070AF'],\n    [/\\bbtg\\b/,'BTG','#0B2B4B'],[/\\bxp\\b/,'XP','#1A1A1A'],[/picpay/,'PIC','#21C25E'],[/mercado ?pago/,'MP','#00B1EA'],[/pagbank|pagseguro/,'PAG','#00A868'],\n    [/\\bnext\\b/,'NEXT','#00C853'],[/\\bneon\\b/,'NEON','#00B7EB'],[/sicredi/,'SICR','#33A02C'],[/sicoob/,'SICO','#003641'],[/banrisul/,'BANRI','#005CA9'],\n    [/safra/,'SAFRA','#0B2A55'],[/banco original|\\boriginal\\b/,'ORIG','#00A859'],[/\\bwill\\b/,'WILL','#FFD500'],[/\\bbs2\\b/,'BS2','#0033A0'],\n    // Estados Unidos\n    [/bank of america|\\bbofa\\b/,'BOFA','#E31837'],[/\\bchase\\b/,'CHASE','#117ACA'],[/wells fargo/,'WELLS','#D71E28'],[/\\bciti/,'CITI','#056DAE'],\n    [/capital one/,'CAP1','#004977'],[/american express|\\bamex\\b/,'AMEX','#2E77BC'],[/discover/,'DISC','#FF6000'],[/\\bus bank\\b|u\\.s\\. bank/,'USB','#0C2074'],\n    [/\\bpnc\\b/,'PNC','#EF7622'],[/\\btd\\b/,'TD','#34A853'],[/schwab/,'SCHW','#00A0DF'],[/truist/,'TRUIST','#2E1A47'],[/\\bally\\b/,'ALLY','#650360'],\n    // Europa e outros\n    [/hsbc/,'HSBC','#DB0011'],[/barclays/,'BARC','#00AEEF'],[/\\bing\\b/,'ING','#FF6200'],[/bnp/,'BNP','#00965E'],[/deutsche/,'DB','#0018A8'],\n    [/millennium/,'MILL','#D1005D'],[/scotiabank/,'SCOTIA','#EC111A'],[/bbva/,'BBVA','#004481']\n  ];\n  for (const [re, sg, cor] of regras) if (re.test(n)) return { sigla:sg, cor };\n  const w = (fo.nome || '?').trim().split(/\\s+/);\n  return { sigla: (w[0] || '?').slice(0, 4).toUpperCase(), cor:'#6B7280' };\n}\nfunction seloDe(fo){ const d = padraoSelo(fo); return { sigla: fo.sigla || d.sigla, cor: fo.cor || d.cor }; }\nfunction corTexto(hex){ const h = hex.replace('#',''); const [r,g,b] = [0,2,4].map(i => parseInt(h.substr(i,2),16)/255); return (0.299*r + 0.587*g + 0.114*b) > 0.62 ? '#1B2424' : '#FFFFFF'; }\nfunction seloHTML(fo, quem, attrs = ''){\n  const sl = seloDe(fo), pessoa = quem ? trav(quem) : null;\n  return `<span class=\"selo\" style=\"--c:${sl.cor};--t:${corTexto(sl.cor)}\" ${attrs}>${pessoa ? `<i class=\"quem\" style=\"background:${pessoa.cor}\">${esc(iniciais(quem))}</i>` : ''}${esc(sl.sigla)}<em>${TIPO_SELO[fo.tipo] || ''}</em></span>`;\n}\nfunction seloGrande(fo){ const sl = seloDe(fo); return `<span class=\"selo-g\" style=\"--c:${sl.cor};--t:${corTexto(sl.cor)}\">${esc(sl.sigla)}<em>${TIPO_SELO[fo.tipo] || ''}</em></span>`; }\nfunction whoBadge(l){\n  const n = S.viagem.viajantes.length;\n  if (l.resp.length === 1) { const v = trav(l.resp[0]) || {nome:'?',cor:'#888'}; return `<span class=\"who\" style=\"background:${v.cor}\">${esc(v.nome)}</span>`; }\n  if (l.partes) return `<span class=\"who grp\">Por valores</span>`;\n  return `<span class=\"who grp\">${l.resp.length === n ? 'Todos' : 'Dividido ÷' + l.resp.length}</span>`;\n}\nfunction respPorRegra(regra){\n  const ids = S.viagem.viajantes.map(v => v.id);\n  if (regra === 'todos') return ids;\n  if (regra && regra !== 'eu' && ids.includes(regra)) return [regra];\n  return [S.aparelho];\n}\nfunction nomeRegra(regra){ if (regra === 'todos') return 'dividir entre todos'; if (regra && regra !== 'eu' && trav(regra)) return trav(regra).nome; return 'quem lança (dono do aparelho)'; }\nfunction val(l, p, moeda){ const base = moeda === 'nativa' ? emNativa(l) : emLocal(l); return base * parte(l, p); }\nconst isPlano = l => l.status === 'estimado' || l.status === 'apagar' || l.status === 'pago';\nconst isReal  = l => l.status === 'pago' || l.status === 'realizado';\nconst ativos = () => S.lanc.filter(l => l.incluir);\nfunction dataDia(d){ if (!d) return 'Pré-viagem'; const x = new Date(S.viagem.inicio+'T12:00:00'); x.setDate(x.getDate()+d-1); return x.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}); }\nfunction nomeDia(d){ return d ? `D${d} · ${dataDia(d)}` : 'Pré-viagem'; }\nconst simbVer = () => UI.moedaVer === 'nativa' ? S.viagem.nativa.simb : S.viagem.local.simb;\nconst STN = {estimado:'Estimado', apagar:'A pagar', pago:'Pré-pago', realizado:'Pago na viagem'};\nfunction nomeP(p){ return p==='t' ? 'Total da viagem' : (trav(p)||{nome:'—'}).nome; }\nfunction toast(t){ const e=$('#toast'); e.textContent=t; e.classList.add('on'); clearTimeout(e._t); e._t=setTimeout(()=>e.classList.remove('on'),1800); }\nconst ic = (nome, cor, soft=true) => `<span class=\"ic\" style=\"background:${cor}1f;color:${cor}\"><svg class=\"i\"><use href=\"#i-${nome}\"/></svg></span>`;\n\n/* ---------- cálculo ---------- */\nfunction totais(p){\n  const m = UI.moedaVer;\n  let plano=0, real=0, falta=0;\n  for (const l of ativos()){\n    const v = val(l,p,m); if (!v) continue;\n    if (isPlano(l)) plano += v;\n    if (isReal(l)) real += v;\n    // ainda a pagar: reservas a pagar no local + estimativas de hoje em diante\n    // (estimativas de dias que já passaram foram substituídas pelos gastos reais)\n    if (l.status==='apagar' || (l.status==='estimado' && (l.dia===0 || l.dia>=diaAtual()))) falta += v;\n  }\n  return {plano, real, falta, proj: real + falta};\n}\nfunction porCategoria(p){\n  const m = UI.moedaVer;\n  return S.categorias.map(c => {\n    let plano=0, real=0;\n    for (const l of ativos()) if (l.cat===c.id){ const v=val(l,p,m); if(isPlano(l)) plano+=v; if(isReal(l)) real+=v; }\n    const orc = S.viagem.orcamento[c.id]; // orçamento limite na moeda local\n    return {c, plano, real, orc};\n  }).filter(x => x.plano || x.real);\n}\nfunction porDia(p){\n  const m = UI.moedaVer, out=[];\n  for (let d=1; d<=S.viagem.dias; d++){\n    let plano=0, real=0;\n    for (const l of ativos()) if (l.dia===d){ const v=val(l,p,m); if(isPlano(l)) plano+=v; if(isReal(l)) real+=v; }\n    out.push({d,plano,real});\n  }\n  return out;\n}\n// valor na moeda da fonte → moeda de exibição\nfunction fonteVer(fo, x){\n  const v = S.viagem, verNat = UI.moedaVer === 'nativa';\n  if (fo.moeda === v.nativa.cod) return verNat ? x : x / v.cotacao;\n  return verNat ? x * fatorNativa(fo) : x;\n}\n// quanto um lançamento tirou da fonte (na moeda da fonte)\nfunction saidaFonte(l, fo, pg){\n  const v = S.viagem, x = pg ? (+pg.valor || 0) : l.valor;\n  if (fo.moeda === v.nativa.cod) {\n    if (l.moeda === v.nativa.cod) return x;\n    return l.fatura ? l.fatura * x / l.valor : x * fatorNativa(fo);\n  }\n  return l.moeda === fo.moeda ? x : x / v.cotacao;\n}\nfunction classeProj(x, saldo){ if (saldo < -0.005) return 'neg'; const a = x.apagar > 0.005, e = x.estimado > 0.005; return a && e ? 'mx' : a ? 'ap' : e ? 'es' : ''; }\n// barra da fonte: cada parte começa onde a anterior termina (nada fica por baixo de nada)\nfunction barraFonte(x){\n  const pc = n => x.fo.valor ? Math.min(100, Math.max(0, n / x.fo.valor * 100)) : 0;\n  const a = pc(x.gasto), b = pc(x.gasto + x.apagar), c = pc(x.gasto + x.apagar + x.estimado);\n  const seg = (cls, ini, fim, extra = '') => fim - ini > 0.05 ? `<i class=\"${cls}\" style=\"left:${ini}%;width:${fim - ini}%;${extra}\"></i>` : '';\n  return seg('', 0, a, `background:${x.resta < 0 ? 'var(--bad)' : 'var(--brand-2)'}`) + seg('prev', a, b) + seg('est', b, c);\n}\nfunction previstoNaFonte(l, p, id){\n  if (!l.incluir || isReal(l) || !pgDe(l, p, id)) return false;\n  return l.status === 'apagar' || l.dia >= diaAtual();\n}\nfunction carteira(p){\n  const fontes = ((trav(p)||{}).fontes||[]).map(fo => {\n    const parte = l => saidaFonte(l, fo, pgDe(l, p, fo.id));\n    const gasto = S.lanc.filter(l => l.incluir && isReal(l) && pgDe(l, p, fo.id)).reduce((a,l) => a + parte(l), 0);\n    const prevs = S.lanc.filter(l => previstoNaFonte(l, p, fo.id));\n    const apagar = prevs.filter(l => l.status === 'apagar').reduce((a,l) => a + parte(l), 0);\n    const estimado = prevs.filter(l => l.status === 'estimado').reduce((a,l) => a + parte(l), 0);\n    return {fo, gasto, apagar, estimado, previsto: apagar + estimado, resta: fo.valor - gasto};\n  });\n  const noOrc = fo => fo.tipo !== 'credito' || fo.noOrcamento;\n  const din = fontes.filter(x => noOrc(x.fo)), cred = fontes.filter(x => !noOrc(x.fo));\n  const hoje = diaAtual();\n  // parte da pessoa nos gastos DURANTE a viagem: não inclui o que foi pago antes de embarcar\n  let precisa = 0, jaGastou = 0;\n  for (const l of ativos()){\n    if (l.dia < 1 || l.status === 'pago') continue;\n    if (l.status === 'estimado' && l.dia < hoje) continue;\n    const x = val(l, p, UI.moedaVer); precisa += x; if (l.status === 'realizado') jaGastou += x;\n  }\n  const levado = din.reduce((a,x) => a + fonteVer(x.fo, x.fo.valor), 0);\n  const resta = din.reduce((a,x) => a + fonteVer(x.fo, x.resta), 0);\n  const credDisp = cred.reduce((a,x) => a + fonteVer(x.fo, x.resta), 0);\n  return {fontes, din, cred, levado, resta, credDisp, precisa, jaGastou, folga: levado - precisa};\n}\nfunction dividasPorDirecao(){\n  const m = UI.moedaVer, hoje = diaAtual(), acc = {};\n  for (const l of ativos()) {\n    if (l.status === 'estimado' && l.dia >= 1 && l.dia < hoje) continue; // estimativa de dia que já passou\n    const base = m === 'nativa' ? emNativa(l) : emLocal(l);\n    for (const d of dividaNoLanc(l)) {\n      const k = d.de + '|' + d.para, x = base * d.v / l.valor;\n      acc[k] ||= { de: d.de, para: d.para, pago: 0, prev: 0 };\n      if (isReal(l)) acc[k].pago += x; else acc[k].prev += x;\n    }\n  }\n  return Object.values(acc).filter(x => x.pago + x.prev >= 0.01).sort((a, b) => (b.pago + b.prev) - (a.pago + a.prev));\n}\nfunction contasDaDivida(de, para){\n  const m = UI.moedaVer, hoje = diaAtual(), out = [];\n  for (const l of ativos()) {\n    if (l.status === 'estimado' && l.dia >= 1 && l.dia < hoje) continue;\n    const d = dividaNoLanc(l).find(y => y.de === de && y.para === para); if (!d) continue;\n    const base = m === 'nativa' ? emNativa(l) : emLocal(l);\n    out.push({ l, v: base * d.v / l.valor, total: base });\n  }\n  return out.sort((a, b) => a.l.dia - b.l.dia);\n}\nfunction abrirDividas(de, para){\n  const sb = simbVer(), itens = contasDaDivida(de, para);\n  const pagos = itens.filter(x => isReal(x.l)), prev = itens.filter(x => !isReal(x.l));\n  const soma = a => a.reduce((t, x) => t + x.v, 0);\n  const linha = x => { const c = cat(x.l.cat);\n    return `<div class=\"item\" data-id=\"${x.l.id}\">${ic(c.icone, c.cor)}\n      <div><div class=\"t\">${esc(x.l.desc)}</div><div class=\"m\"><span class=\"st ${x.l.status}\">${STN[x.l.status]}</span><span>${nomeDia(x.l.dia)}</span></div></div>\n      <div class=\"v num\">${fmt(x.v, sb)}<small>de ${fmt(x.total, sb)}</small></div></div>`; };\n  $('#sheetIn').innerHTML = `<div class=\"grab\"></div><div class=\"shead\"><h2>${esc(nomeP(de))} deve a ${esc(nomeP(para))}</h2><button class=\"iconbtn\" data-close><svg class=\"i\"><use href=\"#i-x\"/></svg></button></div>\n    <div class=\"acerto\" style=\"margin:4px 0 2px\">${av(de)}<svg class=\"i arrow\"><use href=\"#i-arrow\"/></svg>${av(para)}<div class=\"t\">Total em aberto<b class=\"num\">${fmt(soma(itens), sb)}</b></div></div>\n    <div class=\"hint\">Em cada conta: em destaque, a parte de ${esc(nomeP(de))} que ${esc(nomeP(para))} pagou; abaixo, o total da conta. Toque numa conta para abrir.</div>\n    ${pagos.length ? `<div class=\"secao\"><span>Já pago (${pagos.length})</span><span class=\"num\">${fmt(soma(pagos), sb)}</span></div>${pagos.map(linha).join('')}` : ''}\n    ${prev.length ? `<div class=\"secao\"><span>Previsto (${prev.length})</span><span class=\"num\">${fmt(soma(prev), sb)}</span></div>${prev.map(linha).join('')}` : ''}`;\n  abrirSheet();\n}\nfunction acerto(){\n  // saldo de cada um = o que pagou − a parte que lhe cabe; depois, transferências mínimas\n  const m = UI.moedaVer, bal = {};\n  S.viagem.viajantes.forEach(v => bal[v.id] = 0);\n  for (const l of ativos()){\n    if (!isReal(l)) continue;\n    const v = m==='nativa' ? emNativa(l) : emLocal(l);\n    for (const pg of pagtos(l)) if (bal[pg.por] !== undefined) bal[pg.por] += v * (+pg.valor || 0) / l.valor;\n    for (const id of l.resp) if (bal[id] !== undefined) bal[id] -= v * parte(l, id);\n  }\n  const dev = Object.entries(bal).filter(([,x]) => x < -0.005).map(([id,x]) => [id,-x]).sort((a,b)=>b[1]-a[1]);\n  const cre = Object.entries(bal).filter(([,x]) => x >  0.005).sort((a,b)=>b[1]-a[1]);\n  const out = []; let i = 0, j = 0;\n  while (i < dev.length && j < cre.length){\n    const x = Math.min(dev[i][1], cre[j][1]);\n    if (x >= 0.005) out.push({de: dev[i][0], para: cre[j][0], v: x});\n    dev[i][1] -= x; cre[j][1] -= x;\n    if (dev[i][1] < 0.005) i++; if (cre[j][1] < 0.005) j++;\n  }\n  return out;\n}\n\n/* ---------- carteira ---------- */\nconst TIPO_F = {especie:{nome:'Espécie', ic:'cash'}, debito:{nome:'Débito / conta global', ic:'card'}, credito:{nome:'Crédito (reserva)', ic:'card'}};\nfunction cardCarteira(p){\n  const nome = esc(nomeP(p)), sb = simbVer(), c = carteira(p);\n  if (!c.fontes.length) return `<section class=\"card wal\"><h3>Carteira de ${nome}</h3>\n    <p class=\"sub\" style=\"margin:0 0 12px\">Cadastre quanto dinheiro ${nome} está levando (espécie, cartões de débito, conta global) para saber se vai sobrar ou faltar.</p>\n    <button class=\"btn ghost\" data-cart=\"${p}\">+ Cadastrar dinheiro da viagem</button></section>`;\n  const ok = c.folga >= -0.005;\n  const cobreCred = !ok && c.credDisp >= -c.folga;\n  return `<section class=\"card wal\"><h3>Carteira de ${nome} <button class=\"linkbtn\" data-cart=\"${p}\">Editar</button></h3>\n    <div class=\"st-big ${ok?'ok':'bad'}\"><div><span>${ok?'Orçamento folgado: vai sobrar':'Vai faltar dinheiro'}</span><b class=\"num\">${fmt(Math.abs(c.folga), sb)}</b></div>\n      <span style=\"text-align:right\">${ok?'':!c.cred.length?'sem reserva no crédito':cobreCred?'a reserva do crédito cobre':'nem a reserva do crédito cobre'}</span></div>\n    <div class=\"nums\">\n      <div class=\"kpi\"><div class=\"l\">Levando</div><div class=\"v num\">${fmt0(c.levado, sb)}</div><div class=\"a\">resta ${fmt0(c.resta, sb)} nas fontes</div></div>\n      <div class=\"kpi\"><div class=\"l\">Parte nos gastos da viagem</div><div class=\"v num\">${fmt0(c.precisa, sb)}</div><div class=\"a\">já gastou ${fmt0(c.jaGastou, sb)}</div></div>\n    </div>\n    ${c.fontes.map(x => { const ti = TIPO_F[x.fo.tipo] || TIPO_F.debito; const fs = x.fo.moeda === S.viagem.nativa.cod ? S.viagem.nativa.simb : S.viagem.local.simb;\n      const usado = x.fo.valor ? Math.min(100, Math.max(0, x.gasto / x.fo.valor * 100)) : 0;\n      const pc = n => x.fo.valor ? Math.min(100, Math.max(0, n / x.fo.valor * 100)) : 0;\n      return `<div class=\"fonte ${x.fo.tipo==='credito'?'cred':''}\" data-verf=\"${p}|${x.fo.id}\">${seloGrande(x.fo)}\n        <div><div class=\"n\">${esc(x.fo.nome)} <span class=\"muted\">›</span></div><div class=\"minibar seg\">${barraFonte(x)}</div>\n        ${x.apagar > 0.005 ? `<div class=\"prev num\">a pagar ${fmt(x.apagar, fs)}</div>` : ''}${x.estimado > 0.005 ? `<div class=\"prev num\"><span class=\"e\">estimado ${fmt(x.estimado, fs)}</span></div>` : ''}</div>\n        <div class=\"vals num\"><b>${fmt(x.resta, fs)}</b>${x.fo.tipo==='credito'?'livre agora':'de '+fmt0(x.fo.valor, fs)}${x.previsto > 0.005 ? (() => { const pj = x.fo.valor - x.gasto - x.previsto; return `<div class=\"proj ${classeProj(x, pj)}\"><small>projetado</small>${fmt(pj, fs)}</div>`; })() : ''}</div></div>`; }).join('')}\n    <div class=\"leg-prev\" data-ajuda title=\"Toque para ver a explicação\"><span><i style=\"background:var(--brand-2)\"></i>gasto</span><span><i style=\"background:var(--pat-apagar)\"></i>a pagar</span><span><i style=\"background:var(--pat-est)\"></i>estimado</span></div>\n    <div class=\"wal-ajuda${UI.ajudaCarteira ? ' on' : ''}\">\n    <div class=\"hint\" style=\"margin-top:4px\">Saldo projetado (valor da fonte − a pagar − estimado): <b style=\"color:var(--warn)\">âmbar</b> só a pagar · <b style=\"color:var(--est)\">roxo</b> só estimado · <b style=\"color:var(--mix)\">laranja</b> os dois · <b style=\"color:var(--bad)\">vermelho</b> se ficar negativo.</div>\n    <div class=\"hint\">Toque numa fonte para ver as despesas pagas e previstas nela. Parte nos gastos = já gasto + a pagar no local + estimativas até o fim (sem o que foi pago antes de embarcar). Crédito só entra em \"Levando\" se estiver marcado para o orçamento da viagem.</div>\n    </div>\n  </section>`;\n}\nfunction cardDinheiroTodos(){\n  const sb = simbVer();\n  return `<section class=\"card\"><h3>Dinheiro para a viagem <small>toque para ver a carteira</small></h3>\n    ${S.viagem.viajantes.map(v => { const c = carteira(v.id);\n      const tag = !c.fontes.length ? '<span class=\"tag nd\">não cadastrado</span>' : c.folga >= -0.005 ? `<span class=\"tag ok num\">sobra ${fmt0(c.folga, sb)}</span>` : `<span class=\"tag bad num\">faltam ${fmt0(-c.folga, sb)}</span>`;\n      return `<div class=\"pessoa-din\" data-irp=\"${v.id}\">${av(v.id)}<span class=\"x\">${esc(v.nome)}</span>${tag}</div>`; }).join('')}\n  </section>`;\n}\nfunction abrirFonte(p, id){\n  const c = carteira(p), x = c.fontes.find(y => y.fo.id === id); if (!x) return;\n  const fo = x.fo, ti = TIPO_F[fo.tipo] || TIPO_F.debito, v = S.viagem;\n  const fs = fo.moeda === v.nativa.cod ? v.nativa.simb : v.local.simb;\n  const cred = fo.tipo === 'credito';\n  const pagos = S.lanc.filter(l => l.incluir && isReal(l) && pgDe(l, p, id)).sort((a,b) => b.dia - a.dia);\n  const prev = S.lanc.filter(l => previstoNaFonte(l, p, id)).sort((a,b) => a.dia - b.dia);\n  const prevAp = prev.filter(l => l.status === 'apagar'), prevEst = prev.filter(l => l.status === 'estimado');\n  const livre = fo.valor - x.gasto - x.previsto;\n  const pct = n => fo.valor ? Math.min(100, Math.max(0, n / fo.valor * 100)) : 0;\n  const linha = l => { const pg = pgDe(l, p, id), c2 = cat(l.cat), vf = saidaFonte(l, fo, pg), outra = l.moeda !== fo.moeda, dividido = pagtos(l).length > 1;\n    return `<div class=\"item\" data-id=\"${l.id}\">${ic(c2.icone, c2.cor)}\n      <div><div class=\"t\">${esc(l.desc)}</div><div class=\"m\"><span class=\"st ${l.status}\">${STN[l.status]}</span><span>${nomeDia(l.dia)}</span>${dividido ? '<span>· parte de ' + esc(nomeP(p)) + '</span>' : ''}</div></div>\n      <div class=\"v num\">${fmt(vf, fs)}${outra || dividido ? `<small>${outra ? fmt(+pg.valor, l.moeda === v.nativa.cod ? v.nativa.simb : v.local.simb) : ''}${dividido ? ' de ' + fmt(l.valor, l.moeda === v.nativa.cod ? v.nativa.simb : v.local.simb) : ''}</small>` : ''}</div></div>`; };\n  $('#sheetIn').innerHTML = `<div class=\"grab\"></div><div class=\"shead\"><h2>${esc(fo.nome)}</h2><button class=\"iconbtn\" data-close><svg class=\"i\"><use href=\"#i-x\"/></svg></button></div>\n    <div class=\"sub\">${cred && fo.noOrcamento ? 'Crédito (no orçamento da viagem)' : ti.nome} · ${esc(nomeP(p))}</div>\n    <div class=\"bar seg\">${barraFonte(x)}</div>\n    <div class=\"leg-prev\"><span><i style=\"background:var(--brand-2)\"></i>${cred ? 'usado' : 'gasto'}</span><span><i style=\"background:var(--pat-apagar)\"></i>a pagar</span><span><i style=\"background:var(--pat-est)\"></i>estimado</span></div>\n    <div class=\"kpis\" style=\"margin-top:8px\">\n      <div class=\"kpi\"><div class=\"l\">${cred ? 'Usado' : 'Gasto'}</div><div class=\"v num\">${fmt0(x.gasto, fs)}</div></div>\n      <div class=\"kpi\"><div class=\"l\">A pagar</div><div class=\"v num\" style=\"color:var(--warn)\">${fmt0(x.apagar, fs)}</div></div>\n      <div class=\"kpi\"><div class=\"l\">Estimado</div><div class=\"v num\" style=\"color:var(--est)\">${fmt0(x.estimado, fs)}</div></div>\n      <div class=\"kpi\"><div class=\"l\">Saldo projetado</div><div class=\"v num proj ${classeProj(x, livre)}\">${fmt0(livre, fs)}</div></div>\n    </div>\n    <div class=\"hint\">${cred ? 'Limite' : 'Levando'}: ${fmt(fo.valor, fs)}. Saldo projetado = valor inicial − gasto − a pagar − estimado.</div>\n    <div class=\"secao\"><span>Pagas com esta fonte (${pagos.length})</span><span class=\"num\">${fmt(x.gasto, fs)}</span></div>\n    ${pagos.map(linha).join('') || '<div class=\"hint\">Nenhuma despesa paga com esta fonte ainda. Ao lançar, escolha esta fonte em \"Pago com\".</div>'}\n    <div class=\"secao\"><span>A pagar nesta fonte (${prevAp.length})</span><span class=\"num\">${fmt(x.apagar, fs)}</span></div>\n    ${prevAp.map(linha).join('') || '<div class=\"hint\">Nenhuma reserva a pagar marcada aqui. Numa reserva \"A pagar\" (ex.: hotel), abra o lançamento e escolha esta fonte em \"Vai pagar com\".</div>'}\n    <div class=\"secao\"><span>Estimadas nesta fonte (${prevEst.length})</span><span class=\"num\">${fmt(x.estimado, fs)}</span></div>\n    ${prevEst.map(linha).join('') || '<div class=\"hint\">Nenhuma estimativa marcada aqui. Numa estimativa (ex.: combustível, compras planejadas), escolha esta fonte em \"Vai pagar com\".</div>'}\n    <button class=\"btn ghost\" id=\"fEdit\" style=\"margin-top:14px\">Editar fonte</button>`;\n  abrirSheet();\n  $('#fEdit').onclick = () => editarFonte(p, id);\n}\nfunction abrirCarteira(p){\n  const v = trav(p), c = carteira(p);\n  $('#sheetIn').innerHTML = `<div class=\"grab\"></div><div class=\"shead\"><h2>Carteira de ${esc(v.nome)}</h2><button class=\"iconbtn\" data-close><svg class=\"i\"><use href=\"#i-x\"/></svg></button></div>\n    <p class=\"sub\" style=\"margin:0 0 6px\">Quanto ${esc(v.nome)} está levando, por fonte. Toque numa fonte para editar.</p>\n    ${c.fontes.map(x => { const ti = TIPO_F[x.fo.tipo] || TIPO_F.debito; const fs = x.fo.moeda === S.viagem.nativa.cod ? S.viagem.nativa.simb : S.viagem.local.simb;\n      return `<div class=\"fonte ${x.fo.tipo==='credito'?'cred':''}\" data-edf=\"${x.fo.id}\" style=\"cursor:pointer\">${seloGrande(x.fo)}\n        <div><div class=\"n\">${esc(x.fo.nome)}</div><div class=\"sub\">${x.fo.tipo==='credito' && x.fo.noOrcamento ? 'Crédito (no orçamento da viagem)' : ti.nome}</div></div><div class=\"vals num\"><b>${fmt(x.fo.valor, fs)}</b>${x.fo.tipo==='credito'?'limite':'levando'}</div></div>`; }).join('') || '<div class=\"empty\" style=\"padding:20px\">Nenhuma fonte cadastrada.</div>'}\n    <button class=\"btn ghost\" id=\"addFonte\" style=\"margin-top:10px\">+ Adicionar fonte</button>`;\n  abrirSheet();\n  $('#addFonte').onclick = () => editarFonte(p, null);\n  $('#sheetIn').querySelectorAll('[data-edf]').forEach(b => b.onclick = () => editarFonte(p, b.dataset.edf));\n}\nfunction editarFonte(p, id){\n  const v = trav(p), sv = S.viagem; v.fontes ||= [];\n  const orig = id ? v.fontes.find(x => x.id === id) : null;\n  const E = orig ? {...orig} : {id:null, nome:'', tipo:'debito', moeda:sv.local.cod, valor:null, cambio:null, iof:sv.iofPadrao};\n  { const sl = seloDe(E); E._sigla = orig && orig.sigla ? orig.sigla : sl.sigla; E._cor = orig && orig.cor ? orig.cor : sl.cor; E._siglaManual = !!(orig && orig.sigla); }\n  const desenhar = () => {\n    const cred = E.tipo === 'credito', loc = E.moeda === sv.local.cod;\n    if (!E._siglaManual) { const sl = padraoSelo(E); E._sigla = sl.sigla; if (!E._corManual) E._cor = sl.cor; }\n    $('#sheetIn').innerHTML = `<div class=\"grab\"></div><div class=\"shead\"><h2>${orig?'Editar fonte':'Nova fonte'}</h2><button class=\"iconbtn\" id=\"voltaCart\"><svg class=\"i\"><use href=\"#i-x\"/></svg></button></div>\n      <div class=\"flabel\">Nome</div><input class=\"field\" id=\"eNome\" placeholder=\"Ex.: Nomad débito internacional\" value=\"${esc(E.nome)}\">\n      <div class=\"flabel\">Selo <span class=\"muted\" style=\"font-weight:400\">· aparece nos lançamentos pagos com esta fonte</span></div>\n      <div class=\"selo-edit\"><span id=\"eSeloPrev\">${seloGrande({...E, sigla: E._sigla, cor: E._cor})}</span>\n        <input class=\"field\" id=\"eSigla\" maxlength=\"5\" placeholder=\"Sigla\" value=\"${esc(E._sigla || '')}\"></div>\n      <div class=\"cores-selo\" id=\"eCores\">${CORES_SELO.map(c => `<button data-cor=\"${c}\" style=\"background:${c}\" class=\"${(E._cor||'').toUpperCase()===c.toUpperCase()?'on':''}\" aria-label=\"cor ${c}\"></button>`).join('')}</div>\n      <div class=\"flabel\">Tipo</div><div class=\"segl\" id=\"eTipo\">${Object.entries(TIPO_F).map(([k,t])=>`<button data-t=\"${k}\" class=\"${E.tipo===k?'on':''}\">${k==='debito'?'Débito / conta':k==='credito'?'Crédito':'Espécie'}</button>`).join('')}</div>\n      ${cred?`<div class=\"toggle\"><div>Usar no orçamento da viagem<div class=\"hint\" style=\"margin:0\">Ligado: o limite conta como dinheiro da viagem (ex.: cartão para pagar hotéis). Desligado: fica como reserva de emergência.</div></div><button class=\"sw ${E.noOrcamento?'on':''}\" id=\"eOrc\"></button></div>`:''}\n      <div class=\"flabel\">Moeda</div><div class=\"cur\" id=\"eMoeda\" style=\"display:inline-flex\"><button data-m=\"${sv.local.cod}\" class=\"${loc?'on':''}\">${sv.local.simb}</button><button data-m=\"${sv.nativa.cod}\" class=\"${!loc?'on':''}\">${sv.nativa.simb}</button></div>\n      <div class=\"flabel\">${cred?'Limite disponível para a viagem':'Quanto está levando'}</div>\n      <input class=\"field num\" id=\"eValor\" inputmode=\"decimal\" placeholder=\"0,00\" value=\"${E.valor!=null?String(E.valor).replace('.',','):''}\">\n      ${loc ? `<div class=\"flabel\">Câmbio pago (${sv.nativa.simb} por ${sv.local.simb}) <span class=\"muted\" style=\"font-weight:400\">· opcional</span></div>\n        <input class=\"field num\" id=\"eCambio\" inputmode=\"decimal\" placeholder=\"Em branco: cotação + IOF padrão\" value=\"${E.cambio?String(E.cambio).replace('.',','):''}\">\n        <div class=\"hint\">Quanto custou cada ${sv.local.simb} já com IOF e taxas. Serve para mostrar em ${sv.nativa.simb} o custo real dos gastos feitos com esta fonte.</div>`\n      : `<div class=\"flabel\">IOF (%)</div><input class=\"field num\" id=\"eIof\" inputmode=\"decimal\" value=\"${String(E.iof ?? sv.iofPadrao).replace('.',',')}\">\n        <div class=\"hint\">Gastos em ${sv.local.simb} com esta fonte são convertidos pela cotação + este IOF.</div>`}\n      <button class=\"btn pri\" id=\"eOk\">Salvar</button>${orig?'<button class=\"btn danger\" id=\"eDel\">Excluir fonte</button>':''}`;\n    const ler = () => { E.nome = $('#eNome').value; E.valor = $('#eValor').value; const sg = $('#eSigla').value.trim().toUpperCase(); if (sg !== E._sigla) { E._sigla = sg; E._siglaManual = true; } if ($('#eCambio')) E.cambio = $('#eCambio').value; if ($('#eIof')) E.iof = $('#eIof').value; };\n    if ($('#eOrc')) $('#eOrc').onclick = () => { ler(); E.noOrcamento = !E.noOrcamento; desenhar(); };\n    $('#eCores').onclick = e => { const b = e.target.closest('[data-cor]'); if (!b) return; ler(); E._cor = b.dataset.cor; E._corManual = true; desenhar(); };\n    $('#eSigla').oninput = () => { E._sigla = $('#eSigla').value.trim().toUpperCase(); E._siglaManual = true; const f = {...E, sigla: E._sigla, cor: E._cor}; $('#eSeloPrev').innerHTML = seloGrande(f); };\n    $('#eNome').onchange = () => { ler(); if (!E._siglaManual) desenhar(); };\n    $('#eTipo').onclick = e => { const b = e.target.closest('[data-t]'); if (!b) return; ler(); E.tipo = b.dataset.t; desenhar(); };\n    $('#eMoeda').onclick = e => { const b = e.target.closest('[data-m]'); if (!b) return; ler(); E.moeda = b.dataset.m; desenhar(); };\n    $('#voltaCart').onclick = () => abrirCarteira(p);\n    $('#eOk').onclick = () => {\n      ler(); const num = x => numBR(String(x ?? ''));\n      const valor = num(E.valor); if (!(valor >= 0) || E.valor === '' || E.valor == null) return toast('Digite o valor');\n      const reg = {id: E.id || p + '-f' + Date.now().toString(36), nome: E.nome.trim() || TIPO_F[E.tipo].nome, tipo: E.tipo, moeda: E.moeda, valor, noOrcamento: E.tipo === 'credito' ? !!E.noOrcamento : undefined, sigla: (E._sigla || '').slice(0, 5) || undefined, cor: E._cor || undefined,\n        cambio: E.moeda === sv.local.cod && num(E.cambio) > 0 ? num(E.cambio) : null, iof: E.moeda === sv.nativa.cod ? (num(E.iof) >= 0 ? num(E.iof) : sv.iofPadrao) : undefined};\n      reg.upd = Date.now();\n      if (orig) Object.assign(orig, reg); else v.fontes.push(reg);\n      save(); render(); abrirCarteira(p); toast('Fonte salva');\n    };\n    if ($('#eDel')) $('#eDel').onclick = () => {\n      v.fontes = v.fontes.filter(x => x.id !== id);\n      for (const l of S.lanc) { if (l.por === p && l.fonte === id) l.fonte = null; for (const pg of l.pagamentos || []) if (pg.por === p && pg.fonte === id) pg.fonte = null; }\n      save(); render(); abrirCarteira(p); toast('Fonte excluída');\n    };\n  };\n  desenhar();\n}\n\n/* ---------- telas ---------- */\nfunction topo(){\n  const d = diaAtual(), v = S.viagem;\n  const pill = d < 1 ? (() => { const n = Math.round((new Date(v.inicio + 'T00:00:00') - new Date(new Date().toDateString())) / 864e5); return n > 1 ? `Faltam ${n} dias` : n === 1 ? 'Começa amanhã' : 'Começa hoje'; })()\n    : d > v.dias ? 'Viagem encerrada' : `Hoje: D${d} de ${v.dias} · ${dataDia(d)}`;\n  return `<header class=\"top\">\n    <div class=\"top-row\">\n      <div class=\"trip\">Viagem<b>${esc(S.viagem.nome)}</b></div>\n      <div class=\"dir\"><div class=\"daypill\">${pill}${v.hojeManual ? ' · teste' : ''}</div><\!-- Clé: sincronizar virou função do app (Mais → Arquivo da viagem e sincronização) --></div>\n    </div>\n    <div class=\"seg\" id=\"segP\">\n      ${['t',...S.viagem.viajantes.map(v=>v.id)].map(p=>`<button data-p=\"${p}\" class=\"${UI.pessoa===p?'on':''}\">${p==='t'?'Total':esc(nomeP(p))}</button>`).join('')}\n    </div>\n  </header>`;\n}\n\nfunction telaPainel(){\n  const p = UI.pessoa, sb = simbVer(), t = totais(p);\n  const pct = t.proj ? Math.min(100, t.real/t.proj*100) : 0;\n  const dif = t.proj - t.plano, difPct = t.plano ? dif/t.plano*100 : 0;\n  const outraSimb = UI.moedaVer==='nativa' ? S.viagem.local.simb : S.viagem.nativa.simb;\n  const outra = (()=>{ const k=UI.moedaVer; UI.moedaVer = k==='nativa'?'local':'nativa'; const x=totais(p); UI.moedaVer=k; return x; })();\n  const dias = porDia(p), maxD = Math.max(1,...dias.map(x=>Math.max(x.plano,x.real)));\n  const hoje = diaAtual();\n  const restDias = Math.max(1, S.viagem.dias - Math.max(1, hoje) + 1);\n  const naViagem = hoje >= 1 && hoje <= S.viagem.dias;\n  const cats = porCategoria(p).sort((a,b)=>Math.max(b.plano,b.real)-Math.max(a.plano,a.real));\n  const dv = dividasPorDirecao();\n  // compensação só quando duas pessoas devem uma à outra\n  const nets = []; const vistos = new Set();\n  for (const x of dv) { const k = [x.de, x.para].sort().join('|'); if (vistos.has(k)) continue; const volta = dv.find(y => y.de === x.para && y.para === x.de);\n    if (volta) { vistos.add(k); const a = x.pago + x.prev, b = volta.pago + volta.prev; if (Math.abs(a - b) >= 0.01) nets.push(a > b ? {de:x.de, para:x.para, v:a-b} : {de:x.para, para:x.de, v:b-a}); } }\n  const due = ativos().filter(l => l.status==='apagar' && l.dia>=hoje && parte(l,p)).sort((a,b)=>a.dia-b.dia).slice(0,4);\n  return topo() + `<div class=\"wrap\">\n    <section class=\"card hero\">\n      <div style=\"display:flex;justify-content:space-between;align-items:flex-start\">\n        <div><div class=\"lbl\">Projeção do custo total · ${esc(nomeP(p))}</div>\n          <div class=\"big num\">${fmt(t.proj, sb)}</div>\n          <div class=\"alt num\">≈ ${fmt0(outra.proj, outraSimb)}</div></div>\n        <div class=\"cur\" id=\"curVer\">\n          <button data-m=\"local\" class=\"${UI.moedaVer==='local'?'on':''}\">${S.viagem.local.simb}</button>\n          <button data-m=\"nativa\" class=\"${UI.moedaVer==='nativa'?'on':''}\">${S.viagem.nativa.simb}</button>\n        </div>\n      </div>\n      <div class=\"bar\"><i style=\"width:${pct}%\"></i></div>\n      <div class=\"legend\"><span>Já pago/gasto <b class=\"num\">${fmt0(t.real,sb)}</b></span><span>Falta <b class=\"num\">${fmt0(t.falta,sb)}</b></span></div>\n      <div class=\"plan-line\">Planejado <b class=\"num\">${fmt0(t.plano,sb)}</b> · <span class=\"${dif>0.005?'up':'down'}\">${Math.abs(dif)<0.005?'dentro do plano':(dif>0?'acima ':'abaixo ')+fmt0(Math.abs(dif),sb)+' ('+(dif>0?'+':'')+difPct.toFixed(2).replace('.',',')+'%)'}</span></div>\n      <div class=\"kpis\">\n        ${naViagem ? `<div class=\"kpi\"><div class=\"l\">Gasto de hoje</div><div class=\"v num\">${fmt0(dias[hoje-1]?.real||0,sb)}</div><div class=\"a\">planejado ${fmt0(dias[hoje-1]?.plano||0,sb)}</div></div>`\n          : `<div class=\"kpi\"><div class=\"l\">Já pago antes de embarcar</div><div class=\"v num\">${fmt0(t.real,sb)}</div><div class=\"a\">passagens, reservas e ingressos</div></div>`}\n        <div class=\"kpi\"><div class=\"l\">Disponível por dia</div><div class=\"v num\">${fmt0(Math.max(0,t.plano-t.real)/restDias,sb)}</div><div class=\"a\">até o fim, para ficar no plano</div></div>\n      </div>\n    </section>\n\n    ${p==='t' ? cardDinheiroTodos() : cardCarteira(p)}\n\n    ${p==='t' && S.viagem.viajantes.length > 1 ? `<section class=\"card\"><h3>Acerto entre vocês <small>despesas divididas</small></h3>\n      ${dv.length ? dv.map(x => `<div class=\"acerto\" data-dev=\"${x.de}|${x.para}\">${av(x.de)}<svg class=\"i arrow\"><use href=\"#i-arrow\"/></svg>${av(x.para)}\n        <div class=\"t\">${esc(nomeP(x.de))} deve a ${esc(nomeP(x.para))}${x.pago < 0.01 ? '<span class=\"prevtag\">previsto</span>' : ''}<b class=\"num\">${fmt(x.pago + x.prev, sb)}</b>${x.pago >= 0.01 && x.prev >= 0.01 ? `<div class=\"sub2 num\">já pago ${fmt(x.pago, sb)} · previsto ${fmt(x.prev, sb)}</div>` : ''}</div></div>`).join('')\n        + nets.map(n => `<div class=\"acerto-net\">Para acertar: <b>${esc(nomeP(n.de))} transfere ${fmt(n.v, sb)} a ${esc(nomeP(n.para))}</b></div>`).join('')\n        : '<div class=\"acerto\"><div class=\"t\"><b>Tudo acertado</b></div></div>'}\n      <div class=\"hint\">Soma, conta a conta, o que cada um pagou a mais que a sua parte. \"Previsto\" = contas estimadas ou a pagar; \"já pago\" = contas pagas.</div></section>` : ''}\n\n    <section class=\"card\"><h3>Por categoria <small>planejado × gasto</small></h3>\n      ${cats.map(x=>{ const ref=Math.max(x.plano,x.orc||0,1); const over=x.real>x.plano+0.005;\n        return `<div class=\"catrow\" data-cat=\"${x.c.id}\">${ic(x.c.icone,x.c.cor)}\n          <div><div class=\"n\">${esc(x.c.nome)}</div>\n          <div class=\"minibar\"><i style=\"width:${Math.min(100,x.plano/ref*100)}%;background:${x.c.cor}33\"></i><i style=\"width:${Math.min(100,x.real/ref*100)}%;background:${over?'var(--bad)':x.c.cor}\"></i></div></div>\n          <div class=\"vals num\"><b>${fmt0(x.plano,sb)}</b><span class=\"${over?'':'muted'}\" style=\"${over?'color:var(--bad)':''}\">${fmt0(x.real,sb)} gasto</span></div></div>`;}).join('')}\n    </section>\n\n    <section class=\"card\"><h3>Dia a dia <small>toque para ver o dia</small></h3>\n      <div class=\"days\">${dias.map(x=>`<div class=\"day ${x.d===hoje?'today':''}\" data-dia=\"${x.d}\">\n        <div class=\"col\"><div class=\"p\" style=\"height:${x.plano/maxD*100}%\"></div><div class=\"r ${x.real>x.plano*1.05&&x.real>0?'over':''}\" style=\"height:${x.real/maxD*100}%\"></div></div>\n        <span>${x.d}</span></div>`).join('')}</div>\n      <div class=\"dleg\"><span><i style=\"background:var(--brand-soft)\"></i>Planejado</span><span><i style=\"background:var(--brand-2)\"></i>Gasto</span><span><i style=\"background:var(--bad)\"></i>Acima do plano</span></div>\n    </section>\n\n    ${due.length?`<section class=\"card\"><h3>Próximos pagamentos no local</h3>\n      ${due.map(l=>`<div class=\"due\" data-id=\"${l.id}\"><span class=\"d\">D${l.dia}</span><span class=\"x\">${esc(l.desc)}</span><span class=\"v num\">${fmt(val(l,p,UI.moedaVer),sb)}</span></div>`).join('')}</section>`:''}\n  </div>`;\n}\n\nfunction telaLista(){\n  const sb = simbVer(), p = UI.pessoa;\n  let ls = S.lanc.filter(l => parte(l,p) > 0);\n  if (UI.filtroStatus !== 'todos') ls = ls.filter(l => l.status === UI.filtroStatus);\n  if (UI.filtroCat) ls = ls.filter(l => l.cat === UI.filtroCat);\n  if (UI.filtroDia !== null) ls = ls.filter(l => l.dia === UI.filtroDia);\n  if (UI.busca) { const q = UI.busca.toLowerCase(); ls = ls.filter(l => (l.desc+' '+l.sub+' '+cat(l.cat).nome+' '+(l.obs||'')).toLowerCase().includes(q)); }\n  const grupos = {};\n  ls.sort((a,b)=>b.dia-a.dia).forEach(l => (grupos[l.dia] ||= []).push(l));\n  const ordem = Object.keys(grupos).map(Number).sort((a,b)=>a-b);\n  const filtrosAtivos = (UI.filtroCat?`<span class=\"chip on\" data-clr=\"cat\">${esc(cat(UI.filtroCat).nome)} ✕</span>`:'') + (UI.filtroDia!==null?`<span class=\"chip on\" data-clr=\"dia\">${nomeDia(UI.filtroDia)} ✕</span>`:'');\n  return topo() + `<div class=\"bar-tools\" style=\"margin-top:-40px;background:transparent;position:static\">\n      <div class=\"search\" style=\"box-shadow:var(--shadow)\"><svg class=\"i muted\"><use href=\"#i-search\"/></svg><input id=\"busca\" placeholder=\"Buscar (nome, localizador, loja...)\" value=\"${esc(UI.busca)}\"></div>\n      <div class=\"chips\">${filtrosAtivos}${['todos','realizado','pago','apagar','estimado'].map(s=>`<span class=\"chip ${UI.filtroStatus===s?'on':''}\" data-st=\"${s}\">${s==='todos'?'Todos':STN[s]}</span>`).join('')}</div>\n    </div>\n    ${p!=='t' ? `<div class=\"group\">${cardCarteira(p)}</div>` : ''}\n    ${ordem.length? ordem.map(d => { const tot = grupos[d].reduce((s,l)=>s+(l.incluir?val(l,p,UI.moedaVer):0),0);\n      return `<div class=\"group\"><div class=\"ghead\"><span>${nomeDia(d)}</span><span class=\"num\">${fmt(tot,sb)}</span></div>\n      ${grupos[d].map(l=>{ const c=cat(l.cat); const v=val(l,p,UI.moedaVer); const vn = UI.moedaVer==='nativa'?emLocal(l)*parte(l,p):emNativa(l)*parte(l,p);\n        return `<div class=\"item ${l.incluir?'':'off'}\" data-id=\"${l.id}\">${ic(c.icone,c.cor)}\n          <div><div class=\"t\">${esc(l.desc)}</div>${l.obs && UI.busca ? `<div class=\"obs\">${esc(l.obs)}</div>` : ''}<div class=\"m\"><span class=\"st ${l.status}\">${STN[l.status]}</span>${whoBadge(l)}<span>${esc(l.sub)}</span>${(() => { const partes = pagtos(l).filter(pg => (p === 't' || pg.por === p) && fonteObj(pg)).map(pg => seloHTML(fonteObj(pg), p === 't' ? pg.por : null, `data-selo=\"${l.id}|${pg.por}\" title=\"${esc(nomeP(pg.por) + ' · ' + fonteObj(pg).nome)}\"`)).join(''); return partes ? `<span class=\"selos\">${partes}</span>` : ''; })()}${semFormaPgto(l, p) ? `<span class=\"nopay\" data-nopay title=\"Meio de pagamento não definido\" aria-label=\"Meio de pagamento não definido\">${ICONE_SEM_PGTO}</span>` : ''}${dividasVisiveis(l, p).length ? `<span class=\"divida\" data-divida=\"${l.id}\" title=\"Conta dividida com acerto pendente\" aria-label=\"Conta dividida com acerto pendente\">${ICONE_DIVIDA}</span>` : ''}${(!isReal(l) || (pagtos(l).length===1 && l.resp.length===1 && l.resp[0]===l.por)) ? '' : `<span class=\"pagopor\">· ${pagtos(l).length > 1 ? 'pago por ' + pagtos(l).map(pg => esc(nomeP(pg.por))).join(' e ') : 'pago por ' + esc(nomeP(l.por))}</span>`}</div></div>\n          <div class=\"v num\">${fmt(v,sb)}<small>${fmt0(vn, UI.moedaVer==='nativa'?S.viagem.local.simb:S.viagem.nativa.simb)}</small></div></div>`;}).join('')}</div>`; }).join('')\n      : `<div class=\"empty\">Nenhum lançamento com esses filtros.</div>`}`;\n}\n\nfunction telaCategorias(){\n  const sb = simbVer();\n  const tot = {}; for (const l of ativos()) { tot[l.cat] = (tot[l.cat]||0) + (isPlano(l)?val(l,'t',UI.moedaVer):0); }\n  return `<div class=\"page-h\"><h1>Categorias</h1><p>Organize os gastos do seu jeito. Toque numa categoria para editar e defina um orçamento limite se quiser.</p></div>\n  <div class=\"list\"><div class=\"card\" style=\"padding:6px 16px\">\n    ${S.categorias.map(c=>`<div class=\"catrow\" data-editcat=\"${c.id}\">${ic(c.icone,c.cor)}\n      <div><div class=\"n\">${esc(c.nome)}</div><div class=\"sub\">${c.subs.length} subcategorias${S.viagem.orcamento[c.id]?' · limite '+fmt0(S.viagem.orcamento[c.id],S.viagem.local.simb):''}</div></div>\n      <div class=\"vals num\"><b>${fmt0(tot[c.id]||0,sb)}</b><span class=\"muted\">planejado</span></div></div>\n      <div class=\"subs\">${c.subs.map(s=>`<span class=\"chip\">${esc(s)}</span>`).join('')}<span class=\"chip\" data-addsub=\"${c.id}\" style=\"color:var(--brand-2)\">+ subcategoria</span></div>`).join('')}\n  </div>\n  <button class=\"btn ghost\" id=\"novaCat\">+ Nova categoria</button></div>`;\n}\n\nfunction telaAjustes(){\n  const v = S.viagem;\n  return `<div class=\"page-h\"><h1>Ajustes</h1><p>Viagem, viajantes, moedas e sincronização entre os celulares.</p></div>\n  <div class=\"list\">\n    <div class=\"card\"><h3>Viagem</h3>\n      <div class=\"set\"><div class=\"k\">Nome</div><input class=\"field\" style=\"width:170px;text-align:right\" data-cfgt=\"nome\" value=\"${esc(v.nome)}\"></div>\n      <div class=\"set\"><div class=\"k\">Primeiro dia</div><input class=\"field\" type=\"date\" style=\"width:170px\" data-cfgt=\"inicio\" value=\"${esc(v.inicio)}\"></div>\n      <div class=\"set\"><div class=\"k\">Número de dias</div><input class=\"field num\" inputmode=\"numeric\" style=\"width:90px\" data-cfgn=\"dias\" value=\"${v.dias}\"></div>\n    </div>\n    <div class=\"card\"><h3>Viajantes <small>${v.viajantes.length} ${v.viajantes.length===1?'pessoa':'pessoas'}</small></h3>\n      ${v.viajantes.map(x=>`<div class=\"trav\"><span data-cor-p=\"${x.id}\">${av(x.id)}</span>\n        <input class=\"field\" data-nome-p=\"${x.id}\" value=\"${esc(x.nome)}\" aria-label=\"Nome do viajante\">\n        <button class=\"iconbtn\" data-cart=\"${x.id}\" aria-label=\"Carteira de ${esc(x.nome)}\" title=\"Carteira\"><svg class=\"i\"><use href=\"#i-wallet\"/></svg></button>\n        <button class=\"minus\" data-rm-p=\"${x.id}\" ${v.viajantes.length<2?'disabled':''} aria-label=\"Remover ${esc(x.nome)}\">−</button></div>`).join('')}\n      <button class=\"btn ghost\" id=\"addP\" style=\"margin-top:10px\">+ Adicionar viajante</button>\n      <div class=\"hint\">Toque no círculo para trocar a cor.</div>\n    </div>\n    <div class=\"card\"><h3>Este aparelho</h3>\n      <div class=\"set\"><div class=\"k\">Pertence a<small>Define quem lançou e o responsável padrão</small></div>\n        <select class=\"field\" id=\"aparelho\" style=\"width:150px\">${v.viajantes.map(x=>`<option value=\"${x.id}\" ${S.aparelho===x.id?'selected':''}>${esc(x.nome)}</option>`).join('')}</select></div>\n    </div>\n    <div class=\"card\"><h3>Moedas e câmbio</h3>\n      <div class=\"set\"><div class=\"k\">Moeda do destino<small>código e símbolo</small></div><div style=\"display:flex;gap:6px\"><input class=\"field\" style=\"width:64px\" data-cfg=\"local.cod\" value=\"${esc(v.local.cod)}\"><input class=\"field\" style=\"width:64px\" data-cfg=\"local.simb\" value=\"${esc(v.local.simb)}\"></div></div>\n      <div class=\"set\"><div class=\"k\">Sua moeda<small>código e símbolo</small></div><div style=\"display:flex;gap:6px\"><input class=\"field\" style=\"width:64px\" data-cfg=\"nativa.cod\" value=\"${esc(v.nativa.cod)}\"><input class=\"field\" style=\"width:64px\" data-cfg=\"nativa.simb\" value=\"${esc(v.nativa.simb)}\"></div></div>\n      <div class=\"set\"><div class=\"k\">Cotação<small>1 ${esc(v.local.cod)} = ? ${esc(v.nativa.cod)}</small></div><input class=\"field num\" inputmode=\"decimal\" data-cfg=\"cotacao\" value=\"${String(v.cotacao).replace('.',',')}\"></div>\n      <div class=\"set\"><div class=\"k\">IOF padrão (%)<small>quando o gasto não tem fonte ou câmbio próprio</small></div><input class=\"field num\" inputmode=\"decimal\" data-cfg=\"iofPadrao\" value=\"${String(v.iofPadrao).replace('.',',')}\"></div>\n      <div class=\"hint\">O câmbio e o IOF de cada cartão ou dinheiro ficam na carteira de cada viajante (ícone de carteira acima). Em cada lançamento dá para digitar o valor real da fatura, que substitui qualquer cálculo.</div>\n    </div>\n    <\!-- Clé: sincronização e arquivo da viagem agora são do app -->\n\n    <div class=\"card\"><h3>Dados deste aparelho</h3>\n      <div class=\"set\"><div class=\"k\">Simular o dia da viagem<small>para testar; deixe vazio para usar a data real</small></div><input class=\"field num\" style=\"width:72px\" inputmode=\"numeric\" id=\"hojeSim\" placeholder=\"auto\" value=\"${v.hojeManual??''}\"></div>\n      <button class=\"btn ghost\" id=\"abrirArq\" style=\"margin-top:8px\">Abrir outro arquivo de viagem</button>\n      <div class=\"hint\">Abrir um arquivo substitui tudo o que está neste aparelho. Para somar os lançamentos de outro celular, use \"Juntar arquivo\".</div>\n      <button class=\"btn danger\" id=\"apagarTudo\">Apagar todos os dados deste aparelho</button>\n      <div class=\"hint\">Versão ${VERSAO_APP} · os dados ficam só neste aparelho; faça exportações de segurança de vez em quando.</div>\n    </div>\n  </div>`;\n}\n\n/* ---------- formulário (novo / editar) ---------- */\nlet F = null;\nfunction abrirForm(id){\n  const l = id ? S.lanc.find(x=>x.id===id) : null;\n  F = l ? JSON.parse(JSON.stringify(l)) : { id:null, desc:'', cat:null, sub:null, valor:null, moeda:S.viagem.local.cod,\n    dia:Math.min(S.viagem.dias, diaAtual()), status:'realizado', obs:'', resp:[S.aparelho], partes:null, pagamentos:null, por:S.aparelho, fonte: fontePadrao(S.aparelho), fatura:null, incluir:true, foto:null };\n  F._mais = !!(l && (l.fatura || l.foto || !l.incluir));\n  F.pagamentos ??= null; F._pgAuto = false;\n  renderForm(); abrirSheet();\n}\n// parte de cada responsável no total do formulário (igual ou por valores)\nfunction parteForm(id, total){\n  if (!F.resp.includes(id) || !(total > 0)) return 0;\n  if (F.partes) return numBR(String(F.partes[id] ?? '')) || 0;\n  return total / F.resp.length;\n}\n// valores automáticos dos pagamentos: cada pagador paga a sua parte; o que sobrar fica com o primeiro\nfunction autoPagamentos(){\n  if (!F.pagamentos || !F._pgAuto) return;\n  const total = numBR(String(F.valor ?? '')) || 0;\n  const vals = F.pagamentos.map(pg => Math.round(parteForm(pg.por, total) * 100) / 100);\n  const dif = Math.round((total - vals.reduce((a,b) => a + b, 0)) * 100) / 100;\n  vals[0] = Math.round((vals[0] + dif) * 100) / 100;\n  F.pagamentos.forEach((pg, i) => pg.valor = vals[i] > 0 ? vals[i] : 0);\n}\nfunction somaPg(){ return (F.pagamentos || []).reduce((a,pg) => a + (numBR(String(pg.valor ?? '')) || 0), 0); }\nfunction textoRestoPg(){\n  const total = numBR(String(F.valor ?? '')) || 0, r = Math.round((total - somaPg()) * 100) / 100;\n  const sb = F.moeda === S.viagem.nativa.cod ? S.viagem.nativa.simb : S.viagem.local.simb;\n  return Math.abs(r) < 0.005 ? ['ok', 'Pagamentos somam o total ✓'] : r > 0 ? ['bad', 'Falta distribuir ' + fmt(r, sb)] : ['bad', 'Passou ' + fmt(-r, sb) + ' do total'];\n}\nfunction blocoPagamentos(){\n  const pago = F.status === 'realizado' || F.status === 'pago';\n  if (!F.pagamentos) return `<div><div class=\"flabel\">${pago ? 'Pago com' : 'Vai pagar com'} ${fonteDe(F) ? seloHTML(fonteDe(F)) : ''}</div><select class=\"field\" id=\"fFonte\">${((trav(F.por)||{}).fontes||[]).map(fo=>`<option value=\"${fo.id}\" ${F.fonte===fo.id?'selected':''}>${esc(fo.nome)}</option>`).join('')}<option value=\"\" ${!F.fonte?'selected':''}>Não informado</option></select></div>`;\n  autoPagamentos();\n  const total = numBR(String(F.valor ?? '')) || 0;\n  const cadaUmSuaParte = F.pagamentos.every(pg => Math.abs((numBR(pg.valor) || 0) - parteForm(pg.por, total)) < 0.01);\n  const [cls, txt] = textoRestoPg();\n  return `<div class=\"flabel\">${pago ? 'Quanto cada um pagou e com o quê' : 'Quanto cada um vai pagar e com o quê'}</div>\n    <div class=\"partes\">${F.pagamentos.map(pg => `<div class=\"pgrow\"><div class=\"quem\">${av(pg.por)}${esc(nomeP(pg.por))} ${fonteObj(pg) ? seloHTML(fonteObj(pg)) : ''}</div>\n      <input class=\"field num\" inputmode=\"decimal\" data-pgv=\"${pg.por}\" value=\"${isNaN(numBR(pg.valor)) ? '' : numBR(pg.valor).toFixed(2).replace('.',',')}\" placeholder=\"0,00\">\n      <select class=\"field\" data-pgf=\"${pg.por}\">${((trav(pg.por)||{}).fontes||[]).map(fo=>`<option value=\"${fo.id}\" ${pg.fonte===fo.id?'selected':''}>${esc(fo.nome)}</option>`).join('')}<option value=\"\" ${!pg.fonte?'selected':''}>Não informado</option></select></div>`).join('')}\n      <div class=\"resto ${cls}\" id=\"fPgResto\">${txt}</div></div>\n    <div class=\"hint\">${cadaUmSuaParte ? 'Cada um paga a sua parte: não gera acerto entre vocês.' : 'Quem pagar mais que a sua parte fica com crédito no Acerto entre vocês.'} A forma de pagamento de cada um pode ser escolhida depois, no celular de cada um, e sincronizada.</div>`;\n}\nfunction fontePadrao(p){ if (!p) return null; const fs = (trav(p)||{}).fontes || []; const u = (S.ultFonte||{})[p]; if (u && fs.some(x => x.id === u)) return u; const d = fs.find(x => x.tipo !== 'credito') || fs[0]; return d ? d.id : null; }\nfunction respPadrao(c){ return respPorRegra(cat(c).regra); }\nfunction somaPartes(){ return F.resp.reduce((a,id) => a + (numBR(String((F.partes||{})[id] ?? '')) || 0), 0); }\nfunction blocoDivisao(){\n  if (F.resp.length < 2) return '<div class=\"hint\">Toque em mais de um nome para dividir o valor.</div>';\n  const porValores = !!F.partes, n = numBR(String(F.valor??'')) || 0;\n  const sb = F.moeda===S.viagem.nativa.cod ? S.viagem.nativa.simb : S.viagem.local.simb;\n  let h = `<div class=\"segl\" id=\"fModo\" style=\"margin-top:10px\"><button data-modo=\"igual\" class=\"${!porValores?'on':''}\">Dividir igual</button><button data-modo=\"valores\" class=\"${porValores?'on':''}\">Por valores</button></div>`;\n  if (!porValores) return h + `<div class=\"hint\">${F.resp.length} pessoas: ${fmtParte()} para cada um.</div>`;\n  const resto = n - somaPartes();\n  return h + `<div class=\"partes\">${F.resp.map(id => `<div class=\"parte-row\">${av(id)}<span class=\"x\">${esc(nomeP(id))}</span>\n      <input class=\"field num\" inputmode=\"decimal\" data-parte=\"${id}\" placeholder=\"0,00\" value=\"${(F.partes[id] ?? '') === '' ? '' : typeof F.partes[id] === 'number' ? F.partes[id].toFixed(2).replace('.',',') : String(F.partes[id])}\"></div>`).join('')}\n    <div class=\"resto ${Math.abs(resto) < 0.005 ? 'ok' : 'bad'}\" id=\"fResto\">${Math.abs(resto) < 0.005 ? 'Tudo distribuído ✓' : resto > 0 ? 'Falta distribuir ' + fmt(resto, sb) : 'Passou ' + fmt(-resto, sb) + ' do total'}</div></div>\n    <div class=\"hint\">Use para contas de restaurante em que cada um consumiu um valor. Taxa e gorjeta: some na parte de cada um.</div>`;\n}\nfunction fmtParte(){ const n = numBR(String(F.valor??'')); if (!(n>0)) return 'a mesma parte'; const sb = F.moeda===S.viagem.nativa.cod?S.viagem.nativa.simb:S.viagem.local.simb; return fmt(n/F.resp.length, sb); }\nfunction renderForm(){\n  const v = S.viagem, c = F.cat ? cat(F.cat) : null;\n  const num = numBR(String(F.valor??''));\n  let conv = '';\n  if (!isNaN(num) && num>0){\n    const tmp = {...F, valor:num, fatura:null};\n    conv = F.moeda===v.local.cod ? `≈ ${fmt(emNativa(tmp), v.nativa.simb)} ${descConv(fonteDe(F))}` : `≈ ${fmt(emLocal(tmp), v.local.simb)}`;\n  }\n  const opDias = [`<option value=\"0\" ${F.dia===0?'selected':''}>Pré-viagem</option>`].concat(Array.from({length:v.dias},(_,i)=>`<option value=\"${i+1}\" ${F.dia===i+1?'selected':''}>${nomeDia(i+1)}</option>`)).join('');\n  $('#sheetIn').innerHTML = `<div class=\"grab\"></div>\n    <div class=\"shead\"><h2>${F.id?'Editar lançamento':'Novo lançamento'}</h2><button class=\"iconbtn\" data-close><svg class=\"i\"><use href=\"#i-x\"/></svg></button></div>\n    <div class=\"amount\"><input id=\"fValor\" class=\"num\" inputmode=\"decimal\" placeholder=\"0,00\" value=\"${F.valor!=null?String(F.valor).replace('.',','):''}\">\n      <div class=\"cur\" id=\"fMoeda\"><button data-m=\"${v.local.cod}\" class=\"${F.moeda===v.local.cod?'on':''}\">${v.local.simb}</button><button data-m=\"${v.nativa.cod}\" class=\"${F.moeda===v.nativa.cod?'on':''}\">${v.nativa.simb}</button></div></div>\n    <div class=\"conv num\" id=\"fConv\">${conv}</div>\n\n    <div class=\"flabel\">Categoria</div>\n    <div class=\"catgrid\">${S.categorias.map(x=>`<button class=\"catbtn ${F.cat===x.id?'on':''}\" data-fcat=\"${x.id}\">${ic(x.icone,x.cor)}${esc(x.nome)}</button>`).join('')}</div>\n    ${c?`<div class=\"flabel\">Subcategoria</div><div class=\"chips\" style=\"flex-wrap:wrap;margin:0\">${c.subs.map(s=>`<span class=\"chip ${F.sub===s?'on':''}\" data-fsub=\"${esc(s)}\">${esc(s)}</span>`).join('')}</div>`:''}\n\n    <div class=\"flabel\">Descrição</div>\n    <input class=\"field\" id=\"fDesc\" placeholder=\"Ex.: almoço no Whataburger\" value=\"${esc(F.desc)}\">\n    ${F.obs || F._mais ? `<div class=\"flabel\">Observação</div><textarea class=\"field\" id=\"fObs\" rows=\"2\" placeholder=\"Localizador, regra de pagamento, lembrete...\">${esc(F.obs||'')}</textarea>` : ''}\n\n    <div class=\"flabel\">Quem é o responsável por este custo?</div>\n    <div class=\"pchips\" id=\"fResp\">${S.viagem.viajantes.map(x=>`<button class=\"pchip ${F.resp.includes(x.id)?'on':''}\" data-r=\"${x.id}\">${av(x.id)}${esc(x.nome)}</button>`).join('')}${S.viagem.viajantes.length>2?`<button class=\"pchip all ${F.resp.length===S.viagem.viajantes.length?'on':''}\" data-r=\"*\">Todos</button>`:''}</div>\n    ${blocoDivisao()}\n    ${c?`<div class=\"hint\">Padrão para ${esc(c.nome)}: ${esc(nomeRegra(c.regra))}.</div>`:''}\n\n    <div class=\"flabel\">Quem pagou? <span class=\"muted\" style=\"font-weight:400\">· toque em mais de um se cada um pagar a sua parte</span></div>\n    <div class=\"pchips\" id=\"fPor\">${S.viagem.viajantes.map(x=>{ const on = F.pagamentos ? F.pagamentos.some(pg => pg.por === x.id) : F.por === x.id; return `<button class=\"pchip ${on?'on':''}\" data-por=\"${x.id}\">${av(x.id)}${esc(x.nome)}</button>`; }).join('')}</div>\n    ${!F.pagamentos && F.resp.some(id => id !== F.por) ? `<div class=\"hint\">${esc(nomeP(F.por))} pagou a parte dos outros: isso entra no Acerto entre vocês.</div>` : ''}\n\n    ${F.pagamentos ? `<div class=\"flabel\">Dia</div><select class=\"field\" id=\"fDia\">${opDias}</select>${blocoPagamentos()}`\n      : `<div class=\"row2\" style=\"margin-top:4px\"><div><div class=\"flabel\">Dia</div><select class=\"field\" id=\"fDia\">${opDias}</select></div>${blocoPagamentos()}</div>`}\n\n    <div class=\"flabel\">Situação</div>\n    <div class=\"segl\" id=\"fStatus\">${['realizado','apagar','estimado'].concat(F.status==='pago'?['pago']:[]).map(s=>`<button data-s=\"${s}\" class=\"${F.status===s?'on':''}\">${s==='realizado'?'Pago agora':STN[s]}</button>`).join('')}</div>\n\n    ${F._mais ? `\n      <div class=\"flabel\">Valor real na fatura (${v.nativa.simb}) <span class=\"muted\" style=\"font-weight:400\">· opcional</span></div>\n      <input class=\"field num\" id=\"fFatura\" inputmode=\"decimal\" placeholder=\"Substitui o cálculo pela cotação\" value=\"${F.fatura!=null?String(F.fatura).replace('.',','):''}\">\n      <div class=\"flabel\">Foto do recibo <span class=\"muted\" style=\"font-weight:400\">· opcional</span></div>\n      <div class=\"photo\">${F.foto?`<img src=\"${F.foto}\" alt=\"\">`:''}<button class=\"btn ghost sm\" id=\"fFoto\"><svg class=\"i\" style=\"vertical-align:-4px\"><use href=\"#i-cam\"/></svg> ${F.foto?'Trocar foto':'Abrir câmera'}</button>${F.foto?'<button class=\"btn ghost sm\" id=\"fFotoX\">Remover</button>':''}</div>\n      <div class=\"toggle\"><div>Incluir nas despesas<div class=\"hint\" style=\"margin:0\">Desligue para simular um cenário sem este gasto</div></div><button class=\"sw ${F.incluir?'on':''}\" id=\"fIncl\"></button></div>\n    ` : `<button class=\"more\" id=\"fMais\">+ Mais opções (valor da fatura, foto do recibo, simulação)</button>`}\n\n    <button class=\"btn pri\" id=\"fSalvar\">${F.id?'Salvar alterações':'Lançar'}</button>\n    ${F.id?'<button class=\"btn danger\" id=\"fExcluir\">Excluir lançamento</button>':''}`;\n}\nfunction lerCamposForm(){\n  const g = id => document.getElementById(id);\n  if (g('fValor')) F.valor = g('fValor').value;\n  if (g('fDesc')) F.desc = g('fDesc').value;\n  if (g('fObs')) F.obs = g('fObs').value;\n  if (g('fDia')) F.dia = +g('fDia').value;\n  if (g('fFonte')) F.fonte = g('fFonte').value || null;\n  if (g('fFatura')) F.fatura = g('fFatura').value;\n  document.querySelectorAll('[data-parte]').forEach(i => { F.partes[i.dataset.parte] = i.value; });\n  document.querySelectorAll('[data-pgv]').forEach(i => { const pg = F.pagamentos && F.pagamentos.find(x => x.por === i.dataset.pgv); if (pg) { const n = numBR(i.value); pg.valor = isNaN(n) ? '' : n; } });\n  document.querySelectorAll('[data-pgf]').forEach(i => { const pg = F.pagamentos && F.pagamentos.find(x => x.por === i.dataset.pgf); if (pg) pg.fonte = i.value || null; });\n}\nfunction salvarForm(){\n  lerCamposForm();\n  const valor = numBR(String(F.valor));\n  if (!(valor > 0)) return toast('Digite o valor');\n  if (!F.cat) return toast('Escolha a categoria');\n  let partes = null;\n  if (F.partes && F.resp.length > 1) {\n    const soma = somaPartes();\n    if (Math.abs(soma - valor) > 0.005) return toast(soma < valor ? 'Ainda falta distribuir parte do valor' : 'As partes passam do valor total');\n    partes = {}; F.resp.forEach(id => partes[id] = numBR(String(F.partes[id] ?? '')) || 0);\n  }\n  let pagamentos = null;\n  if (F.pagamentos && F.pagamentos.length > 1) {\n    const soma = Math.round(somaPg() * 100) / 100;\n    if (Math.abs(soma - valor) > 0.005) return toast(soma < valor ? 'Os pagamentos ainda não somam o total' : 'Os pagamentos passam do total');\n    pagamentos = F.pagamentos.map(pg => ({ por: pg.por, fonte: pg.fonte || null, valor: numBR(String(pg.valor ?? '')) || 0 }));\n  }\n  const fat = numBR(String(F.fatura??''));\n  const reg = {...F, partes, pagamentos, ...(pagamentos ? { por: pagamentos[0].por, fonte: null } : {}), valor, fatura: fat>0?fat:null, sub: F.sub || cat(F.cat).subs[0] || '', desc: F.desc.trim() || F.sub || cat(F.cat).nome};\n  delete reg._mais; delete reg._pgAuto;\n  if (pagamentos) { S.ultFonte ||= {}; for (const pg of pagamentos) if (pg.fonte) S.ultFonte[pg.por] = pg.fonte; }\n  reg.upd = Date.now(); reg.loc = reg.upd; reg.via = null;\n  if (reg.fonte) { S.ultFonte ||= {}; S.ultFonte[reg.por] = reg.fonte; }\n  if (F.id){ const i = S.lanc.findIndex(x=>x.id===F.id); S.lanc[i] = reg; toast('Lançamento atualizado'); }\n  else { reg.id = S.aparelho + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); S.lanc.push(reg); toast('Lançado'); }\n  save(); fecharSheet(); render();\n}\n\n/* ---------- sheets simples ---------- */\nfunction sheetTexto(titulo, rotulo, cb, extra=''){\n  $('#sheetIn').innerHTML = `<div class=\"grab\"></div><div class=\"shead\"><h2>${titulo}</h2><button class=\"iconbtn\" data-close><svg class=\"i\"><use href=\"#i-x\"/></svg></button></div>\n    <div class=\"flabel\">${rotulo}</div><input class=\"field\" id=\"sTxt\" autocomplete=\"off\">${extra}<button class=\"btn pri\" id=\"sOk\">Salvar</button>`;\n  abrirSheet(); setTimeout(()=>$('#sTxt').focus(),200);\n  $('#sOk').onclick = () => { const t = $('#sTxt').value.trim(); if (!t) return toast('Digite um nome'); cb(t); fecharSheet(); render(); };\n}\nconst CORES = ['#3F6FB0','#6C5BA8','#1D5C5D','#4F6470','#B23A32','#8A6A3D','#C2410C','#B8892A','#2E7D4F','#0E7490','#BE185D','#6B7280'];\nfunction editarCategoria(id){\n  const c = cat(id);\n  $('#sheetIn').innerHTML = `<div class=\"grab\"></div><div class=\"shead\"><h2>${esc(c.nome)}</h2><button class=\"iconbtn\" data-close><svg class=\"i\"><use href=\"#i-x\"/></svg></button></div>\n    <div class=\"flabel\">Nome</div><input class=\"field\" id=\"cNome\" value=\"${esc(c.nome)}\">\n    <div class=\"flabel\">Cor</div><div class=\"colors\" id=\"cCor\">${CORES.map(k=>`<button style=\"background:${k}\" data-cor=\"${k}\" class=\"${c.cor===k?'on':''}\"></button>`).join('')}</div>\n    <div class=\"flabel\">Responsável padrão</div>\n    <select class=\"field\" id=\"cRegra\"><option value=\"eu\" ${(c.regra||'eu')==='eu'?'selected':''}>Quem lança (dono do aparelho)</option><option value=\"todos\" ${c.regra==='todos'?'selected':''}>Dividir entre todos</option>${S.viagem.viajantes.map(v=>`<option value=\"${v.id}\" ${c.regra===v.id?'selected':''}>${esc(v.nome)}</option>`).join('')}</select>\n    <div class=\"flabel\">Orçamento limite (${S.viagem.local.simb}) <span class=\"muted\" style=\"font-weight:400\">· opcional</span></div>\n    <input class=\"field num\" id=\"cOrc\" inputmode=\"decimal\" placeholder=\"Sem limite\" value=\"${S.viagem.orcamento[id]?String(S.viagem.orcamento[id]).replace('.',','):''}\">\n    <div class=\"flabel\">Subcategorias</div><div class=\"chips\" style=\"flex-wrap:wrap;margin:0\">${c.subs.map((s,i)=>`<span class=\"chip\" data-delsub=\"${i}\">${esc(s)} ✕</span>`).join('')}</div>\n    <button class=\"btn pri\" id=\"cOk\">Salvar</button>`;\n  abrirSheet();\n  let cor = c.cor;\n  $('#cCor').onclick = e => { const b = e.target.closest('[data-cor]'); if(!b) return; cor=b.dataset.cor; [...$('#cCor').children].forEach(x=>x.classList.toggle('on',x===b)); };\n  $('#sheetIn').querySelectorAll('[data-delsub]').forEach(b => b.onclick = () => { c.subs.splice(+b.dataset.delsub,1); save(); editarCategoria(id); });\n  $('#cOk').onclick = () => { c.nome = $('#cNome').value.trim() || c.nome; c.cor = cor; c.regra = $('#cRegra').value;\n    const o = numBR($('#cOrc').value); if (o>0) S.viagem.orcamento[id]=o; else delete S.viagem.orcamento[id];\n    save(); fecharSheet(); render(); };\n}\n\nfunction removerViajante(id){\n  const v = trav(id); if (!v || S.viagem.viajantes.length < 2) return;\n  const outros = S.viagem.viajantes.filter(x => x.id !== id);\n  const usados = S.lanc.filter(l => pagtos(l).some(pg => pg.por === id) || l.resp.includes(id)).length;\n  $('#sheetIn').innerHTML = `<div class=\"grab\"></div><div class=\"shead\"><h2>Remover ${esc(v.nome)}</h2><button class=\"iconbtn\" data-close><svg class=\"i\"><use href=\"#i-x\"/></svg></button></div>\n    ${usados ? `<p class=\"sub\">${esc(v.nome)} aparece em <b>${usados}</b> lançamento(s). Nos gastos divididos, a parte de ${esc(v.nome)} passa para os demais. Os gastos só de ${esc(v.nome)} ficam com:</p>\n      <select class=\"field\" id=\"rmPara\">${outros.map(o=>`<option value=\"${o.id}\">${esc(o.nome)}</option>`).join('')}</select>`\n      : `<p class=\"sub\">${esc(v.nome)} não tem lançamentos. Pode remover sem perder nada.</p>`}\n    <button class=\"btn danger\" id=\"rmOk\" style=\"margin-top:18px\">Remover do planejamento</button>`;\n  abrirSheet();\n  $('#rmOk').onclick = () => {\n    const para = usados ? $('#rmPara').value : outros[0].id;\n    for (const l of S.lanc){\n      if (l.por === id) { l.por = para; l.fonte = null; }\n      if (l.pagamentos) {\n        for (const pg of l.pagamentos) if (pg.por === id) { pg.por = para; pg.fonte = null; }\n        const junto = {}; for (const pg of l.pagamentos) { if (junto[pg.por]) junto[pg.por].valor = (+junto[pg.por].valor) + (+pg.valor); else junto[pg.por] = {...pg}; }\n        l.pagamentos = Object.values(junto); if (l.pagamentos.length < 2) { l.fonte = l.pagamentos[0].fonte; l.pagamentos = null; }\n      }\n      if (l.partes && l.partes[id] !== undefined) { const x = l.partes[id]; delete l.partes[id]; if (!l.resp.includes(para)) l.resp.push(para); l.partes[para] = (l.partes[para] || 0) + x; }\n      if (l.resp.includes(id)) { l.resp = l.resp.filter(x => x !== id); if (!l.resp.length) l.resp = [para]; }\n      if (l.partes && l.resp.length < 2) l.partes = null;\n      l.upd = l.loc = Date.now(); l.via = null;\n    }\n    for (const c of S.categorias) if (c.regra === id) c.regra = 'eu';\n    S.viagem.viajantes = outros;\n    if (S.aparelho === id) S.aparelho = outros[0].id;\n    if (UI.pessoa === id) UI.pessoa = 't';\n    save(); fecharSheet(); render(); toast(v.nome + ' removido');\n  };\n}\nfunction abrirSheet(){ $('#scrim').classList.add('on'); $('#sheet').classList.add('on'); }\nfunction fecharSheet(){ pararSync(); $('#scrim').classList.remove('on'); $('#sheet').classList.remove('on'); }\n\n/* ---------- render e eventos ---------- */\nfunction render(){\n  const t = {painel:telaPainel, lista:telaLista, categorias:telaCategorias, ajustes:telaAjustes}[UI.tab];\n  $('#app').innerHTML = t();\n  document.querySelectorAll('.nav [data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab===UI.tab));\n  const busca = $('#busca'); if (busca) busca.oninput = e => { UI.busca = e.target.value; const pos=e.target.selectionStart; render(); const nb=$('#busca'); nb.focus(); nb.setSelectionRange(pos,pos); };\n}\nfunction irPara(tab){ UI.tab = tab; render(); window.scrollTo(0,0); }\n\n/* ---------- Clé: ponte com o app e o Marco (só neste módulo; o app financeiro original não tem isto) ----------\n   O Marco lança e desfaz lançamentos por aqui; tudo continua editável à mão na própria Carteira. */\nwindow.CLE = {\n  pronto(){ return !!(S && S.viagem && S.aparelho); },\n  viajantes(){ return S ? S.viagem.viajantes.map(v => ({ id:v.id, nome:v.nome })) : []; },\n  moedaLocal(){ return S ? S.viagem.local : null; },\n  lancar(dados){\n    if (!this.pronto()) return null;\n    const reg = { desc:'', cat:'out', sub:'', valor:0, moeda:S.viagem.local.cod, dia:Math.min(S.viagem.dias, diaAtual()), status:'realizado', obs:'',\n      resp:[S.aparelho], partes:null, pagamentos:null, por:S.aparelho, fonte:fontePadrao(S.aparelho), fatura:null, incluir:true, foto:null, ...dados };\n    if (!('fonte' in dados) && dados.por) reg.fonte = fontePadrao(dados.por); // pago por outro viajante: fonte padrão de quem pagou\n    reg.sub = reg.sub || cat(reg.cat).subs[0] || '';\n    reg.upd = Date.now(); reg.loc = reg.upd; reg.via = null;\n    reg.id = S.aparelho + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);\n    S.lanc.push(reg); save(); render(); return reg.id;\n  },\n  desfazer(id){\n    if (!S || !S.l
