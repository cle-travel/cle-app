=\"all:unset;font-weight:700\">Escolher o arquivo</b>. Abre a lista de arquivos do celular.</span></div>\n    <div class=\"passo\"><b>2</b><span>Veio pelo <b style=\"all:unset;font-weight:700\">Quick Share</b>: procure em <b style=\"all:unset;font-weight:700\">Recentes</b> ou na pasta <b style=\"all:unset;font-weight:700\">Download › Quick Share</b>.</span></div>\n    <div class=\"passo\"><b>3</b><span>Veio pelo <b style=\"all:unset;font-weight:700\">WhatsApp</b>: antes, toque no arquivo na conversa para baixar; depois procure em <b style=\"all:unset;font-weight:700\">Recentes</b>.</span></div>\n    <div class=\"passo\"><b>4</b><span>Toque no PDF. O app junta os dados e mostra o que mudou; os lançamentos repetidos não duplicam.</span></div>\n    <button class=\"btn pri\" id=\"jEscolher\">Escolher o arquivo</button>`;\n  abrirSheet();\n  $('#jEscolher').onclick = () => { MODO_IMP = 'juntar'; $('#imp').click(); };\n}\n$('#scrim').onclick = fecharComAviso;\n\n/* ============ Sincronização por QR Code ============\n   Protocolo (dois celulares, sem rede):\n   1) HOST mostra o pacote P1 (o que mudou aqui desde a última confirmação do outro).\n   2) CLIENT lê P1, junta, e mostra P2 (o que mudou lá desde a confirmação que veio em P1).\n   3) HOST lê P2 e junta. Cada pacote leva \"ack\": até que hora (do relógio do outro) já foi recebido,\n      assim cada lado sabe o que o outro já tem e envia só o que falta.\n   ================================================== */\nconst SYNC = { timer:null, stream:null, loop:null, lock:null, meio:null };\n// fechar no meio da sincronização: avisa o que fica faltando (meio = 'host' | 'client' | 'ajuste')\nconst AVISO_MEIO = {\n  host: 'A sincronização ficou pela metade: falta ler a resposta do outro celular, e as mudanças dele não chegam aqui. Sair mesmo assim?',\n  client: 'O outro celular ainda precisa ler este código; sem isso, as mudanças deste celular não chegam lá. Sair mesmo assim?',\n  ajuste: 'Os dois celulares ainda estão diferentes. Sair sem fazer o ajuste?'\n};\nfunction fecharComAviso(){\n  if (SYNC.meio && $('#sheet').classList.contains('on') && !confirm(AVISO_MEIO[SYNC.meio])) return;\n  SYNC.meio = null; fecharSheet();\n}\nfunction meuDisp(){\n  try { let d = localStorage.getItem('finviagem-disp'); if (!d) { d = 'd' + Math.random().toString(36).slice(2, 10); localStorage.setItem('finviagem-disp', d); } return d; }\n  catch(e){ S.local.disp ||= 'd' + Math.random().toString(36).slice(2, 10); return S.local.disp; }\n}\n// chaves curtas no QR (o pacote fica bem menor); expandir() desfaz\nconst CHAVE = {id:'i',desc:'d',cat:'c',sub:'s',valor:'v',moeda:'m',dia:'y',status:'t',resp:'r',partes:'q',pagamentos:'g',por:'p',fonte:'f',fatura:'x',incluir:'n',obs:'o',upd:'u'};\nconst CHAVE_INV = Object.fromEntries(Object.entries(CHAVE).map(([a, b]) => [b, a]));\nconst ST_C = {estimado:'E', apagar:'A', pago:'P', realizado:'R'}, ST_INV = {E:'estimado', A:'apagar', P:'pago', R:'realizado'};\nfunction compactar(l){\n  const o = {};\n  for (const [k, v] of Object.entries(l)) {\n    if (k === 'foto' || k === 'loc' || k === 'via' || v === null || v === '' || v === undefined) continue;\n    if (k === 'incluir' && v === true) continue;\n    if (k === 'moeda' && v === S.viagem.local.cod) continue;\n    let x = v;\n    if (k === 'status') x = ST_C[v] || v;\n    if (k === 'pagamentos') x = v.map(pg => [pg.por, pg.fonte || 0, pg.valor]);\n    o[CHAVE[k] || k] = x;\n  }\n  return o;\n}\nfunction expandir(o){\n  const l = {};\n  for (const [k, v] of Object.entries(o)) {\n    const kk = CHAVE_INV[k] || k; let x = v;\n    if (kk === 'status') x = ST_INV[v] || v;\n    if (kk === 'pagamentos') x = v.map(a => ({ por: a[0], fonte: a[1] || null, valor: a[2] }));\n    l[kk] = x;\n  }\n  l.moeda ??= S.viagem.local.cod; l.incluir ??= true;\n  return l;\n}\nfunction enxugar(l){ const o = {}; for (const [k, v] of Object.entries(l)) { if (k === 'foto' || k === 'loc' || k === 'via') continue; if (v === null || v === '' || v === ata(texto, /^[0-9A-Z $%*+\\-./:]*$/.test(texto) ? 'Alphanumeric' : 'Byte'); qr.make();\n  const n = qr.getModuleCount(), borda = 4;\n  const alvo = Math.min(380, (document.getElementById('sheetIn')?.clientWidth || 360) - 56);\n  const px = Math.max(3, Math.floor(alvo / (n + borda * 2)));\n  canvas.width = canvas.height = (n + borda * 2) * px;\n  const g = canvas.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, canvas.width, canvas.height); g.fillStyle = '#000';\n  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) g.fillRect((c + borda) * px, (r + borda) * px, px, px);\n}\nasync function manterTelaAcesa(){ try { if ('wakeLock' in navigator && !SYNC.lock) SYNC.lock = await navigator.wakeLock.request('screen'); } catch(e){} }\nfunction pararSync(){\n  clearInterval(SYNC.timer); SYNC.timer = null; cancelAnimationFrame(SYNC.loop); SYNC.loop = null;\n  if (SYNC.stream) { SYNC.stream.getTracks().forEach(t => t.stop()); SYNC.stream = null; }\n  if (SYNC.lock) { SYNC.lock.release().catch(() => {}); SYNC.lock = null; }\n}\nfunction resumo(r){ return r.novos + r.atualizados + r.removidos ? `${r.novos} novo(s) · ${r.atualizados} atualizado(s) · ${r.removidos} removido(s)` : 'nenhuma mudança nova'; }\nconst PARTES_GRANDE = 8; // acima disso, sugere enviar por arquivo\n\nfunction abrirSync(){\n  pararSync(); SYNC.meio = null;\n  $('#sheetIn').innerHTML = `<div class=\"grab\"></div><div class=\"shead\"><h2>Sincronizar celulares</h2><button class=\"iconbtn\" data-close><svg class=\"i\"><use href=\"#i-x\"/></svg></button></div>\n    <p class=\"sub\" style=\"margin:0 0 6px\">Os dois celulares lado a lado, com o app aberto. Não precisa de internet.</p>\n    <div class=\"passo\"><b>1</b><span>Neste celular, toque em <b style=\"all:unset;font-weight:700\">Começar</b>. Ele mostra um QR Code.</span></div>\n    <div class=\"passo\"><b>2</b><span>No outro, toque em <b style=\"all:unset;font-weight:700\">Ler o código do outro</b> e aponte a câmera, a uns 20 cm.</span></div>\n    <div class=\"passo\"><b>3</b><span>O outro celular mostra o código dele. Aqui, toque em <b style=\"all:unset;font-weight:700\">Ler a resposta</b>. Quem começa também termina; não precisa inverter.</span></div>\n    <button class=\"btn pri\" id=\"syHost\">Começar (mostrar meu código)</button>\n    <button class=\"btn ghost\" id=\"syCli\" style=\"margin-top:8px\">Ler o código do outro</button>\n    <div class=\"hint\" style=\"margin-top:12px\">Muita coisa mudou desde a última vez (ex.: a primeira sincronização)? Envie por arquivo e, no outro celular, toque em <b>Juntar arquivo recebido</b> aqui nesta tela.</div>\n    <button class=\"btn ghost\" id=\"compArq\" style=\"margin-top:8px\">Enviar (Quick Share / WhatsApp)</button>\n    <button class=\"btn ghost\" id=\"impBtn\" style=\"margin-top:8px\"><svg class=\"i\" style=\"vertical-align:-4px\"><use href=\"#i-down\"/></svg> Juntar arquivo recebido (PDF)</button>`;\n  abrirSheet();\n  $('#syHost').onclick = async () => mostrarCodigo(await codificar(montarPacote(null)), 'host');\n  $('#syCli').onclick = () => lerCodigo(async P => {\n    const r = aplicarPacote(P);\n    // código de ajuste: responde com os mesmos grupos por inteiro (o que só este celular tiver também volta)\n    mostrarCodigo(await codificar(montarPacote(P.de, P.aj)), 'client', r, P.nome);\n  });\n}\n// host leu a resposta: confere se os dois ficaram iguais; se não, oferece o código de ajuste (só os grupos diferentes)\nasync function concluirSync(P, tentativa){\n  const r2 = aplicarPacote(P);\n  const dif = gruposDiferentes(P.rg), nome = esc(P.nome || 'o outro celular');\n  SYNC.meio = dif.length ? 'ajuste' : null;\n  if (!dif.length) {\n    $('#sheetIn').innerHTML = `<div class=\"grab\"></div><div class=\"ok-grande\"><div class=\"ico\">✓</div><h2 style=\"margin:0 0 4px\">Sincronizado com ${nome}</h2><p class=\"sub\">${resumo(r2)}${P.rg ? '<br>Conferido: os dois celulares estão iguais.' : ''}</p></div><button class=\"btn pri\" data-close>Concluir</button>`;\n    return;\n  }\n  const partes = await codificar(montarPacote(P.de, dif));\n  $('#sheetIn').innerHTML = `<div class=\"grab\"></div><div class=\"shead\"><h2>Falta um ajuste</h2><button class=\"iconbtn\" data-close><svg class=\"i\"><use href=\"#i-x\"/></svg></button></div>\n    <p class=\"sub\" style=\"margin:0 0 10px\">Recebido: ${resumo(r2)}. Na conferência final, alguns lançamentos ainda estão diferentes entre os dois celulares.\n    ${tentativa > 1 ? 'O ajuste pelo QR não resolveu; envie o arquivo completo (Quick Share ou WhatsApp) e, no outro celular, use <b>Juntar arquivo</b>.' : `Mostre o código de ajuste para ${nome} ler (${partes.length} parte${partes.length > 1 ? 's' : ''}); depois leia a resposta dele aqui.`}</p>\n    ${tentativa > 1 ? '<button class=\"btn pri\" id=\"compArq\">Enviar arquivo completo</button>' : '<button class=\"btn pri\" id=\"syAjuste\">Mostrar código de ajuste</button>'}`;\n  if ($('#syAjuste')) $('#syAjuste').onclick = () => mostrarCodigo(partes, 'host', null, null, tentativa + 1);\n}\nfunction mostrarCodigo(partes, papel, r, nomeOutro, tentativa = 1){\n  pararSync(); manterTelaAcesa();\n  const host = papel === 'host', varias = partes.length > 1;\n  SYNC.meio = papel;\n  $('#sheetIn').innerHTML = `<div class=\"grab\"></div><div class=\"shead\"><h2>${host ? 'Mostre ao outro celular' : 'Recebido de ' + esc(nomeOutro || 'outro celular')}</h2><button class=\"iconbtn\" data-close><svg class=\"i\"><use href=\"#i-x\"/></svg></button></div>\n    ${host ? '' : `<p class=\"sub\" style=\"margin:0\">✓ ${resumo(r)}.</p><div class=\"aviso-grande\"><b>Falta 1 passo:</b> no outro celular, toque em <b>Ler a resposta do outro celular</b> e aponte para este código. Só assim as mudanças deste celular chegam lá.</div>`}\n    ${partes.length > PARTES_GRANDE ? `<div class=\"aviso-grande\">Sincronização grande: <b>${partes.length} partes</b> (normal quando muita coisa mudou). Pelo QR leva alguns minutos; <b>mais rápido: enviar por arquivo</b>. <button class=\"btn ghost sm\" id=\"compArq\" style=\"margin-top:8px;width:100%\">Enviar por Quick Share / WhatsApp</button></div>` : ''}\n    <div class=\"qrbox\"><canvas id=\"qrc\"></canvas></div>\n    <div class=\"qrinfo\" id=\"qri\"></div>\n    ${varias ? '<div class=\"qrctl\"><button id=\"qAnt\" aria-label=\"Parte anterior\">◀</button><button id=\"qPausa\">Pausar</button><button id=\"qProx\" aria-label=\"Próxima parte\">▶</button></div>' : ''}\n    ${host ? '<button class=\"btn pri\" id=\"syLerResp\">Ler a resposta do outro celular</button>' : '<button class=\"btn pri\" id=\"syCliOk\">Pronto, o outro já leu</button>'}`;\n  const cv = $('#qrc'); let i = 0, pausado = false;\n  const mostra = () => { desenharQR(cv, partes[i]); $('#qri').textContent = varias ? `Parte ${i + 1} de ${partes.length}${pausado ? ' · pausado' : ''}` : 'Aponte a câmera do outro celular para este código'; };\n  const avanca = d => { i = (i + d + partes.length) % partes.length; mostra(); };\n  mostra();\n  if (varias) {\n    SYNC.timer = setInterval(() => { if (!pausado) avanca(1); }, 1500);\n    $('#qAnt').onclick = () => { pausado = true; $('#qPausa').textContent = 'Continuar'; avanca(-1); };\n    $('#qProx').onclick = () => { pausado = true; $('#qPausa').textContent = 'Continuar'; avanca(1); };\n    $('#qPausa').onclick = () => { pausado = !pausado; $('#qPausa').textContent = pausado ? 'Continuar' : 'Pausar'; mostra(); };\n  }\n  if (host) $('#syLerResp').onclick = () => lerCodigo(P => concluirSync(P, tentativa));\n  else $('#syCliOk').onclick = () => { SYNC.meio = null; fecharSheet(); };\n}\nasync function carregarJsQR(){\n  if (window.jsQR) return window.jsQR;\n  await new Promise((ok, erro) => { const sc = document.createElement('script'); sc.src = 'lib/jsQR.js'; sc.onload = ok; sc.onerror = erro; document.head.appendChild(sc); });\n  return window.jsQR;\n}\nasync function lerCodigo(aoTerminar){\n  pararSync(); manterTelaAcesa();\n  $('#sheetIn').innerHTML = `<div class=\"grab\"></div><div class=\"shead\"><h2>Aponte para o código</h2><button class=\"iconbtn\" data-close><svg class=\"i\"><use href=\"#i-x\"/></svg></button></div>\n    <div class=\"cam\"><video id=\"vid\" playsinline muted></video><div class=\"mira\"></div></div>\n    <div class=\"qrinfo\" id=\"lst\">Abrindo a câmera…</div><div class=\"progresso\"><i id=\"lpr\"></i></div><div class=\"pontos\" id=\"lpt\"></div>\n    <div class=\"hint\" style=\"text-align:center\">Segure a uns 20 cm. Se faltar alguma parte, use ◀ ▶ no outro celular para mostrá-la.</div>`;\n  abrirSheet();\n  const info = t => { const e = $('#lst'); if (e) e.textContent = t; };\n  try { SYNC.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false }); }\n  catch(e){ info('Não foi possível abrir a câmera. Permita o acesso à câmera para o app e tente de novo.'); return; }\n  // foco contínuo quando o aparelho permite\n  try { const tr = SYNC.stream.getVideoTracks()[0], cap = tr.getCapabilities ? tr.getCapabilities() : {}; if (cap.focusMode && cap.focusMode.includes('continuous')) await tr.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }); } catch(e){}\n  const vid = $('#vid'); vid.srcObject = SYNC.stream; await vid.play().catch(() => {});\n  let detector = null, jsqr = null;\n  if ('BarcodeDetector' in window) { try { if ((await BarcodeDetector.getSupportedFormats()).includes('qr_code')) detector = new BarcodeDetector({ formats: ['qr_code'] }); } catch(e){} }\n  if (!detector) { try { jsqr = await carregarJsQR(); } catch(e){ info('Leitor de QR indisponível neste aparelho.'); return; } }\n  const tela = document.createElement('canvas'), ctx = tela.getContext('2d', { willReadFrequently: true });\n  let sid = null, total = 0, versao = 2; const partes = {};\n  info('Procurando o código…');\n  const desenharPontos = ultima => { const el = $('#lpt'); if (!el || total < 2) return; el.innerHTML = Array.from({length: total}, (_, k) => `<i class=\"${partes[k + 1] ? 'ok' : ''}${ultima === k + 1 ? ' at' : ''}\"></i>`).join(''); };\n  const tratar = async texto => {\n    let m = /^FV2:([0-9A-Z]{4}):(\\d+):(\\d+):([\\s\\S]*)$/.exec(texto || ''), v = 2;\n    if (!m) { m = /^FV1\\|(\\w+)\\|(\\d+)\\|(\\d+)\\|([\\s\\S]*)$/.exec(texto || ''); v = 1; }\n    if (!m) return false;\n    if (sid !== m[1]) { sid = m[1]; total = +m[3]; versao = v; for (const k in partes) delete partes[k]; }\n    partes[+m[2]] = m[4];\n    const n = Object.keys(partes).length;\n    const faltam = Array.from({length: total}, (_, k) => k + 1).filter(k => !partes[k]);\n    info(total > 1 ? (faltam.length ? `Recebidas ${n} de ${total}${faltam.length <= 6 ? ' · faltam: ' + faltam.join(', ') : ''}` : 'Todas as partes recebidas!') : 'Lido!');\n    const pr = $('#lpr'); if (pr) pr.style.width = (n / total * 100) + '%';\n    desenharPontos(+m[2]);\n    if (n < total) return false;\n    pararSync();\n    try { const P = await decodificar(Array.from({length: total}, (_, k) => partes[k + 1]), versao); await aoTerminar(P); }\n    catch(e){ info(e.message || 'Código inválido'); toast(e.message || 'Código inválido'); }\n    return true;\n  };\n  let ocupado = false;\n  const rodar = async () => {\n    if (!SYNC.stream) return;\n    if (!ocupado && vid.readyState >= 2) {\n      ocupado = true;\n      try {\n        if (detector) { const cods = await detector.detect(vid); for (const c of cods) if (await tratar(c.rawValue)) return; }\n        else { tela.width = vid.videoWidth; tela.height = vid.videoHeight; ctx.drawImage(vid, 0, 0); const img = ctx.getImageData(0, 0, tela.width, tela.height);\n          const c = jsqr(img.data, img.width, img.height, { inversionAttempts: 'dontInvert' }); if (c && await tratar(c.data)) return; }\n      } catch(e){}\n      ocupado = false;\n    }\n    SYNC.loop = requestAnimationFrame(rodar);\n  };\n  rodar();\n}\n\nfunction telaBoasVindas(){\n  document.querySelector('.nav').style.display = 'none';\n  $('#app').innerHTML = `<div class=\"welcome\">\n    <div class=\"logo\"><svg class=\"i\"><use href=\"#i-wallet\"/></svg></div>\n    <h1>Carteira</h1>\n    <p>Controle de gastos da viagem, em duas moedas, funcionando sem internet. Os dados ficam só neste celular.</p>\n    <button class=\"btn pri\" id=\"wAbrir\">Abrir arquivo da viagem</button>\n    <button class=\"btn ghost\" id=\"wNova\">Criar uma viagem nova</button>\n    <div class=\"hint\" style=\"margin-top:16px\">O arquivo da viagem (.json) vem de quem organizou a viagem ou da exportação de outro celular.</div>\n  </div>`;\n  $('#wAbrir').onclick = () => { MODO_IMP = 'abrir'; $('#imp').click(); };\n  $('#wNova').onclick = formNovaViagem;\n}\nfunction formNovaViagem(){\n  const hojeISO = new Date().toISOString().slice(0,10);\n  $('#sheetIn').innerHTML = `<div class=\"grab\"></div><div class=\"shead\"><h2>Nova viagem</h2><button class=\"iconbtn\" data-close><svg class=\"i\"><use href=\"#i-x\"/></svg></button></div>\n    <div class=\"flabel\">Nome da viagem</div><input class=\"field\" id=\"nNome\" placeholder=\"Ex.: Férias no Chile\">\n    <div class=\"row2\"><div><div class=\"flabel\">Primeiro dia</div><input class=\"field\" type=\"date\" id=\"nIni\" value=\"${hojeISO}\"></div>\n      <div><div class=\"flabel\">Número de dias</div><input class=\"field num\" inputmode=\"numeric\" id=\"nDias\" value=\"10\"></div></div>\n    <div class=\"flabel\">Seu nome</div><input class=\"field\" id=\"nEu\" placeholder=\"Ex.: Ana\">\n    <div class=\"row2\"><div><div class=\"flabel\">Moeda do destino</div><div style=\"display:flex;gap:6px\"><input class=\"field\" id=\"nLc\" value=\"USD\"><input class=\"field\" id=\"nLs\" value=\"US$\"></div></div>\n      <div><div class=\"flabel\">Sua moeda</div><div style=\"display:flex;gap:6px\"><input class=\"field\" id=\"nNc\" value=\"BRL\"><input class=\"field\" id=\"nNs\" value=\"R$\"></div></div></div>\n    <div class=\"flabel\">Cotação (1 moeda do destino = ? sua moeda)</div><input class=\"field num\" inputmode=\"decimal\" id=\"nCot\" value=\"5,18\">\n    <button class=\"btn pri\" id=\"nOk\">Criar viagem</button>`;\n  abrirSheet();\n  $('#nOk').onclick = () => {\n    const g = id => $('#' + id).value.trim();\n    const cfg = { nome:g('nNome'), inicio:g('nIni'), dias:parseInt(g('nDias'),10), seuNome:g('nEu'), localCod:g('nLc'), localSimb:g('nLs'), nativaCod:g('nNc'), nativaSimb:g('nNs'), cotacao:numBR(g('nCot')) };\n    if (!cfg.nome || !cfg.inicio || !(cfg.dias > 0) || !cfg.seuNome || !(cfg.cotacao > 0)) return toast('Preencha todos os campos');\n    S = novaViagem(cfg); S.aparelho = S.viagem.viajantes[0].id; save(); fecharSheet(); iniciar(); toast('Viagem criada');\n  };\n}\nfunction avisarVersaoNova(){\n  if (document.querySelector('.atualizar')) return;\n  const b = document.createElement('div'); b.className = 'atualizar';\n  b.innerHTML = '<span>Nova versão do app disponível. Seus dados continuam como estão.</span><button>Atualizar</button>';\n  b.querySelector('button').onclick = () => location.reload();\n  document.body.appendChild(b);\n}\nfunction iniciar(){ document.querySelector('.nav').style.display = ''; render(); }\n\n(async () => {\n  const d = await DB.ler();\n  if (d && d.viagem) { S = normalizar(d); iniciar(); if (!S.aparelho && !window.CLE_APP) perguntarDono(); }\n  else telaBoasVindas();\n  window.CLE_INICIADO = true; // Clé: o app só conversa com a Carteira depois da leitura inicial\n  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});\n  if ('serviceWorker' in navigator && location.protocol !== 'file:' && !window.CLE_APP) { // Clé: dentro do app, quem cuida do offline é o app\n    // quando uma versão nova assume o controle, oferece atualizar (sem recarregar sozinho no meio de um lançamento)\n    const jaTinha = !!navigator.serviceWorker.controller;\n    navigator.serviceWorker.addEventListener('controllerchange', () => { if (jaTinha) avisarVersaoNova(); });\n    navigator.serviceWorker.register('sw.js').then(r => r.update()).catch(() => {});\n    // ao voltar para o app (ele fica aberto em segundo plano no celular), procura versão nova de novo\n    document.addEventListener('visibilitychange', () => { if (!document.hidden) navigator.serviceWorker.getRegistration().then(r => r && r.update()).catch(() => {}); });\n  }\n})();\n<\/script>\n</body>\n</html>\n";
function abrirCarteira() {
  const box = $("#walletBox");
  box.innerHTML = `<div class="top" style="min-height:44px;padding:8px 10px 4px"><button class="iconbtn" data-a="sairCarteira" aria-label="Voltar">${ic("back")}</button><div class="ttl"><b style="font-size:15px">Carteira</b><span id="walletSub"></span></div><span id="walletCC">${botaoCC()}</span></div>`;
  const f = document.createElement("iframe");
  f.id = "wallet"; f.title = "Carteira";
  box.appendChild(f);
  f.srcdoc = CARTEIRA_HTML.replace(/<head>/i, '<head><base href="' + new URL("carteira/", location.href).href + '"><script>window.CLE_APP=true<\/script>');
}
const cle = () => { try { const w = $("#wallet") && $("#wallet").contentWindow; return w && w.CLE && w.CLE.pronto() ? w.CLE : null; } catch (e) { return null; } };

// ---------- cofre: documentos no aparelho (IndexedDB), abrem sem internet ----------
function cofreDb() { return new Promise((ok, falha) => { const r = indexedDB.open("cle-cofre", 1); r.onupgradeneeded = () => r.result.createObjectStore("docs", { keyPath: "id" }); r.onsuccess = () => ok(r.result); r.onerror = () => falha(r.error); }); }
async function cofreOp(modo, fn) { const db = await cofreDb(); return new Promise((ok, falha) => { const tx = db.transaction("docs", modo), r = fn(tx.objectStore("docs")); tx.oncomplete = () => ok(r && r.result); tx.onerror = () => falha(tx.error); }); }
async function cofreAtualizar() { try { const l = await cofreOp("readonly", (st) => st.getAll()); S.cofreDocs = (l || []).map(({ blob, ...x }) => x).sort((a, b) => (a.quando < b.quando ? 1 : -1)); } catch (e) { S.cofreDocs = []; } }
async function cofreGuardar(file, cat) { const id = novoId(); await cofreOp("readwrite", (st) => st.put({ id, nome: file.name, tipo: file.type, tam: file.size, cat, quando: new Date().toISOString(), blob: file })); await cofreAtualizar(); return id; }
function sheetComprovante() {

    <label class="btn" for="arquivo" style="cursor:pointer">${ic("upload", 18)} Escolher arquivo</label><button class="btn ghost" data-a="fechar">Cancelar</button>`
    : `<div style="font-size:20px;font-weight:600">Guardando ${esc(c.nome)}…</div><div class="progress"><i style="width:65%"></i></div>`;

}
const LIDOS = ["application/pdf", "image/jpeg", "image/png", "image/gif", "image/webp"];
async function receberComprovante(file) {
  const c = S.comp || { cat: "Outros" }; c.etapa = 1; c.nome = file.name; render();
  try { await cofreGuardar(file, c.cat || "Outros"); } catch (e) { S.overlay = null; toast("Não foi possível guardar o arquivo neste aparelho."); render(); return; }
  S.overlay = null;
  if (!marcoDisponivel()) { toast("Guardado no Cofre. A leitura automática entra quando o Marco estiver ligado."); render(); return; }
  if (!LIDOS.includes(file.type) || file.size > 20 * 1024 * 1024) { toast("Guardado no Cofre. O Marco lê PDF e fotos (JPG, PNG) de até 20 MB."); render(); return; }
  const envio = file.type === "application/pdf" ? file : await reduzirImagem(file); // o Cofre guarda o original
  const dados = await new Promise((ok) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(",")[1]); r.readAsDataURL(envio); });
  const bloco = file.type === "application/pdf" ? { type: "document", source: { type: "base64", media_type: "application/pdf", data: dados } } : { type: "image", source: { type: "base64", media_type: envio.type, data: dados } };
  S.hist = []; S.tela = "conversa";
  await enviarTexto(`Leia este comprovante (${c.cat}: ${file.name}) e proponha o que registrar.${c.id ? ` Ele corresponde à tarefa de id ${c.id} do checklist.` : ""}`, { anexo: { bloco, nome: file.name }, modo: "comprovante" });
}

const MEM = "cle-viagem";
// Rascunho da Nova viagem: tudo o que foi falado, a ficha e a última fala do Marco ficam no aparelho a cada toque.
// Fechou o app no meio? Ao reabrir, continua de onde parou, sem repetir a conversa (nem gastar tokens de novo).
const RASCUNHO = "cle-onb-rascunho";
function rascunhoSalvar() {
  const o = S.onb; if (!o || S.viagem) return;
  const { lendo, intro, dicaAte, retomar, ...resto } = o;
  if (!o.f.fala.trim() && !o.conversou && !["destino", "inicio", "dias", "outros"].some((k) => String(o.f[k] || "").trim())) return; // nada para guardar ainda
  try { localStorage.setItem(RASCUNHO, JSON.stringify({ onb: resto, quando: Date.now() })); } catch (e) {}
}
function rascunhoLer() { try { const r = JSON.parse(localStorage.getItem(RASCUNHO) || "null"); return r && r.onb && r.onb.f ? r : null; } catch (e) { return null; } }
function rascunhoApagar() { try { localStorage.removeItem(RASCUNHO); } catch (e) {} }
function memSalvar() {
  rascunhoSalvar();
  if (!S.viagem) return;
  try { localStorage.setItem(MEM, JSON.stringify({ viagem: S.viagem, estado: estadoApp(), roteiro: { dias: DIAS } })); } catch (e) {}
}
function memLer() { try { return JSON.parse(localStorage.getItem(MEM) || "null"); } catch (e) { return null; } }
function memApagar() { try { localStorage.removeItem(MEM); } catch (e) {} }
const chatSalvo = () => (S.chat || []).map(({ vivo, status, retry, visto, ...m }) => ({ ...m, cards: m.cards && m.cards.map(({ visto: _, ...k }) => k) }));
const estadoApp = () => ({ fase: S.fase, faseManual: S.faseManual, diaHoje: S.diaHoje, confirmados: S.confirmados, tarefas: S.tarefas, extras: S.extras, chat: chatSalvo(), fios: S.fios, notas: S.notas, historico: S.historico, lancId: S.lancId || null, listas: S.listas || null, guiaAceito: S.guiaAceito, clima: S.clima });
function aplicarEstado(e) {
  Object.assign(S, { fase: "planejamento", faseManual: false, diaHoje: 1, confirmados: {}, tarefas: {}, extras: {}, chat: null, fios: null, notas: [], historico: [], lancId: null, listas: null, guiaAceito: false, clima: {} });
  if (!e) return;
  Object.assign(S, { fase: e.fase || "planejamento", faseManual: !!e.faseManual, diaHoje: e.diaHoje || 1, confirmados: e.confirmados || {}, tarefas: e.tarefas || {}, extras: e.extras || {}, chat: e.chat && e.chat.length ? e.chat : null, fios: e.fios || null, notas: e.notas || [], historico: e.historico || [], lancId: e.lancId || null, listas: e.listas || null, guiaAceito: !!e.guiaAceito, clima: e.clima || {} });
  garantirFios();
  // conversa interrompida no meio (app fechado com cartões pendentes e sem o balão salvo): a próxima mensagem
  // daquela conversa precisa começar com os resultados, senão a API recusa
  for (const [k, f] of Object.entries(S.fios)) {
    const ult = f.msgs[f.msgs.length - 1];
    if (!ult || ult.role !== "assistant" || !Array.isArray(ult.content) || !ult.content.some((b) => b.type === "tool_use")) continue;
    if ((S.chat || []).some((x) => x.fio === k && x.toolUses && !x.respondido)) continue;
    S.chat = S.chat || [];
    S.chat.push({ de: "m", txt: "", fio: k, toolUses: ult.content.filter((b) => b.type === "tool_use").map((b) => b.id), servidor: {}, cards: [] });
  }
}
// configuração da Carteira a partir da viagem (preenchida na criação; o usuário não redigita)
const cfgCarteira = (v) => ({ nome: v.nome, inicio: v.inicio, dias: v.dias, seuNome: v.viajantes[0], localCod: (v.moeda && v.moeda.cod) || "USD", localSimb: (v.moeda && v.moeda.simb) || "US$", nativaCod: "BRL", nativaSimb: "R$", cotacao: v.cotacao || 5.5 });
// espera a Carteira terminar a leitura inicial antes de conversar com ela
function carteiraPronta() {
  return new Promise((ok) => {
    let n = 0; const t = setInterval(() => {
      let w = null; try { w = $("#wallet") && $("#wallet").contentWindow; } catch (e) {}
      if ((w && w.CLE_INICIADO && w.CLE) || ++n > 100) { clearInterval(t); ok(w && w.CLE ? w.CLE : null); }
    }, 100);
  });
}
async function montarArquivo() {
  const c = await carteiraPronta();
  return { formato: "cle-viagem", versao: 1, app: "Clé", exportado: new Date().toISOString(), de: S.viagem.dono,
    viagem: S.viagem, roteiro: { dias: DIAS }, estado: estadoApp(), carteira: c ? c.exportar() : null };
}
const slug = (t) => String(t).toLowerCase().normalize("NFD").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
async function salvarArquivo(nome, dados) {
  if (location.protocol === "file:" || !window.claude) {
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([dados])); a.download = nome; a.click();
    toast(`Arquivo salvo: ${nome}`); render(); return;
  }
  const dl = await window.claude.use("downloads");
  if (!dl) { toast("Este visualizador não permite salvar arquivos. Abra o protótipo pelo computador."); render(); return; }
  try { await dl.save({ filename: nome, data: dados }); toast(`Arquivo pronto: ${nome}`); }
  catch (e) { toast(e && e.code === "declined" ? "Salvamento cancelado." : "Não foi possível salvar o arquivo aqui."); }
  render();
}
async function lerArquivo(file) {
  const txt = await file.text();
  if (txt.startsWith("%PDF")) { const c = await carteiraPronta(); if (!c) throw new Error("pdf"); return c.lerPdf(txt); }
  return JSON.parse(txt);
}
// aceita o arquivo da viagem do app ou um arquivo antigo só da Carteira
function normalizarArquivo(d) {
  if (d && d.formato === "cle-viagem") return d;
  if (d && d.viagem && Array.isArray(d.lanc)) {
    const v = d.viagem;
    return { formato: "cle-viagem", viagem: { nome: v.nome, inicio: v.inicio, dias: v.dias, viajantes: v.viajantes.map((p) => p.nome), dono: null }, roteiro: null, estado: null, carteira: d, soCarteira: true };
  }
  throw new Error("formato");
}
async function abrirArquivoViagem(file) {
  try {
    const d = normalizarArquivo(await lerArquivo(file));
    S.viagem = { ...d.viagem, dono: null };
    DIAS = d.roteiro && Array.isArray(d.roteiro.dias) ? d.roteiro.dias : [];
    aplicarEstado(d.estado); garantirDias(); faseAuto();
    S.diaSel = S.diaHoje;
    const c = await carteiraPronta();
    if (c) { if (d.carteira) c.carregar(d.carteira, null); else c.criar(cfgCarteira(S.viagem), S.viagem.viajantes.slice(1), null); }
    S.donoOpcoes = c ? c.viajantes() : S.viagem.viajantes.map((n) => ({ id: null, nome: n }));
    S.overlay = "dono"; S.hist = []; S.tela = S.fase === "viagem" ? "hoje" : "conversa"; render();
    if (d.soCarteira) { toast("Arquivo da Carteira aberto. O roteiro desta viagem ainda está vazio."); render(); }
  } catch (e) { toast("Este arquivo não é um arquivo de viagem válido."); render(); }
}
async function juntarArquivo(file) {
  try {
    const d = normalizarArquivo(await lerArquivo(file));
    let r = null; const c = await carteiraPronta();
    if (c && d.carteira) r = c.juntar(d.carteira);
    const e = d.estado || {};
    let extra = 0;
    for (const [k, v] of Object.entries(e.confirmados || {})) if (v && !S.confirmados[k]) { S.confirmados[k] = true; extra++; }
    for (const [k, v] of Object.entries(e.tarefas || {})) if (v && !S.tarefas[k]) { S.tarefas[k] = true; extra++; }
    for (const [dia, lista] of Object.entries(e.extras || {})) for (const p of lista) { S.extras[dia] = S.extras[dia] || []; if (!S.extras[dia].some((x) => x.n === p.n)) { S.extras[dia].push(p); extra++; } }
    // paradas que o outro celular aprovou (por id ou nome) e tarefas/desejos novos
    for (const od of (d.roteiro && d.roteiro.dias) || []) { const ld = diaObj(od.dia); if (!ld) continue; for (const p of od.paradas || []) if (!ld.paradas.some((x) => (p.id && x.id === p.id) || x.n === p.n)) { ld.paradas.push(p); extra++; } if (!ld.paradas.length && od.titulo) ld.titulo = od.titulo; }
    const ol = e.listas || {};
    if (ol.tarefas) { garantirListas(); for (const t of ol.tarefas) if (!S.listas.tarefas.some((x) => x.id === t.id)) { S.listas.tarefas.push(t); extra++; } }
    if (ol.desejos) { garantirListas(); for (const x of ol.desejos) if (!S.listas.desejos.some((y) => (x.id && y.id === x.id) || y.n === x.n)) { S.listas.desejos.push(x); extra++; } }
    render(); toast(`Juntado${d.de ? " o arquivo de " + d.de : ""}: ${r ? `${r.novos} lançamento(s) novo(s), ${r.atualizados} atualizado(s)` : "sem Carteira"} · ${extra} mudança(s) no roteiro, checklist e desejos.`); render();
  } catch (e) { toast("Este arquivo não é um arquivo de viagem válido."); render(); }
}

function ir(tela, extra = {}) { S.hist.push({ tela: S.tela, lugar: S.lugar, diaSel: S.diaSel }); Object.assign(S, extra, { tela }); render(); }

function falarTexto(t, lang) {
  if (!("speechSynthesis" in window)) { toast("Este aparelho não lê textos em voz alta. Mostre a frase na tela."); render(); return; }
  speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = { en: "en-US", es: "es-ES", fr: "fr-FR", it: "it-IT", de: "de-DE", pt: "pt-BR" }[lang] || "en-US"; u.rate = 0.9; speechSynthesis.speak(u);

// ---------- voz do Marco: ElevenLabs, voz "Eric", modelo Eleven v4 turbo (escolha de Wagner, 30/09/2026) ----------
// O áudio vem do servidor do Marco (/voz). NUNCA usa o leitor de voz do aparelho (robótico, reprovado por Wagner
// em 01/10/2026). A fala do Marco não aparece escrita na tela: com o botão CC (legendas) ligado, ele não emite som
// e escreve em legendas pequenas embaixo do botão dele, trocadas como em filme. Sem a voz Eric, também vira legenda.

    try {
      // pedido avulso e barato (sem histórico): o Marco responde em voz e preenche a ficha; o viajante confere cada campo
      // só o que foi dito desde o último envio vai para o Marco; o resto já está resumido na ficha e no perfil
      // (menos tokens, e o Marco não volta a repetir o que já anotou)
      const { fala, cotacao, ...ficha } = o.f, pf = o.pf;
      const novo = o.f.fala.slice(o.falaEnviada || 0).trim() || o.f.fala.trim(), tamanhoEnviado = o.f.fala.length;
      const perfil = { ritmo: o.ritmoDito ? pf.ritmo : "", acordar: pf.acordar, max_horas_direcao: pf.maxDirecao, regras: pf.regras, alimentacao: pf.alimentacao, limites: pf.limites,
        amam: INTERESSES.filter((n) => pf.int[n] === 2).join(", "), curtem: INTERESSES.filter((n) => pf.int[n] === 1).join(", "), nao_curtem: INTERESSES.filter((n) => pf.int[n] === 3).join(", ") };
      const r = await apiFetch("/ficha", { method: "POST", body: JSON.stringify({ fala: novo, hoje: hojeISO(), quem: o.f.nome || null, etapa: o.step, ficha, perfil, ultima: o.marco || "" }) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.erro || "O Marco não respondeu.");
      if (j.ficha) preencherFicha(j.ficha);
      o.falaEnviada = tamanhoEnviado;
      o.marco = j.resposta || (j.ficha ? "Preenchi o que entendi na ficha aqui embaixo. Confere pra mim?" : "Ainda não peguei os detalhes da viagem. Me conta pra onde vocês querem ir, quando e quem vai?");
      o.conversou = true;
      o.lendo = false; render();
      // Conversa contínua: quem diz que a tela terminou é o próprio Marco (avancar), nunca a pontuação da fala dele
      // (bug de 01/10/2026: um resumo terminado em ponto final desligava a escuta). Sem avançar, ele volta a ouvir.
      const aqui = () => S.tela === "onboarding" && S.onb === o;
      marcoFalar(o.marco, { semSom: o.semVoz, aoFim: () => {
        if (!aqui()) return;
        if (j.avancar && o.porVoz) {
          const antes = o.step;
          if (antes === 4) { A.onbFim(); if (aqui()) continuarOuvindo(o); return; } // última tela: cria a viagem
          A.onbNext(); // já apresenta a próxima tela (onbEtapa)
          if (o.step === antes) continuarOuvindo(o); // faltou algo obrigatório: segue a conversa
          return;
        }
        if (o.porVoz) continuarOuvindo(o); else mostrarDica();
      } }); return;
    } catch (e) { toast(e.message || "O Marco não respondeu. Preencha a ficha abaixo."); }
    o.lendo = false; render();
  },
  onbNext() {
    const o = S.onb, f = o.f; encerrarVoz();
    if (o.step === 0) {
      const falta = [["nome", "seu nome"], ["destino", "o destino"], ["pais", "o país principal"], ["inicio", "a data de início"], ["dias", "quantos dias"]].filter(([k]) => !String(f[k] || "").trim()).map(([, l]) => l);
      if (!(+f.dias > 0) && !falta.includes("quantos dias")) falta.push("quantos dias");
      if (falta.length) { toast(`Para começar falta: ${falta.join(", ")}.`); render(); return; }
    }
    o.step++; if (o.step === 4) { aplicarCenarios(o); buscarCambio(); }
    render(); $("#main").scrollTop = 0;
    if (o.porVoz && !o.semVoz) A.onbEtapa(); else mostrarDica(6000);
  },
  // cada etapa: o Marco faz UMA pergunta que cobre a tela inteira (texto local, sem tokens) e já fica ouvindo
  onbEtapa() {
    const o = S.onb; o.etapas = { ...(o.etapas || {}), [o.step]: true };
    // interesses e situações são escolhidos só tocando (Wagner, 02/10/2026): o Marco explica e não abre o microfone
    const soToque = ETAPAS_SO_TOQUE.includes(o.step);
    o.porVoz = true; o.semVoz = false; S.vozAtiva = !soToque; o.marco = perguntaEtapa(o); atualizarTravaTela(); render();
    marcoFalar(o.marco, { guardar: true, aoFim: () => { if (S.tela !== "onboarding" || S.onb !== o) return; if (soToque) mostrarDica(8000); else continuarOuvindo(o); } });
  },
  onbVoltar() { encerrarVoz(); S.onb.step = Math.max(0, S.onb.step - 1); render(); },
  onbCen(ds) { const o = S.onb; if (o.cen[ds.s] === +ds.i) delete o.cen[ds.s]; else o.cen[ds.s] = +ds.i; render(); },
  async onbFim() {
    const o = S.onb, f = o.f, p = paisDe(f.pais);
    const cot = p && p.moeda === "BRL" ? 1 : numBR(f.cotacao);
    if (!(cot > 0)) { toast(`Informe o câmbio: quantos reais vale 1 ${p ? p.moeda : "unidade"} hoje.`); render(); return; }
    const nome = f.nome.trim(), outrosN = f.outros.split(",").map((x) => x.trim()).filter((x) => x && norm(x) !== norm(nome));
    const pf = { ...o.pf, maxDirecao: o.pf.maxDirecao ? numBR(o.pf.maxDirecao) : null, ocasiao: f.ocasiao, saindoDe: f.saindoDe, reservado: f.reservado, orcamento: f.orcamento, fala: f.fala };
    S.viagem = { nome: (f.nomeViagem || f.destino).trim(), destino: f.destino.trim(), pais: f.pais, idioma: p.lang, inicio: f.inicio, dias: +f.dias, viajantes: [nome, ...outrosN], dono: nome, emergencia: p.sos, moeda: { cod: p.moeda, simb: p.simb }, cotacao: cot, perfil: pf, info: {} };
    DIAS = []; aplicarEstado(null); garantirDias(); garantirListas(); faseAuto();
    rascunhoApagar(); S.vozAtiva = false; // viagem criada: o rascunho cumpriu o papel
    const c = await carteiraPronta(); if (c) c.criar(cfgCarteira(S.viagem), outrosN, nome);
    S.hist = []; S.tela = S.fase === "viagem" ? "hoje" : "conversa"; S.chat = null; render();
    toast("Viagem criada. A Carteira já nasceu configurada."); render();
    if (marcoDisponivel()) { S.tela = "conversa"; enviarTexto("Acabei de criar a viagem. Sugira as principais atrações dos destinos para escolhermos (Quero, Talvez ou Não), de acordo com o nosso perfil."); }
  },
};

document.addEventListener("click", (ev) => {
  const el = ev.target.closest("[data-a]"); if (!el) return;
  const f = A[el.dataset.a]; if (!f) return;
  if (el.dataset.a !== "fecharFundo") ev.preventDefault();
  f(el.dataset, el, ev);
});
document.addEventListener("submit", async (ev) => {
  const fm = ev.target.closest("[data-f]"); if (!fm) return;
  ev.preventDefault();
  if (["entrar", "cadastro", "recuperar", "novasenha"].includes(fm.dataset.f)) return enviarConta(fm.dataset.f);
  if (fm.dataset.f === "marco") { const t = S.rascunho; S.rascunho = ""; await enviarTexto(t); }
  if (fm.dataset.f === "busca") {
    const b = S.busca; if (!b.q.trim()) return;
    if (!API) { b.res = { erro: "A busca de lugares usa o servidor do Marco, que ainda não está ligado neste endereço. Peça o lugar ao Marco no computador de testes." }; render(); return; }
    b.carregando = true; b.res = null; render();
    const ref = DIAS.flatMap((d) => paradasDo(d)).find((p) => p.t === "pernoite" && Number.isFinite(+p.lat));
    try { b.res = await (await apiFetch("/lugar", { method: "POST", body: JSON.stringify({ consulta: b.q, pais: S.viagem && S.viagem.pais, perto: ref ? { lat: +ref.lat, lng: +ref.lng } : null }) })).json(); }
    catch (e) { b.res = { erro: "A busca não respondeu. Verifique a internet." }; }
    b.carregando = false; render();
  }
});
document.addEventListener("change", (ev) => {
  const t = ev.target;
  const f = t.files && t.files[0];
  if (f) {
    if (t.id === "arquivo") receberComprovante(f);
    if (t.id === "arqViagem") abrirArquivoViagem(f);
    if (t.id === "arqJuntar") juntarArquivo(f);
    t.value = ""; return;
  }
  if (t.dataset.onb === "pais" && S.onb) { S.onb.f.pais = t.value; S.onb.f.cotacao = ""; }
  if (t.dataset.onbSl || t.dataset.pfSl) render();
});
document.addEventListener("input", (ev) => {
  const t = ev.target, ds = t.dataset;
  if (t.id === "txtMarco") S.rascunho = t.value;
  else if (t.id === "qBusca" && S.busca) S.busca.q = t.value;
  else if (ds.onb && S.onb) { if (ds.onb in S.onb.f) S.onb.f[ds.onb] = t.value; else S.onb.pf[ds.onb] = t.value; }
  else if (ds.onbSl && S.onb) { S.onb.pf.sl[ds.onbSl] = +t.value; S.onb.slManual = true; }
  else if (ds.pf && S.viagem) { perfilAtual()[ds.pf] = ds.pf === "maxDirecao" ? (t.value ? numBR(t.value) : null) : t.value; memSalvar(); }
  else if (ds.pfSl && S.viagem) { const pf = perfilAtual(); pf.sl = pf.sl || {}; pf.sl[ds.pfSl] = +t.value; memSalvar(); }
  else if (ds.saude) { const s = saudeLer(); s[ds.saude] = t.value; saudeSalvar(s); }
});

// ---------- altura real da tela ----------
// No Chrome do Android, logo depois de recarregar (atualizações), "100dvh" às vezes é medido com a barra de
// endereço escondida e o rodapé (botão do Marco) fica abaixo da área visível (bug de 01/10/2026). A altura do app
// passa a ser a área visível medida de verdade. Com o teclado aberto, a altura fica como estava e o botão se esconde.
function ajustarAltura() {
  const vv = window.visualViewport, h = vv ? vv.height : window.innerHeight;
  const el = document.activeElement, digitando = !!el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName) && el.type !== "file";
  const teclado = digitando && window.innerHeight - h > 120 || (digitando && vv && screen.height - h > screen.height * 0.35);
  document.body.classList.toggle("teclado", !!teclado);
  if (!teclado) document.documentElement.style.setProperty("--altura-app", Math.round(h) + "px");
}
if (window.visualViewport) visualViewport.addEventListener("resize", ajustarAltura);
for (const ev of ["resize", "orientationchange", "pageshow", "focusin", "focusout"]) window.addEventListener(ev, () => { ajustarAltura(); setTimeout(ajustarAltura, 350); });
ajustarAltura(); setTimeout(ajustarAltura, 300); setTimeout(ajustarAltura, 1200);

// ---------- partida ----------
const _mem = memLer();
if (_mem && _mem.viagem && _mem.viagem.dono) {
  S.viagem = _mem.viagem; DIAS = (_mem.roteiro && _mem.roteiro.dias) || []; aplicarEstado(_mem.estado); garantirDias(); faseAuto(); S.diaSel = S.diaHoje;
  S.tela = S.fase === "viagem" ? "hoje" : "conversa";
} else if (rascunhoLer()) {
  // Nova viagem pela metade: volta direto para ela, com tudo o que já foi conversado
  S.onb = { ...novaOnb(), ...rascunhoLer().onb, intro: false, lendo: false, retomar: true, dicaAte: Date.now() + 8000 }; S.tela = "onboarding";
  setTimeout(() => render(), 8100); // a dica de retomada some sozinha
} else S.tela = "boasvindas";
S.conta = (sessaoLer() || {}).user || null;
if (AUTH && !S.conta) S.tela = "entrar";
if (AUTH && /access_token|error_description/.test(location.hash)) lerRetornoConta().then(() => { if (sessaoLer()) entrarNoApp(); else { S.tela = "entrar"; render(); } });
checarMarco();
cofreAtualizar().then(render);
// app instalável (PWA): funciona sem internet depois da primeira abertura
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  const jaTinha = !!navigator.serviceWorker.controller;
  // versão nova assumiu: oferece atualizar com um toque (sem recarregar sozinho no meio de uma conversa)
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (jaTinha) { S.novaVersao = true; render(); } });
  navigator.serviceWorker.register("sw.js").then((r) => r.update()).catch(() => {});
  // no celular o app fica aberto em segundo plano: ao voltar para ele, procura versão nova de novo
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { navigator.serviceWorker.getRegistration().then((r) => r && r.update()).catch(() => {}); checarVersao(); } });
}
// segunda via, independente do service worker: pergunta ao servidor qual é a versão publicada (sem cache)
function checarVersao() {
  if (VERSAO_APP === "dev" || location.protocol === "file:") return;
  fetch("versao.json?t=" + Date.now(), { cache: "no-store" }).then((r) => (r.ok ? r.json() : null)).then((j) => {
    if (!j || !j.versao || j.versao === S.versaoPublicada) return;
    S.versaoPublicada = j.versao; if (j.versao !== VERSAO_APP) S.novaVersao = true; render();
  }).catch(() => {});
}
checarVersao();
render();
</script>
