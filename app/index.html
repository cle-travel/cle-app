<style>
/* Layout: um app de celular (até 430px), tela única com cabeçalho grande estilo iOS, conteúdo rolável e barra de abas.
   No computador, o app fica centralizado como um aparelho. Visual sóbrio; um único destaque: azul-ardósia. */
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --fg:#1D1D1F; --fg2:#6E6E73; --fg3:#AEAEB2; --sep:#E3E3E8; --fill:#EBEBF0;
  --accent:#24476B; --accent-fg:#FFFFFF; --accent-soft:#E4EBF3;
  --ok:#1E6B34; --ok-bg:#E5F3E8; --warn:#8A4F00; --warn-bg:#FCEFD8; --bad:#B42318; --bad-bg:#FCE9E7;
  --map:#ECEAE4; --map2:#E3E0D8; --map-grid:#DFDCD4; --road:#FFFFFF; --orb:#24476B;
  --line:rgba(17,24,39,.07); --sh:0 1px 2px rgba(17,24,39,.04),0 2px 8px rgba(17,24,39,.05); --glass:rgba(255,255,255,.82);
  --font:"Geist",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:16px; --r-lg:22px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --card:#1C1C1E; --fg:#F5F5F7; --fg2:#98989D; --fg3:#636366; --sep:#38383A; --fill:#2C2C2E;
  --accent:#8FB3DA; --accent-fg:#0B1B2B; --accent-soft:#1A2837;
  --ok:#7DD89A; --ok-bg:#132A1B; --warn:#F2C36B; --warn-bg:#35270D; --bad:#FF7B72; --bad-bg:#3A1513;
  --map:#1B1C1F; --map2:#151618; --map-grid:#26272B; --road:#34363B; --orb:#8FB3DA;
  --line:rgba(255,255,255,.07); --sh:none; --glass:rgba(28,28,30,.82); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1C1C1E; --fg:#F5F5F7; --fg2:#98989D; --fg3:#636366; --sep:#38383A; --fill:#2C2C2E;
  --accent:#8FB3DA; --accent-fg:#0B1B2B; --accent-soft:#1A2837;
  --ok:#7DD89A; --ok-bg:#132A1B; --warn:#F2C36B; --warn-bg:#35270D; --bad:#FF7B72; --bad-bg:#3A1513;
  --map:#1B1C1F; --map2:#151618; --map-grid:#26272B; --road:#34363B; --orb:#8FB3DA;
  --line:rgba(255,255,255,.07); --sh:none; --glass:rgba(28,28,30,.82); color-scheme:dark}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;-webkit-font-smoothing:antialiased;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
a{color:var(--accent)}
.app{position:relative;height:100%;max-width:430px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
@media (min-width:600px){body{background:var(--fill)}.app{height:calc(100% - 40px);margin-block:20px;border-radius:34px;border:1px solid var(--sep);box-shadow:0 20px 60px rgba(0,0,0,.12)}}
.top{padding:14px 16px 8px;display:flex;align-items:center;gap:10px;min-height:52px}
.top .ttl{flex:1;min-width:0;text-align:center}
.top .ttl b{display:block;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl span{display:block;font-size:12px;color:var(--fg2)}
.iconbtn{width:36px;height:36px;border-radius:18px;display:flex;align-items:center;justify-content:center;color:var(--accent);flex-shrink:0}

main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.pad{padding:4px 16px 32px;display:flex;flex-direction:column;gap:18px}
h1{font-size:30px;font-weight:700;letter-spacing:-.8px;line-height:1.1;margin:2px 0 0;text-wrap:balance}
.sub{font-size:15px;color:var(--fg2);margin:4px 0 0;line-height:1.4}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--fg2);margin:4px 4px -8px}
.card{background:var(--card);border-radius:var(--r-lg);padding:18px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line);box-shadow:var(--sh)}
.list{background:var(--card);border-radius:var(--r);overflow:hidden;border:1px solid var(--line);box-shadow:var(--sh)}
.hero{display:flex;flex-direction:column;gap:6px}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);box-shadow:var(--sh);border-radius:var(--r);padding:12px 12px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-size:20px;font-weight:650;letter-spacing:-.3px;font-variant-numeric:tabular-nums;white-space:nowrap}

.datebox{width:44px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;line-height:1}
.datebox small{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--fg2)}

.thumb{width:54px;height:54px;border-radius:12px;overflow:hidden;flex-shrink:0;background:var(--map);border:1px solid var(--line)}

.avatar{width:28px;height:28px;border-radius:14px;background:var(--accent);color:var(--accent-fg);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;font-weight:700}
.who{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--fg2)}
.trip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--fg2)}

.row{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:48px;width:100%;text-align:left;position:relative}
.row+.row::before{content:"";position:absolute;top:0;left:14px;right:0;border-top:.5px solid var(--sep)}
.row .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .main b{font-weight:500;font-size:16px}
.row .main span{font-size:13px;color:var(--fg2)}
.row .val{color:var(--fg2);font-size:15px;text-align:right;font-variant-numeric:tabular-nums}

.btn{height:50px;border-radius:14px;letter-spacing:-.1px;text-decoration:none;background:var(--accent);color:var(--accent-fg);font-weight:600;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.btn.sec{background:var(--fill);color:var(--accent)}
.btn.ghost{background:none;color:var(--accent)}
.btn.danger{background:var(--bad);color:#fff}
.btns{display:flex;gap:10px}
.btns .btn{flex:1}
.pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:10px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.pill.ok{color:var(--ok);background:var(--ok-bg)}
.pill.warn{color:var(--warn);background:var(--warn-bg)}
.pill.bad{color:var(--bad);background:var(--bad-bg)}
.pill.acc{color:var(--accent);background:var(--accent-soft)}
.pill.neu{color:var(--fg2);background:var(--fill)}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:15px;padding:9px 0;border-top:.5px solid var(--sep)}
.kv:first-child{border-top:0}
.kv span:first-child{color:var(--fg2)}
.kv span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.tabbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:6px 6px calc(8px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:500;color:var(--fg3);padding:4px 0}
.tab.on{color:var(--accent)}
.tab .badge{position:absolute;margin-left:18px;margin-top:-2px;background:var(--bad);color:#fff;font-size:10px;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.tab>span{position:relative;display:flex}
.seg{display:flex;background:var(--fill);border-radius:10px;padding:2px}
.seg button{flex:1;padding:7px 4px;border-radius:8px;font-size:14px;font-weight:500;color:var(--fg2)}
.seg button.on{background:var(--card);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
/* conversa */
.chat{display:flex;flex-direction:column;gap:14px;padding:6px 16px 12px}
.msg-m{font-size:17px;line-height:1.45;max-width:100%}
.msg-u{align-self:flex-end;max-width:82%;background:var(--accent);color:var(--accent-fg);border-radius:20px 20px 6px 20px;padding:11px 15px;font-size:16px;line-height:1.4}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;border:.5px solid var(--sep);background:var(--card);border-radius:18px;padding:8px 13px;font-size:14px;color:var(--fg)}
.voz{display:flex;flex-direction:column;align-items:center;gap:8px;padding:6px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.voz .linha{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:300px}
.orb{position:relative;width:84px;height:84px;display:flex;align-items:center;justify-content:center}
.orb i{position:absolute;inset:0;border-radius:50%;background:var(--orb);opacity:.1}
.orb i+i{inset:10px;opacity:.2}
.orb button{position:relative;width:52px;height:52px;border-radius:26px;background:var(--orb);color:var(--accent-fg);display:flex;align-items:center;justify-content:center}
.orb.ouvindo i{animation:pulso 1.4s ease-in-out infinite}
.orb.ouvindo i+i{animation-delay:.2s}
.orb.pensando i{animation:gira 1s linear infinite;opacity:.18}
@keyframes pulso{0%,100%{transform:scale(.9)}50%{transform:scale(1.08)}}
@keyframes gira{0%{opacity:.08}50%{opacity:.3}100%{opacity:.08}}
@media (prefers-reduced-motion:reduce){.orb i{animation:none!important}}
.small{font-size:13px;color:var(--fg2)}
.transc{font-size:15px;color:var(--fg2);min-height:22px;text-align:center;max-width:320px}
/* mapa */
.mapa{background:var(--map);border-radius:var(--r-lg);overflow:hidden;position:relative}
.mapa svg{display:block;width:100%;height:auto}
.daynav{display:flex;align-items:center;gap:8px}
.daynav .t{flex:1;min-width:0;text-align:center}
.daynav .t b{display:block;font-size:17px}
.daynav .t span{font-size:13px;color:var(--fg2);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num{width:28px;height:28px;border-radius:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;background:var(--accent);color:var(--accent-fg)}
.num.warn{background:var(--card);color:var(--warn);border:2px dashed var(--warn)}
.num.bad{background:var(--card);color:var(--bad);border:2px dashed var(--bad)}
.hora{width:48px;flex-shrink:0;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.tl .row{align-items:flex-start}
.ico{width:32px;height:32px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.progress{height:6px;border-radius:3px;background:var(--fill);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:3px}
.bar{display:flex;flex-direction:column;gap:6px}
.bar .l{display:flex;justify-content:space-between;font-size:14px;font-variant-numeric:tabular-nums}
.bar .l span:last-child{color:var(--fg2)}
.check{width:24px;height:24px;border-radius:12px;border:1.5px solid var(--fg3);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:transparent}
.check.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.feito b{color:var(--fg3);text-decoration:line-through}
/* sobreposições */
.toast{position:absolute;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);border-radius:14px;padding:12px 14px;font-size:15px;display:flex;gap:10px;align-items:center;z-index:30;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.toast button{margin-left:auto;color:var(--bg);font-weight:600;text-decoration:underline}
.alerta{position:absolute;inset:0;background:#1C1C1E;color:#F5F5F7;z-index:50;display:flex;flex-direction:column;padding:calc(40px + env(safe-area-inset-top,0px)) 24px calc(28px + env(safe-area-inset-bottom,0px));gap:18px;overflow-y:auto}
.alerta .ic{width:64px;height:64px;border-radius:32px;background:#FF3B30;display:flex;align-items:center;justify-content:center;color:#fff;margin-top:12px}
.alerta h2{font-size:30px;line-height:1.15;margin:0;font-weight:700;text-wrap:balance}
.alerta p{margin:0;font-size:17px;line-height:1.45;color:#D1D1D6}
.alerta .bx{background:#2C2C2E;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:4px}
.alerta .bx small{color:#A1A1A6;font-size:13px}
.alerta .b1{height:52px;border-radius:14px;background:#FFFFFF;color:#1D1D1F;font-weight:600;font-size:17px}
.alerta .b2{height:52px;border-radius:14px;background:#2C2C2E;color:#FFFFFF;font-weight:600;font-size:17px}
.alerta .b3{height:44px;color:#A1A1A6;font-size:16px}
.notif{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:10px;right:10px;z-index:40;background:var(--card);border-radius:20px;padding:12px 14px;display:flex;gap:12px;box-shadow:0 10px 40px rgba(0,0,0,.22);text-align:left;width:auto}
.notif .app-ic{width:38px;height:38px;border-radius:9px;background:var(--accent);color:var(--accent-fg);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sheet{position:absolute;inset:0;z-index:45;background:rgba(0,0,0,.4);display:flex;align-items:flex-end}
.sheet .in{background:var(--bg);width:100%;border-radius:22px 22px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-height:92%;overflow-y:auto}
.grab{width:36px;height:5px;border-radius:3px;background:var(--fg3);align-self:center;opacity:.5}
/* onboarding */
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:7px;height:7px;border-radius:4px;background:var(--fg3);opacity:.5}
.dots i.on{width:20px;background:var(--accent);opacity:1}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.int{background:var(--card);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;text-align:left;border:1.5px solid transparent;min-height:78px}
.int b{font-size:15px;font-weight:600}
.int.amo{border-color:var(--accent)}
.int.nao{opacity:.45}
.swipe{background:var(--card);border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:10px;min-height:250px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
.swipe .ph{height:110px;border-radius:16px;background:linear-gradient(160deg,var(--accent-soft),var(--fill));display:flex;align-items:flex-end;padding:12px;color:var(--accent);font-weight:600}
.opt{background:var(--card);border-radius:14px;padding:14px;text-align:left;border:1.5px solid transparent;font-size:15px;line-height:1.35}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.ficha .kv span:last-child{font-weight:500}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:.2;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}}
.demo{border:1px dashed var(--fg3);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.mono{font-variant-numeric:tabular-nums}
.sel{user-select:all}
</style>

  cam: '<rect x="3" y="7" width="18" height="13" rx="3"/><circle cx="12" cy="13.5" r="3.5"/><path d="M9 7l1.5-3h3L15 7"/>', fork: '<path d="M7 3v8a2 2 0 0 0 4 0V3M9 11v10M17 3c-2 0-3 3-3 6s1 3 3 3v9"/>',

  pin: '<path d="M12 21s7-6.5 7-12a7 7 0 0 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/>', doc: '<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/>',
  star: '<path d="M12 4l2.5 5 5.5.8-4 3.9.9 5.5L12 16.6 7.1 19.2 8 13.7 4 9.8 9.5 9z"/>', people: '<circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.5a5 5 0 0 1 5 5"/>',
  printer: '<path d="M7 9V3h10v6M7 17H4v-7h16v7h-3"/><rect x="7" y="14" width="10" height="7"/>', globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
  phone: '<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/>', copy: '<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a1 1 0 0 1 1-1h10"/>',
  upload: '<path d="M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/>', plus: '<path d="M12 5v14M5 12h14"/>', x: '<path d="M6 6l12 12M18 6L6 18"/>',
  heart: '<path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/>', lock: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  compass: '<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/>', translate: '<path d="M4 5h9M8.5 3v2M6 5c0 4 3 7 6 8M11 5c0 3-3 7-7 8M13 21l4-9 4 9M14.5 18h5"/>',
};
const ic = (n, s = 22, w = 1.8) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n] || ""}</svg>`;
const TIPO = { inicio: ["flag", "Saída"], pernoite: ["bed", "Hospedagem"], passeio: ["cam", "Passeio"], refeicao: ["fork", "Refeição"], abastecimento: ["fuel", "Abastecimento"], transito: ["arrow", "Trânsito"] };

// ---------- estado ----------
const S = {
  fase: "planejamento", tela: "conversa", hist: [], diaSel: 1, diaHoje: 1, agora: "10h05",
  lugar: null, confirmados: {}, tarefas: {}, extras: {}, chat: null, pensando: false, voz: "parado", transc: "",
  carteiraVista: "total", onb: null, overlay: null, toast: null, viagem: null, listas: null,
};
let DIAS = [];
const outros = () => { const v = S.viagem; const o = v ? v.viajantes.filter((n) => n !== v.dono) : []; return o.length ? o.join(" e ") : "o grupo"; };
const exemploWestern = () => !!(S.viagem && S.viagem.exemplo === "western" && DIAS.length);
const nomeViagem = () => (S.viagem ? S.viagem.nome : "Clé");
const fimViagem = () => { if (!S.viagem) return null; const d = new Date(S.viagem.inicio + "T12:00:00"); d.setDate(d.getDate() + (S.viagem.dias || 1) - 1); return d.toISOString().slice(0, 10); };
const diasAte = () => (S.viagem ? Math.ceil((new Date(S.viagem.inicio + "T12:00:00") - new Date()) / 864e5) : 0);
const tripSub = () => S.viagem ? `${fmtData(S.viagem.inicio, { day: "numeric", month: "short" })} – ${fmtData(fimViagem(), { day: "numeric", month: "short" })} · ${S.viagem.viajantes.join(" e ")}` : "";
const vazio = (titulo, texto) => `<div class="card" style="align-items:flex-start"><span class="ico" style="width:44px;height:44px;border-radius:12px">${ic("compass", 24)}</span><div style="font-size:19px;font-weight:600">${esc(titulo)}</div><div style="font-size:15px;line-height:1.45;color:var(--fg2)">${esc(texto)}</div><button class="btn" data-a="ir" data-t="conversa">${ic("mic", 18)} Falar com o Marco</button></div>`;
const diaObj = (n) => DIAS.find((d) => d.dia === +n);
const paradasDo = (d) => [...d.paradas, ...(S.extras[d.dia] || [])].slice().sort((a, b) => (a.t === "inicio" ? -1 : b.t === "inicio" ? 1 : hmin(a.h) - hmin(b.h)));
const seloDe = (p) => (S.confirmados[p.n] ? "verde" : p.selo);
const aConfirmar = () => { const s = new Set(); for (const d of DIAS) for (const p of d.paradas) if (seloDe(p) !== "verde") s.add(p.n); return s.size; };
const seloPill = (p) => { const c = seloDe(p); return c === "verde" ? "" : c === "amarelo" ? '<span class="pill warn">A confirmar</span>' : '<span class="pill bad">Confirmar local</span>'; };

// ---------- conversa ----------
const SYLVAN = { n: "Sylvan Lake", t: "passeio", h: "18h00", dur: "45min", lat: 43.84659, lng: -103.55943, end: "Sylvan Lake, Custer State Park, SD", tel: null, site: null, selo: "verde", est: { n: "Estacionamento do lago", lat: 43.84752, lng: -103.55868, km: 0.15, min: 3 }, novo: true };
function chatInicial() {
  const dono = (S.viagem && S.viagem.dono) || "";
  if (exemploWestern()) {
    const n = aConfirmar(), f = diasAte();
    return [
      { de: "m", txt: `Olá${dono ? ", " + dono : ""}. ${f > 0 ? `Faltam ${f} dias para a ${nomeViagem()}.` : `Esta é a ${nomeViagem()}.`} O roteiro dos ${DIAS.length} dias está montado; ainda há ${n} locais para você conferir no mapa e algumas reservas em aberto.` },
      { de: "u", txt: "Quero um lugar bonito para ver o pôr do sol no dia 3, perto de Custer." },
      { de: "m", txt: "O Sylvan Lake fica a 15 minutos do hotel em Custer, e a volta é curta. Veja a proposta:", card: "proposta" },
    ];
  }
  return [{ de: "m", txt: `Olá${dono ? ", " + dono : ""}. Vamos planejar a ${nomeViagem()}? Me conte o que vocês querem ver e fazer. Eu monto o roteiro dia a dia, com rotas, horários e custos, e lanço tudo na Carteira.` }];
}
const RESP = {
  falta: () => ({ txt: `Temos ${pendentes()} tarefas abertas no checklist.${DIAS.length ? ` Há ${aConfirmar()} locais para conferir no mapa.` : ""}`, card: "link:checklist:Abrir checklist" }),
  gasto: () => ({ txt: "Está tudo na Carteira: o planejado e o realizado por categoria, a carteira de cada um e o acerto de contas entre os viajantes.", card: "link:carteira:Abrir carteira" }),
  lanca: () => ({ txt: `Entendi: almoço de US$ 38,50, pago por você, dividido igual com ${outros()}. Confere antes de eu lançar na Carteira:`, card: "lanc" }),
  roteiro: () => ({ txt: "Montar o roteiro de verdade exige que eu esteja conectado à inteligência do Marco, e isso entra na construção. Por enquanto, abra o arquivo de exemplo da Western para ver como um roteiro pronto fica no app.", card: "link:arquivo:Abrir arquivo da viagem" }),
  posto: () => { const d = diaObj(S.diaHoje); const p = d && d.postos[0]; return p ? { txt: `No roteiro do dia ${d.dia}, o próximo posto recomendado é o ${p.n}.`, card: "posto" } : { txt: "Não encontrei postos no trajeto de hoje." }; },
};
const tarefasLista = () => (S.listas && S.listas.tarefas) || TAREFAS_PADRAO;
const textoTarefa = (t) => (t.id === "conf" ? `Conferir ${aConfirmar()} locais no mapa` : t.t);
function pendentes() { return tarefasLista().filter((t) => !S.tarefas[t.id]).length; }

// ---------- tarefas (uma viagem nova começa com estas; o arquivo da viagem pode trazer outras) ----------
const TAREFAS_PADRAO = [
  { id: "conf", g: "Fazer agora", t: "Conferir locais no mapa", s: "Pontos em que as fontes discordam ou que não existem em base nenhuma", ir: "confirmar" },
  { id: "seg", g: "Fazer agora", t: "Anexar comprovante do seguro viagem", s: "O Marco lê o documento e preenche tudo", comp: "seguro" },
  { id: "off", g: "Fazer agora", t: "Baixar mapas para usar sem sinal", s: "Do roteiro inteiro" },
  { id: "checkin", g: "Até a viagem", t: "Check-in online do voo de ida", s: "Abre 24 h antes do embarque" },
  { id: "guia", g: "Até a viagem", t: "Imprimir o guia em duas vias", s: "PDF gerado a partir do roteiro", ir: "guia" },
  { id: "docs", g: "Até a viagem", t: "Separar passaportes e documentos", s: "Todos os viajantes" },
];
const COFRE_PADRAO = [{ n: "Passaportes e vistos", s: "Todos os viajantes" }, { n: "Voos", s: "Ida e volta" }, { n: "Hospedagens", s: "Reservas" }, { n: "Seguro viagem", s: "", seguro: true }];

// ---------- renderização ----------
function header(opts) {
  const { titulo, sub, voltar, direita } = opts;
  return `<div class="top">${voltar ? `<button class="iconbtn" data-a="voltar" aria-label="Voltar">${ic("back")}</button>` : `<button class="iconbtn" data-a="ir" data-t="viagens" aria-label="Minhas viagens">${ic("list")}</button>`}
  <div class="ttl"><b>${esc(titulo)}</b>${sub ? `<span>${esc(sub)}</span>` : ""}</div>${direita ?? `<button class="iconbtn sos" data-a="ir" data-t="emergencia" aria-label="Emergência">${ic("sos")}</button>`}</div>`;
}

function telaConversa() {
  if (!S.chat) S.chat = chatInicial();
  const msgs = S.chat.map((m) => {
    if (m.de === "u") return `<div class="msg-u">${esc(m.txt)}</div>`;
    let c = "";
    if (m.card === "proposta") c = cardProposta();
    else if (m.card === "lanc") c = cardLanc();
    else if (m.card === "posto") { const p = diaObj(S.diaHoje).postos[0]; c = `<div class="card"><div class="kv"><span>Posto</span><span>${esc(p.n)}</span></div><a class="btn sec" href="${gmaps(p.lat, p.lng)}" target="_blank" rel="noopener">${ic("compass", 18)} Navegar até o posto</a></div>`; }
    else if (m.card && m.card.startsWith("link:")) { const [, t, l] = m.card.split(":"); c = `<button class="btn sec" data-a="ir" data-t="${t}">${esc(l)}</button>`; }
    return `<div class="fade" style="display:flex;flex-direction:column;gap:10px"><div class="who"><span class="avatar">${ic("compass", 16, 2)}</span>Marco</div><div class="msg-m">${esc(m.txt)}</div>${c}</div>`;
  }).join("");
  const orbCls = S.pensando ? "pensando" : S.voz === "ouvindo" ? "ouvindo" : "";
  const status = S.pensando ? "Pensando…" : S.voz === "ouvindo" ? "Ouvindo" : "Toque para falar";
  const chips = exemploWestern()
    ? [["lanca", `Lança: almoço US$ 38,50 dividido com ${outros()}`], ["falta", "O que falta resolver?"], ["gasto", "Quanto já gastamos?"], ["posto", "Tem posto no caminho hoje?"]]
    : [["roteiro", "Monta um primeiro roteiro"], ["falta", "O que falta resolver?"], ["gasto", "Quanto já gastamos?"]];
  return `${header({ titulo: nomeViagem(), sub: tripSub() })}
  <main id="main"><div class="chat">${msgs}${S.pensando ? '<div class="small">Marco está pensando…</div>' : ""}</div></main>
  <div class="chips" role="group" aria-label="Sugestões">${chips.map(([k, l]) => `<button class="chip" data-a="perg" data-k="${k}">${esc(l)}</button>`).join("")}</div>
  <div class="voz"><div class="transc">${esc(S.transc || "")}</div>
    <div class="linha"><button class="iconbtn" style="background:var(--fill);color:var(--fg);width:46px;height:46px;border-radius:23px" data-a="toast" data-m="No app, o teclado abre aqui para quem prefere digitar." aria-label="Digitar">${ic("kb")}</button>
    <div class="orb ${orbCls}"><i></i><i></i><button data-a="falar" aria-label="Falar com o Marco">${ic("mic", 24)}</button></div>
    <button class="iconbtn" style="background:var(--fill);color:var(--fg);width:46px;height:46px;border-radius:23px" data-a="toast" data-m="Conversa pausada. O Marco para de ouvir até você tocar de novo." aria-label="Pausar">${ic("pause", 20)}</button></div>
    <span class="small">${status}</span></div>`;
}
function cardProposta() {
  const aplicada = (S.extras[3] || []).length > 0;
  return `<div class="card" style="border:.5px solid var(--sep)">
    <div style="display:flex;justify-content:space-between;align-items:center"><span class="small">Proposta para o D3 · ${esc(fmtData(diaObj(3).data))}</span><span class="pill ok">${ic("check", 12, 2.5)} Local confirmado</span></div>
    <div><div style="font-size:20px;font-weight:600">Pôr do sol no Sylvan Lake · 18h00</div><div class="small" style="font-size:15px">Custer State Park · 45 min no local</div></div>
    <div><div class="kv"><span>Impacto no dia</span><span>+25 min de direção</span></div><div class="kv"><span>Chegada ao hotel</span><span>19h10</span></div><div class="kv"><span>Custo extra</span><span>US$ 0,00</span></div></div>
    ${aplicada ? `<div class="btns"><span class="pill ok" style="font-size:14px;padding:8px 12px">${ic("check", 14, 2.5)} Adicionado ao D3</span><button class="btn ghost" style="height:34px;width:auto" data-a="desfazer">Desfazer</button></div>`
      : `<div class="btns"><button class="btn" data-a="aprovar">Aprovar</button><button class="btn sec" data-a="toast" data-m="O Marco pergunta o que ajustar: horário, lugar ou duração.">Ajustar</button></div>`}
  </div>`;
}

function cardLanc() {
  const feito = S.lancId;
  return `<div class="card" style="border:.5px solid var(--sep)">
    <div style="display:flex;justify-content:space-between;align-items:center"><span class="small">Lançamento na Carteira</span><span class="pill acc">Por voz</span></div>
    <div style="font-size:28px;font-weight:700;letter-spacing:-.4px" class="mono">US$ 38,50</div>
    <div><div class="kv"><span>Descrição</span><span>Almoço</span></div><div class="kv"><span>Categoria</span><span>Alimentação</span></div>
      <div class="kv"><span>Quem pagou</span><span>${esc((S.viagem && S.viagem.dono) || "você")} · fonte padrão</span></div><div class="kv"><span>Divisão</span><span>Igual · US$ 19,25 cada</span></div><div class="kv"><span>Situação</span><span>Realizado</span></div></div>
    ${feito ? `<div class="btns"><button class="btn sec" data-a="verLanc">${ic("check", 16, 2.5)} Lançado · ver na Carteira</button><button class="btn ghost" style="width:auto;padding:0 10px" data-a="desfazerLanc">Desfazer</button></div>`
      : `<div class="btns"><button class="btn" data-a="aprovarLanc">Lançar</button><button class="btn sec" data-a="toast" data-m="O Marco pergunta o que mudar: valor, categoria, quem pagou ou a divisão. Na Carteira tudo continua editável à mão.">Ajustar</button></div>`}
  </div>`;
}

function telaHoje() {
  const d = diaObj(S.diaHoje);
  if (!d) return `${header({ titulo: nomeViagem(), sub: tripSub() })}<main id="main"><div class="pad"><div class="hero"><span class="kick">Na viagem</span><h1>Hoje</h1></div>${vazio("O roteiro ainda está vazio", "Quando o Marco montar o roteiro, aqui aparece o dia de hoje: a próxima atividade, a rota, o pernoite e as pendências.")}</div></main>`;
  const ps = paradasDo(d);
  const agora = hmin(S.agora);
  const prox = ps.find((p) => p.t !== "inicio" && hmin(p.h) >= agora) || ps[ps.length - 1];
  const idx = ps.indexOf(prox);
  return `${header({ titulo: nomeViagem(), sub: tripSub() })}<main id="main"><div class="pad">
    <div class="hero"><span class="kick">Dia ${d.dia} de ${DIAS.length} · ${esc(fmtData(d.data, { weekday: "long", day: "numeric", month: "long" }))}</span><h1>${esc(cidade(d))}</h1>
      <div class="progress" style="margin-top:6px"><i style="width:${((d.dia / DIAS.length) * 100).toFixed(1)}%"></i></div></div>
    <div class="stats"><div class="stat"><b>${d.km}</b><span>km hoje</span></div><div class="stat"><b>${fmtMin(d.min)}</b><span>dirigindo</span></div><div class="stat"><b>${ps.length}</b><span>paradas</span></div></div>
    <div class="card"><div><div class="small">Próxima atividade · agora ${esc(S.agora.replace("h", ":"))}</div>
      <div style="font-size:22px;font-weight:600;margin-top:2px">${esc(nomeLimpo(prox.n))}</div>
      <div class="small" style="font-size:15px">${esc(prox.h || "")}${prox.dur ? " · " + esc(prox.dur) : ""}${prox.est ? " · estacionamento a " + Math.round(prox.est.km * 1000) + " m a pé" : ""}</div></div>
      <div class="mapa">${svgMapa(d, { alto: 130, foco: idx })}</div>
      <div class="btns"><a class="btn" href="${gmaps(prox.est ? prox.est.lat : prox.lat, prox.est ? prox.est.lng : prox.lng)}" target="_blank" rel="noopener">${ic("compass", 18)} Navegar</a><button class="btn sec" data-a="lugar" data-d="${d.dia}" data-i="${idx}">Detalhes</button></div></div>
    <div class="list">
      <div class="row"><span class="ico">${ic("bed", 17)}</span><div class="main"><b>Pernoite</b><span>${esc(nomeLimpo(d.pernoite || "—"))}</span></div></div>
      <div class="row"><span class="ico">${ic("sun", 17)}</span><div class="main"><b>Clima</b><span>Previsão aparece 5 dias antes</span></div></div>
      <button class="row" data-a="tab" data-t="carteira"><span class="ico">${ic("wallet", 17)}</span><div class="main"><b>Carteira</b><span>Gastos do dia e saldo de cada um</span></div>${ic("chev", 18)}</button>
      <button class="row" data-a="ir" data-t="checklist"><span class="ico">${ic("check", 17)}</span><div class="main"><b>Pendências</b><span>${pendentes()} tarefas abertas</span></div>${ic("chev", 18)}</button>
    </div>
    <p class="eyebrow">Roteiro do dia</p>${timeline(d)}
  </div></main>
  <div style="padding:8px 16px"><button class="row" style="background:var(--card);border-radius:26px;min-height:52px" data-a="ir" data-t="conversa"><div class="main"><span style="font-size:16px">Fale com o Marco</span></div><span class="num" style="width:36px;height:36px;border-radius:18px">${ic("mic", 18)}</span></button></div>`;
}

function timeline(d) {
  const ps = paradasDo(d);
  return `<div class="list tl">${ps.map((p, i) => {
    const [icn, lab] = TIPO[p.t] || TIPO.passeio;
    return `<button class="row" data-a="lugar" data-d="${d.dia}" data-i="${i}"><span class="hora">${esc(p.h || "")}</span><span class="ico">${ic(icn, 17)}</span>
      <div class="main"><b>${esc(nomeLimpo(p.n))}</b><span>${esc(lab)}${p.dur ? " · " + esc(p.dur) : ""}${p.est ? " · " + Math.round(p.est.km * 1000) + " m a pé" : ""}</span>${seloPill(p) ? `<span style="margin-top:4px">${seloPill(p)}</span>` : ""}${p.novo ? '<span style="margin-top:4px"><span class="pill acc">Novo · aprovado agora</span></span>' : ""}</div>${ic("chev", 18)}</button>`;
  }).join("")}</div>`;
}

function telaRoteiro() {
  const kmTot = DIAS.reduce((s, d) => s + d.km, 0), minTot = DIAS.reduce((s, d) => s + d.min, 0);
  const datas = S.viagem ? `${fmtData(S.viagem.inicio, { day: "numeric", month: "long" })} – ${fmtData(fimViagem(), { day: "numeric", month: "long" })}` : "";
  if (!DIAS.length) return `${header({ titulo: "Roteiro", sub: nomeViagem() })}<main id="main"><div class="pad"><div class="hero"><span class="kick">${esc(datas)}</span><h1>Roteiro</h1></div>${vazio("O Marco ainda não montou o roteiro", "Conte a ele o que vocês querem fazer. O roteiro aparece aqui dia a dia, com as rotas reais, os horários e os locais conferidos no mapa.")}</div></main>`;
  return `${header({ titulo: "Roteiro", sub: nomeViagem() })}<main id="main"><div class="pad">
    <div class="hero"><span class="kick">${esc(datas)}</span><h1>Roteiro</h1></div>
    <div class="stats"><div class="stat"><b>${DIAS.length}</b><span>dias</span></div><div class="stat"><b>${kmTot.toLocaleString("pt-BR")}</b><span>km de estrada</span></div><div class="stat"><b>${Math.round(minTot / 60)} h</b><span>dirigindo</span></div></div>
    <div class="list">${DIAS.map((d) => {
      const n = d.paradas.filter((p) => seloDe(p) !== "verde").length;
      return `<button class="row" data-a="dia" data-d="${d.dia}"><span class="datebox"><small>${esc(fmtData(d.data, { weekday: "short" }))}</small><b>${new Date(d.data + "T12:00:00").getDate()}</b></span>
        <div class="main"><span style="font-size:12px;font-weight:600;color:var(--accent)">DIA ${d.dia}</span><b>${esc(d.titulo)}</b><span>${d.km} km · ${fmtMin(d.min)} dirigindo${n ? ` · <span style="color:var(--warn);font-weight:600">${n} a confirmar</span>` : ""}</span></div>
        <span class="thumb">${miniRota(d)}</span></button>`;
    }).join("")}</div></div></main>`;
}
function telaDia() {
  const d = diaObj(S.diaSel);
  if (!d) return telaRoteiro();

// ---------- mapa em SVG (traçado real da estrada) ----------
function svgMapa(d, { alto = 330, foco = -1, zoom = null } = {}) {
  const W = 360, H = alto, P = 22;
  const ps = paradasDo(d);
  let pts = zoom ? zoom : [...d.poly, ...ps.map((p) => [p.lat, p.lng])];
  const lat0 = pts.reduce((s, p) => s + p[0], 0) / pts.length;
  const kx = Math.cos((lat0 * Math.PI) / 180);
  const xs = pts.map((p) => p[1] * kx), ys = pts.map((p) => -p[0]);
  let x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const span = Math.max((x1 - x0) / (W - 2 * P), (y1 - y0) / (H - 2 * P), 1e-4);
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  const X = (lng) => W / 2 + (lng * kx - cx) / span, Y = (lat) => H / 2 + (-lat - cy) / span;
  const path = d.poly.map((p, i) => `${i ? "L" : "M"}${X(p[1]).toFixed(1)} ${Y(p[0]).toFixed(1)}`).join("");
  const uid = "m" + (++svgN);
  // régua de escala: 1 grau de latitude ≈ 111 km
  const kmPorPx = span * 111;
  const esc0 = [0.1, 0.2, 0.5, 1, 2, 5, 10, 20, 50, 100, 200].find((k) => k / kmPorPx >= 40) || 200;
  const escPx = esc0 / kmPorPx, escTxt = esc0 < 1 ? `${esc0 * 1000} m` : `${esc0} km`;
  const postos = zoom ? "" : d.postos.map((p) => `<g transform="translate(${X(p.lng).toFixed(1)} ${Y(p.lat).toFixed(1)})"><circle r="7" fill="var(--card)" stroke="var(--line)" stroke-width="1" filter="url(#${uid}s)"/><path d="M-2.6 -3.4h3.6v6.6h-3.6zM1 -1.6l1.8 1.3v2.6" fill="none" stroke="var(--fg2)" stroke-width="1.1" stroke-linejoin="round"/></g>`).join("");
  const ini = d.poly[0], fim = d.poly[d.poly.length - 1];
  const marcas = zoom ? "" : `<circle cx="${X(ini[1]).toFixed(1)}" cy="${Y(ini[0]).toFixed(1)}" r="5" fill="var(--card)" stroke="var(--accent)" stroke-width="2.5"/><g transform="translate(${X(fim[1]).toFixed(1)} ${Y(fim[0]).toFixed(1)})"><rect x="-6" y="-6" width="12" height="12" rx="3" fill="var(--fg)"/><path d="M-3 2V-2.5M-3 0h6v2M3 0a1.6 1.6 0 0 0-1.6-1.6h-2" stroke="var(--bg)" stroke-width="1.1" fill="none"/></g>`;
  const pins = ps.map((p, i) => {
    if (p.t === "inicio" && i > 0) return "";
    const c = seloDe(p), x = X(p.lng).toFixed(1), y = Y(p.lat).toFixed(1);
    const fill = c === "verde" ? "var(--accent)" : c === "amarelo" ? "var(--warn)" : "var(--bad)";
    const tc = c === "verde" ? "var(--accent-fg)" : "var(--card)";
    const s = i === foco ? 1.25 : 1;
    const est = p.est ? `<g transform="translate(${X(p.est.lng).toFixed(1)} ${Y(p.est.lat).toFixed(1)})"><rect x="-7" y="-7" width="14" height="14" rx="4" fill="var(--fg)"/><text y="3.6" text-anchor="middle" font-size="9.5" font-weight="700" font-family="var(--font)" fill="var(--bg)">P</text></g>` : "";
    return `${zoom ? est : ""}<g transform="translate(${x} ${y}) scale(${s})" filter="url(#${uid}s)"><path d="M0 0C-1.5-4-9-8.5-9-14.5a9 9 0 0 1 18 0C9-8.5 1.5-4 0 0z" fill="${fill}" stroke="var(--card)" stroke-width="1.5"/><text y="-11" text-anchor="middle" font-size="9.5" font-weight="700" font-family="var(--font)" fill="${tc}">${i + 1}</text></g>`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Mapa do dia ${d.dia}"><defs>
    <linearGradient id="${uid}g" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" style="stop-color:var(--map)"/><stop offset="1" style="stop-color:var(--map2)"/></linearGradient>
    <filter id="${uid}s" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="1.2" stdDeviation="1.2" flood-color="#000" flood-opacity=".28"/></filter></defs>
    <rect width="${W}" height="${H}" fill="url(#${uid}g)"/>
    <path d="${path}" fill="none" stroke="var(--road)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>${marcas}${postos}${pins}
    ${H >= 120 ? `<g transform="translate(14 ${H - 14})"><path d="M0 -4V0H${escPx.toFixed(1)}V-4" fill="none" stroke="var(--fg2)" stroke-width="1.4"/><text x="${(escPx + 6).toFixed(1)}" y="1" font-size="10" font-family="var(--font)" fill="var(--fg2)">${escTxt}</text></g>` : ""}</svg>`;
}
let svgN = 0;
function miniRota(d) {
  const pts = d.poly, lat0 = pts[0][0], kx = Math.cos((lat0 * Math.PI) / 180);
  const xs = pts.map((p) => p[1] * kx), ys = pts.map((p) => -p[0]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const sp = Math.max(x1 - x0, y1 - y0, 1e-4) / 40;
  const X = (x) => 27 + (x - (x0 + x1) / 2) / sp, Y = (y) => 27 + (y - (y0 + y1) / 2) / sp;
  const p = pts.map((q, i) => `${i ? "L" : "M"}${X(q[1] * kx).toFixed(1)} ${Y(-q[0]).toFixed(1)}`).join("");
  const f = pts[pts.length - 1];
  return `<svg viewBox="0 0 54 54" aria-hidden="true"><path d="${p}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${X(f[1] * kx).toFixed(1)}" cy="${Y(-f[0]).toFixed(1)}" r="2.6" fill="var(--accent)"/></svg>`;
}

  const sos = (S.viagem && S.viagem.emergencia) || "112";

      <a class="btn danger" href="tel:${esc(sos)}" target="_blank" rel="noopener">${ic("phone", 18)} Ligar ${esc(sos)}</a><span class="small">Se o discador não abrir, disque <b class="sel">${esc(sos)}</b>. O número muda conforme o país do roteiro.</span></div>

      <div class="row"><span class="ico">${ic("phone", 18)}</span><div class="main"><b>Central do seguro viagem 24 h</b><span>${S.tarefas.seg ? "Número lido do comprovante" : "Anexe o comprovante para aparecer aqui"}</span></div></div>
      <div class="row"><span class="ico">${ic("globe", 18)}</span><div class="main"><b>Consulado-Geral do Brasil</b><span>O mais próximo do roteiro do dia</span></div></div></div>
    <p class="eyebrow">Frases prontas · sem internet</p><div class="list">${frases.map(([pt, en]) => `<div class="row"><div class="main"><b>${esc(en)}</b><span>${esc(pt)}</span></div></div>`).join("")}</div></div></main>`;

// ---------- onboarding ----------
const INTERESSES = ["Montanhas e natureza", "Trilhas", "Trens cênicos", "Cidades históricas", "Museus", "Gastronomia", "Compras", "Fotografia", "Lagos e barcos", "Vida noturna", "Aventura radical", "Bem-estar"];
const ATRACOES = [["Jungfraujoch", "A estação de trem mais alta da Europa, entre geleiras."], ["Vale de Lauterbrunnen", "Vale de paredões e cachoeiras, bom para caminhadas leves."], ["Glacier Express", "Trem panorâmico entre Zermatt e St. Moritz."], ["Lucerna", "Cidade à beira do lago, com a ponte de madeira da Kapellbrücke."], ["Zermatt e o Matterhorn", "Vila sem carros aos pés do Matterhorn."]];
const CENARIO = ["Subir de trem até um mirante e almoçar com vista", "Fazer uma trilha de 3 horas entre vilarejos", "Voo panorâmico de helicóptero", "Ficar num café da vila, sem pressa"];
const FALA = "Quero levar meus pais para a Suíça em julho, uns doze dias. A gente gosta de montanha, trem e comida boa, mas sem correria.";
function telaOnboarding() {
  const o = S.onb, dots = `<div class="dots">${[0, 1, 2, 3, 4].map((i) => `<i class="${i === o.step ? "on" : ""}"></i>`).join("")}</div>`;
  let c = "";
  if (o.step === 0) {
    const n = o.fala.length, ok = n >= FALA.length;
    c = `<h1 style="font-size:28px">Me conta sobre essa viagem.</h1><p class="sub">Para onde, com quem, o que você está imaginando. Pode falar à vontade.</p>
      <div class="transc" style="text-align:left;max-width:none;font-size:17px;color:var(--fg);min-height:72px">${esc(FALA.slice(0, n))}${!ok && n ? "▍" : ""}</div>
      <div class="card ficha" style="gap:0"><div class="small" style="padding-bottom:6px">Ficha da viagem</div>
        <div class="kv"><span>Destino</span><span>${n > 40 ? "Suíça" : "…"}</span></div><div class="kv"><span>Quando</span><span>${n > 60 ? "Julho · ~12 dias" : "…"}</span></div>
        <div class="kv"><span>Quem vai</span><span>${n > 30 ? "Você + pais (3)" : "…"}</span></div><div class="kv"><span>Estilo</span><span>${n > 100 ? "Montanha, trens, gastronomia" : "…"}</span></div><div class="kv"><span>Ritmo</span><span>${ok ? "Tranquilo" : "…"}</span></div></div>
      <div style="display:flex;justify-content:center"><div class="orb ${o.falando ? "ouvindo" : ""}"><i></i><i></i><button data-a="onbFalar" aria-label="Falar">${ic("mic", 24)}</button></div></div>
      <button class="btn ${ok ? "" : "sec"}" data-a="onbNext">${ok ? "Continuar" : "Pular a fala"}</button>`;
  } else if (o.step === 1) {
    c = `<h1 style="font-size:28px">Do que vocês gostam?</h1><p class="sub">Toque uma vez para "curto", duas para "amo", três para "não é comigo".</p>
      <div class="grid2">${INTERESSES.map((n, i) => { const v = o.int[i] || 0; return `<button class="int ${v === 2 ? "amo" : v === 3 ? "nao" : ""}" data-a="onbInt" data-i="${i}"><b>${n}</b><span class="pill ${v === 2 ? "acc" : v === 1 ? "neu" : "neu"}" style="align-self:flex-start">${["Tocar", "Curto", "Amo", "Não é comigo"][v]}</span></button>`; }).join("")}</div>
      <button class="btn" data-a="onbNext">Continuar</button>`;
  } else if (o.step === 2) {
    const a = ATRACOES[o.at];
    c = `<h1 style="font-size:28px">Atrações na Suíça</h1><p class="sub">${o.at < ATRACOES.length ? `${o.at + 1} de ${ATRACOES.length}` : "Pronto"} · "Quero" vai direto para a lista de desejos.</p>
      ${a ? `<div class="swipe fade"><div class="ph">${esc(a[0])}</div><div style="font-size:20px;font-weight:600">${esc(a[0])}</div><div style="font-size:15px;color:var(--fg2);line-height:1.4">${esc(a[1])}</div></div>
      <div class="btns"><button class="btn sec" data-a="onbAt" data-v="nao">Não</button><button class="btn sec" data-a="onbAt" data-v="talvez">Talvez</button><button class="btn" data-a="onbAt" data-v="quero">Quero</button></div>`
      : `<div class="card"><div style="font-size:17px"><b>${o.quero.length}</b> na lista de desejos · <b>${o.talvez}</b> como ideia</div><span class="small">${esc(o.quero.join(", ") || "Nenhuma marcada")}</span></div><button class="btn" data-a="onbNext">Continuar</button>`}`;
  } else if (o.step === 3) {
    c = `<h1 style="font-size:28px">Uma situação</h1><p class="sub">Vocês estão em Zermatt, com 3 horas livres. O que preferem?</p>
      <div style="display:flex;flex-direction:column;gap:10px">${CENARIO.map((t, i) => `<button class="opt ${o.cen === i ? "on" : ""}" data-a="onbCen" data-i="${i}">${esc(t)}</button>`).join("")}</div>
      <p class="small" style="margin:0">Cenários como este ajustam o perfil (conservador ↔ aventureiro, econômico ↔ premium) melhor do que perguntas diretas.</p>
      <button class="btn" data-a="onbNext">Continuar</button>`;
  } else {
    const amo = INTERESSES.filter((_, i) => o.int[i] === 2);
    const perfil = ["Conservador e contemplativo", "Equilibrado, gosta de caminhar", "Aventureiro, aceita gastar mais", "Relaxado, sem pressa"][o.cen ?? 1];
    c = `<h1 style="font-size:28px">Entendi assim</h1>
      <div class="card ficha" style="gap:0"><div class="kv"><span>Viagem</span><span>Suíça · julho · ~12 dias</span></div><div class="kv"><span>Grupo</span><span>Você + pais</span></div><div class="kv"><span>Ritmo</span><span>Tranquilo</span></div>
        <div class="kv"><span>Amam</span><span style="max-width:62%">${esc(amo.join(", ") || "Montanha, trens, gastronomia")}</span></div><div class="kv"><span>Desejos</span><span>${o.quero.length} atrações</span></div><div class="kv"><span>Carteira</span><span style="max-width:62%">3 viajantes · CHF e EUR → R$ · câmbio do dia</span></div><div class="kv"><span>Perfil</span><span>${esc(perfil)}</span></div></div>
      <p class="sub">"Montei o perfil da viagem. Quer que eu comece pelas cidades-base e pelos trens?"</p>
      <label class="small" for="onbNome" style="margin-bottom:-8px">Seu nome (este celular fica em seu nome)</label>
      <input id="onbNome" value="${esc(o.nome || "")}" placeholder="Ex.: Ana" autocomplete="given-name" style="height:50px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit;font-size:17px;padding:0 14px">
      <button class="btn" data-a="onbFim">Criar viagem</button>`;
  }
  return `<div class="top"><button class="iconbtn" data-a="voltar" aria-label="Fechar">${ic("x")}</button><div class="ttl"><b>Nova viagem</b></div><span style="width:36px"></span></div>
    <main id="main"><div class="pad">${dots}${c}</div></main>`;
}

// ---------- montagem ----------
const TABS = () => [[S.fase === "viagem" ? "hoje" : "conversa", S.fase === "viagem" ? "sun" : "chat", S.fase === "viagem" ? "Hoje" : "Marco"], ["roteiro", "list", "Roteiro"], ["mapa", "map", "Mapa"], ["carteira", "wallet", "Carteira"], ["mais", "more", "Mais"]];
const RAIZ = { conversa: "conversa", hoje: "hoje", roteiro: "roteiro", dia: "roteiro", mapa: "mapa", carteira: "carteira", mais: "mais", checklist: "mais", desejos: "mais", cofre: "mais", grupo: "mais", guia: "mais", emergencia: "mais", arquivo: "mais", lugar: null, viagens: null };
let ultimaTela = null;
function render() {
  const T = { conversa: telaConversa, hoje: telaHoje, roteiro: telaRoteiro, dia: telaDia, mapa: telaMapa, lugar: telaLugar, carteira: telaCarteira, mais: telaMais, checklist: telaChecklist, desejos: telaDesejos, cofre: telaCofre, grupo: telaGrupo, guia: telaGuia, emergencia: telaEmergencia, viagens: telaViagens, onboarding: telaOnboarding, boasvindas: telaBoasVindas, arquivo: telaArquivo }[S.tela];
  const main0 = $("#main"), scroll = main0 && ultimaTela === S.tela ? main0.scrollTop : 0;
  const raiz = RAIZ[S.tela] ?? S.hist.map((h) => RAIZ[h.tela]).filter(Boolean).pop();
  const tabbar = S.tela === "onboarding" || S.tela === "boasvindas" ? "" : `<nav class="tabbar">${TABS().map(([t, i, l]) => `<button class="tab ${raiz === t ? "on" : ""}" data-a="tab" data-t="${t}"><span>${ic(i, 24)}${t === "mais" && pendentes() ? `<i class="badge">${pendentes()}</i>` : ""}</span>${l}</button>`).join("")}</nav>`;
  let over = "";
  if (S.overlay === "alerta") over = `<div class="alerta" role="alertdialog" aria-label="Alerta urgente"><div style="font-size:13px;color:#A1A1A6">Agora · Marco, seu agente de viagem</div><div class="ic">${ic("sos", 30, 2)}</div>
    <div style="display:flex;flex-direction:column;gap:10px"><div style="font-size:13px;font-weight:600;color:#FF6961">Alerta urgente</div><h2>Estrada fechada no seu trajeto</h2><p>A US-191 está interditada ao norte de Moab. O trajeto de hoje passa por ela.</p></div>
    <div class="bx"><small>Rota alternativa</small><b style="font-size:17px">+25 min · chegada às 9h40</b><small>Seu horário de entrada das 10h00 continua garantido.</small></div><div style="flex:1"></div>
    <button class="b1" data-a="fechar" data-m="Rota alternativa aplicada ao dia.">Usar rota alternativa</button><button class="b2" data-a="fecharIr" data-t="conversa">Falar com o Marco</button><button class="b3" data-a="fechar">Ciente</button></div>`;
  if (S.overlay === "notif") over = `<button class="notif fade" data-a="fecharIr" data-t="conversa"><span class="app-ic">${ic("compass", 22)}</span><span style="display:flex;flex-direction:column;gap:2px;min-width:0"><span style="display:flex;justify-content:space-between;gap:8px"><b style="font-size:15px">Marco</b><span class="small">agora</span></span><b style="font-size:15px">Chuva prevista amanhã cedo em Moab</b><span style="font-size:15px;color:var(--fg2)">Sugiro levar a trilha do Delicate Arch para a tarde. Quer ver a proposta?</span></span></button>`;
  if (S.overlay === "comprovante") over = sheetComprovante();
  if (S.overlay === "confirmar") over = sheetConfirmar();
  if (S.overlay === "dono") over = sheetDono();
  if (S.overlay === "fechar") over = `<div class="sheet" data-a="fecharFundo"><div class="in fade"><div class="grab"></div><div style="font-size:20px;font-weight:600">Fechar ${esc(nomeViagem())}?</div>
    <p class="sub">A viagem e a Carteira saem deste aparelho. Exporte o arquivo da viagem antes, se quiser abrir de novo depois.</p>
    <button class="btn sec" data-a="ir" data-t="arquivo">Exportar antes</button><div class="btns"><button class="btn danger" data-a="fecharViagem">Fechar viagem</button><button class="btn ghost" data-a="fechar">Cancelar</button></div></div></div>`;
  const toast = S.toast ? `<div class="toast fade" role="status">${esc(S.toast.m)}${S.toast.undo ? `<button data-a="${S.toast.undo}">Desfazer</button>` : ""}</div>` : "";
  // estrutura fixa: a Carteira (app financeiro original) fica num quadro próprio que não é recriado a cada toque
  if (!$("#view")) $("#app").innerHTML = '<input type="file" id="arqViagem" accept=".json,.pdf,application/json,application/pdf" hidden><input type="file" id="arqJuntar" accept=".json,.pdf,application/json,application/pdf" hidden><div id="view" style="flex:1;display:flex;flex-direction:column;min-height:0"></div><div id="walletBox" hidden style="flex:1;display:flex;flex-direction:column;min-height:0"></div><div id="tabs"></div><div id="over"></div>';
  const naCarteira = S.tela === "carteira";
  if (!$("#wallet")) abrirCarteira(); // carregada desde o início, para o Marco poder lançar
  $("#walletBox").hidden = !naCarteira;
  if ($("#walletSub")) $("#walletSub").textContent = nomeViagem();
  $("#view").hidden = naCarteira;
  if (!naCarteira) $("#view").innerHTML = T();
  $("#tabs").innerHTML = naCarteira ? "" : tabbar; // na Carteira fica só o menu dela + a seta de voltar
  $("#over").innerHTML = over + toast;
  const m = $("#main");
  if (m) { m.scrollTop = S.tela === "conversa" && (ultimaTela !== S.tela || S.rolarFim) ? m.scrollHeight : scroll; S.rolarFim = false; }
  ultimaTela = S.tela;
  memSalvar();
}

t-size:11.5px;color:var(--warn);margin-top:3px;line-height:1.25}\n.fonte .prev + .prev{margin-top:1px}\n/* camadas da barra: estimado (azul listrado) < a pagar (âmbar listrado) < gasto (sólido, por cima) */\n:root{--pat-apagar:repeating-linear-gradient(135deg,var(--warn) 0 4px,color-mix(in srgb,var(--warn) 45%,transparent) 4px 8px);\n      --pat-est:repeating-linear-gradient(45deg,var(--est) 0 4px,color-mix(in srgb,var(--est) 40%,transparent) 4px 8px)}\n.minibar i.prev,.bar i.prev{background:var(--pat-apagar);opacity:1}\n.seg i{border-radius:0}.seg i:first-child{border-top-left-radius:9px;border-bottom-left-radius:9px}\n.seg i:last-child{border-top-right-radius:9px;border-bottom-right-radius:9px}\n.minibar i.est,.bar i.est{background:var(--pat-est);opacity:1}\n.fonte .prev .e{color:var(--est)}\n.wal .minibar{height:8px;border:1px solid var(--line)}\n.leg-prev[data-ajuda]{cursor:pointer;-webkit-user-select:none;user-select:none}\n.leg-prev[data-ajuda] span{padding:3px 0}\n.wal-ajuda{display:none}\n.wal-ajuda.on{display:block}\n.leg-prev{display:flex;gap:14px;font-size:11.5px;color:var(--ink-2);margin:4px 0 0}\n.leg-prev i{display:inline-block;width:14px;height:8px;border-radius:3px;margin-right:5px;vertical-align:0}\n.secao{font-size:12.5px;font-weight:700;color:var(--ink-2);margin:16px 0 6px;display:flex;justify-content:space-between}\n/* saldo projetado da fonte: âmbar = só a pagar · roxo = só estimado · laranja = os dois · vermelho = negativo */\n.fonte .vals .proj{font-weight:700;font-size:13px;margin-top:5px;white-space:nowrap}\n.fonte .vals .proj small{font-weight:500;font-size:10.5px;opacity:.9;margin-right:3px;display:inline}\n.proj.ap{color:var(--warn)}.proj.es{color:var(--est)}.proj.mx{color:var(--mix)}.proj.neg{color:var(--bad)}\n.pgrow{display:grid;grid-template-columns:1fr 1.25fr;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}\n.pgrow:first-child{border-top:0}\n.pgrow .quem{grid-column:1/-1;display:flex;align-items:center;gap:8 ategorias\" style=\"grid-column:4 / span 2\"><svg class=\"i\"><use href=\"#i-tag\"/></svg>Categorias</button>\n  <\!-- Clé: a aba Ajustes saiu daqui; os dados da viagem vêm do Marco e se editam em Mais → Ajustes da viagem -->\n</div></nav>\n\n<div class=\"scrim\" id=\"scrim\"></div>\n<div class=\"sheet\" id=\"sheet\"><div class=\"in\" id=\"sheetIn\"></div></div>\n<div class=\"toast\" id=\"toast\"></div>\n<input type=\"file\" id=\"cam\" accept=\"image/*\" capture=\"environment\" hidden>\n<input type=\"file\" id=\"imp\" accept=\".json,.txt,.pdf,application/json,text/plain,application/pdf\" hidden>\n\n<svg width=\"0\" height=\"0\" style=\"position:absolute\">\n  <symbol id=\"i-home\" viewBox=\"0 0 24 24\"><path d=\"M3 10.5 12 3l9 7.5\"/><path d=\"M5 9v12h14V9\"/><path d=\"M10 21v-6h4v6\"/></symbol>\n  <symbol id=\"i-list\" viewBox=\"0 0 24 24\"><path d=\"M8 6h13M8 12h13M8 18h13\"/><circle cx=\"3.5\" cy=\"6\" r=\".8\"/><circle cx=\"3.5\" cy=\"12\" r=\".8\"/><circle cx=\"3.5\" cy=\"18\" r=\".8\"/></symbol>\n  <symbol id=\"i-plus\" viewBox=\"0 0 24 24\"><path d=\"M12 5v14M5 12h14\"/></symbol>\n  <symbol id=\"i-tag\" viewBox=\"0 0 24 24\"><path d=\"M3 12V3h9l9 9-9 9z\"/><circle cx=\"7.5\" cy=\"7.5\" r=\"1.4\"/></symbol>\n  <symbol id=\"i-sliders\" viewBox=\"0 0 24 24\"><path d=\"M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0\"/><circle cx=\"16\" cy=\"6\" r=\"2\"/><circle cx=\"10\" cy=\"12\" r=\"2\"/><circle cx=\"18\" cy=\"18\" r=\"2\"/></symbol>\n  <symbol id=\"i-plane\" viewBox=\"0 0 24 24\"><path d=\"M10.5 13.5 3 11l1.5-1.5 8 1 4-4.5a2 2 0 0 1 3 3l-4.5 4 1 8L14.5 22 12 14.5\"/></symbol>\n  <symbol id=\"i-shield\" viewBox=\"0 0 24 24\"><path d=\"M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z\"/><path d=\"m9 12 2 2 4-4\"/></symbol>\n  <symbol id=\"i-bed\" viewBox=\"0 0 24 24\"><path d=\"M3 19V6M3 14h18v5M21 14v-2a3 3 0 0 0-3-3h-8v5\"/><circle cx=\"6.5\" cy=\"10.5\" r=\"1.8\"/></symbol>\n  <symbol id=\"i-key\" viewBox=\"0 0 24 24\"><circle cx=\"8\" cy=\"15\" r=\"4\"/><path d=\"m
