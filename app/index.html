2</b><span>Veio pelo <b style=\"all:unset;font-weight:700\">Quick Share</b>: procure em <b style=\"all:unset;font-weight:700\">Recentes</b> ou na pasta <b style=\"all:unset;font-weight:700\">Download › Quick Share</b>.</span></div>\n    <div class=\"passo\"><b>3</b><span>Veio pelo <b style=\"all:unset;font-weight:700\">WhatsApp</b>: antes, toque no arquivo na conversa para baixar; depois procure em <b style=\"all:unset;font-weight:700\">Recentes</b>.</span></div>\n    <div class=\"passo\"><b>4</b><span>Toque no PDF. O app junta os dados e mostra o que mudou; os lançamentos repetidos não duplicam.</span></div>\n    <button class=\"btn pri\" id=\"jEscolher\">Escolher o arquivo</button>`;\n  abrirSheet();\n  $('#jEscolher').onclick = () => { MODO_IMP = 'juntar'; $('#imp').click(); };\n}\n$('#scrim').onclick = fecharComAviso;\n\n/* ============ Sincronização por QR Code ============\n   Protocolo (dois celulares, sem rede):\n   1) HOST mostra o pacote P1 (o que mudou aqui desde a última confirmação do outro).\n   2) CLIENT lê P1, junta, e mostra P2 (o que mudou lá desde a confirmação que veio em P1).\n   3) HOST lê P2 e junta. Cada pacote leva \"ack\": até que hora (do relógio do outro) já foi recebido,\n      assim cada lado sabe o que o outro já tem e envia só o que falta.\n   ================================================== */\nconst SYNC = { timer:null, stream:null, loop:null, lock:null, meio:null };\n// fechar no meio da sincronização: avisa o que fica faltando (meio = 'host' | 'client' | 'ajuste')\nconst AVISO_MEIO = {\n  host: 'A sincronização ficou pela metade: falta ler a resposta do outro celular, e as mudanças dele não chegam aqui. Sair mesmo assim?',\n  client: 'O outro celular ainda precisa ler este código; sem isso, as mudanças deste celular não chegam lá. Sair mesmo assim?',\n  ajuste: 'Os dois celulares ainda estão diferentes. Sair sem fazer o ajuste?'\n};\nfunction fecharComAviso(){\n  if (SYNC.meio && $('#sheet').classList.contains('on') && !confirm(AVISO_MEIO[SYNC.meio])) return;\n  SYNC.meio = null; fecharSheet();\n}\nfunction meuDisp(){\n  try { let d = localStorage.getItem('finviagem-disp'); if (!d) { d = 'd' + Math.random().toString(36).slice(2, 10); localStorage.setItem('finviagem-disp', d); } return d; }\n  catch(e){ S.local.disp ||= 'd' + Math.random().toString(36).slice(2, 10); return S.local.disp; }\n}\n// chaves curtas no QR (o pacote fica bem menor); expandir() desfaz\nconst CHAVE = {id:'i',desc:'d',cat:'c',sub:'s',valor:'v',moeda:'m',dia:'y',status:'t',resp:'r',partes:'q',pagamentos:'g',por:'p',fonte:'f',fatura:'x',incluir:'n',obs:'o',upd:'u'};\nconst CHAVE_INV = Object.fromEntries(Object.entries(CHAVE).map(([a, b]) => [b, a]));\nconst ST_C = {estimado:'E', apagar:'A', pago:'P', realizado:'R'}, ST_INV = {E:'estimado', A:'apagar', P:'pago', R:'realizado'};\nfunction compactar(l){\n  const o = {};\n  for (const [k, v] of Object.entries(l)) {\n    if (k === 'foto' || k === 'loc' || k === 'via' || v === null || v === '' || v === undefined) continue;\n    if (k === 'incluir' && v === true) continue;\n    if (k === 'moeda' && v === S.viagem.local.cod) continue;\n    let x = v;\n    if (k === 'status') x = ST_C[v] || v;\n    if (k === 'pagamentos') x = v.map(pg => [pg.por, pg.fonte || 0, pg.valor]);\n    o[CHAVE[k] || k] = x;\n  }\n  return o;\n}\nfunction expandir(o){\n  const l = {};\n  for (const [k, v] of Object.entries(o)) {\n    const kk = CHAVE_INV[k] || k; let x = v;\n    if (kk === 'status') x = ST_INV[v] || v;\n    if (kk === 'pagamentos') x = v.map(a => ({ por: a[0], fonte: a[1] || null, valor: a[2] }));\n    l[kk] = x;\n  }\n  l.moeda ??= S.viagem.local.cod; l.incluir ??= true;\n  return l;\n}\nfunction enxugar(l){ const o = {}; for (const [k, v] of Object.entries(l)) { if (k === 'foto' || k === 'loc' || k === 'via') continue; if (v === null || v === '' || v === undefined) continue; o[k] = v; } return o; }\nfunction hashNum(t){ let h = 5381; for (let i = 0; i < t.length; i++) h = (h * 33 + t.c  const alvo = Math.min(380, (document.getElementById('sheetIn')?.clientWidth || 360) - 56);\n  const px = Math.max(3, Math.floor(alvo / (n + borda * 2)));\n  canvas.width = canvas.height = (n + borda * 2) * px;\n  const g = canvas.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, canvas.width, canvas.height); g.fillStyle = '#000';\n  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) g.fillRect((c + borda) * px, (r + borda) * px, px, px);\n}\nasync function manterTelaAcesa(){ try { if ('wakeLock' in navigator && !SYNC.lock) SYNC.lock = await navigator.wakeLock.request('screen'); } catch(e){} }\nfunction pararSync(){\n  clearInterval(SYNC.timer); SYNC.timer = null; cancelAnimationFrame(SYNC.loop); SYNC.loop = null;\n  if (SYNC.stream) { SYNC.stream.getTracks().forEach(t => t.stop()); SYNC.stream = null; }\n  if (SYNC.lock) { SYNC.lock.release().catch(() => {}); SYNC.lock = null; }\n}\nfunction resumo(r){ return r.novos + r.atualizados + r.removidos ? `${r.novos} novo(s) · ${r.atualizados} atualizado(s) · ${r.removidos} removido(s)` : 'nenhuma mudança nova'; }\nconst PARTES_GRANDE = 8; // acima disso, sugere enviar por arquivo\n\nfunction abrirSync(){\n  pararSync(); SYNC.meio = null;\n  $('#sheetIn').innerHTML = `<div class=\"grab\"></div><div class=\"shead\"><h2>Sincronizar celulares</h2><button class=\"iconbtn\" data-close><svg class=\"i\"><use href=\"#i-x\"/></svg></button></div>\n    <p class=\"sub\" style=\"margin:0 0 6px\">Os dois celulares lado a lado, com o app aberto. Não precisa de internet.</p>\n    <div class=\"passo\"><b>1</b><span>Neste celular, toque em <b style=\"all:unset;font-weight:700\">Começar</b>. Ele mostra um QR Code.</span></div>\n    <div class=\"passo\"><b>2</b><span>No outro, toque em <b style=\"all:unset;font-weight:700\">Ler o código do outro</b> e aponte a câmera, a uns 20 cm.</span></div>\n    <div class=\"passo\"><b>3</b><span>O outro celular mostra o código dele. Aqui, toque em <b style=\"all:unset;font-weight:700\">Ler a resposta</b>. Quem começa também termina; não precisa inverter.</span></div>\n    <button class=\"btn pri\" id=\"syHost\">Começar (mostrar meu código)</button>\n    <button class=\"btn ghost\" id=\"syCli\" style=\"margin-top:8px\">Ler o código do outro</button>\n    <div class=\"hint\" style=\"margin-top:12px\">Muita coisa mudou desde a última vez (ex.: a primeira sincronização)? Envie por arquivo e, no outro celular, toque em <b>Juntar arquivo recebido</b> aqui nesta tela.</div>\n    <button class=\"btn ghost\" id=\"compArq\" style=\"margin-top:8px\">Enviar (Quick Share / WhatsApp)</button>\n    <button class=\"btn ghost\" id=\"impBtn\" style=\"margin-top:8px\"><svg class=\"i\" style=\"vertical-align:-4px\"><use href=\"#i-down\"/></svg> Juntar arquivo recebido (PDF)</button>`;\n  abrirSheet();\n  $('#syHost').onclick = async () => mostrarCodigo(await codificar(montarPacote(null)), 'host');\n  $('#syCli').onclick = () => lerCodigo(async P => {\n    const r = aplicarPacote(P);\n    // código de ajuste: responde com os mesmos grupos por inteiro (o que só este celular tiver também volta)\n    mostrarCodigo(await codificar(montarPacote(P.de, P.aj)), 'client', r, P.nome);\n  });\n}\n// host leu a resposta: confere se os dois ficaram iguais; se não, oferece o código de ajuste (só os grupos diferentes)\nasync function concluirSync(P, tentativa){\n  const r2 = aplicarPacote(P);\n  const dif = gruposDiferentes(P.rg), nome = esc(P.nome || 'o outro celular');\n  SYNC.meio = dif.length ? 'ajuste' : null;\n  if (!dif.length) {\n    $('#sheetIn').innerHTML = `<div class=\"grab\"></div><div class=\"ok-grande\"><div class=\"ico\">✓</div><h2 style=\"margin:0 0 4px\">Sincronizado com ${nome}</h2><p class=\"sub\">${resumo(r2)}${P.rg ? '<br>Conferido: os dois celulares estão iguais.' : ''}</p></div><button class=\"btn pri\" data-close>Concluir</button>`;\n    return;\n  }\n  const partes = await codificar(montarPacote(P.de, dif));\n  $('#sheetIn').innerHTML = `<div class=\"grab\"></div><div class=\"shead\"><h2>Falta um ajuste</h2><button class=\"iconbtn\" data-close><svg class=\"i\"><use href=\"#i-x\"/></svg></button></div>\n    <p class=\"sub\" style=\"margin:0 0 10px\">Recebido: ${resumo(r2)}. Na conferência final, alguns lançamentos ainda estão diferentes entre os dois celulares.\n    ${tentativa > 1 ? 'O ajuste pelo QR não resolveu; envie o arquivo completo (Quick Share ou WhatsApp) e, no outro celular, use <b>Juntar arquivo</b>.' : `Mostre o código de ajuste para ${nome} ler (${partes.length} parte${partes.length > 1 ? 's' : ''}); depois leia a resposta dele aqui.`}</p>\n    ${tentativa > 1 ? '<button class=\"btn pri\" id=\"compArq\">Enviar arquivo completo</button>' : '<button class=\"btn pri\" id=\"syAjuste\">Mostrar código de ajuste</button>'}`;\n  if ($('#syAjuste')) $('#syAjuste').onclick = () => mostrarCodigo(partes, 'host', null, null, tentativa + 1);\n}\nfunction mostrarCodigo(partes, papel, r, nomeOutro, tentativa = 1){\n  pararSync(); manterTelaAcesa();\n  const host = papel === 'host', varias = partes.length > 1;\n  SYNC.meio = papel;\n  $('#sheetIn').innerHTML = `<div class=\"grab\"></div><div class=\"shead\"><h2>${host ? 'Mostre ao outro celular' : 'Recebido de ' + esc(nomeOutro || 'outro celular')}</h2><button class=\"iconbtn\" data-close><svg class=\"i\"><use href=\"#i-x\"/></svg></button></div>\n    ${host ? '' : `<p class=\"sub\" style=\"margin:0\">✓ ${resumo(r)}.</p><div class=\"aviso-grande\"><b>Falta 1 passo:</b> no outro celular, toque em <b>Ler a resposta do outro celular</b> e aponte para este código. Só assim as mudanças deste celular chegam lá.</div>`}\n    ${partes.length > PARTES_GRANDE ? `<div class=\"aviso-grande\">Sincronização grande: <b>${partes.length} partes</b> (normal quando muita coisa mudou). Pelo QR leva alguns minutos; <b>mais rápido: enviar por arquivo</b>. <button class=\"btn ghost sm\" id=\"compArq\" style=\"margin-top:8px;width:100%\">Enviar por Quick Share / WhatsApp</button></div>` : ''}\n    <div class=\"qrbox\"><canvas id=\"qrc\"></canvas></div>\n    <div class=\"qrinfo\" id=\"qri\"></div>\n    ${varias ? '<div class=\"qrctl\"><button id=\"qAnt\" aria-label=\"Parte anterior\">◀</button><button id=\"qPausa\">Pausar</button><button id=\"qProx\" aria-label=\"Próxima parte\">▶</button></div>' : ''}\n    ${host ? '<button class=\"btn pri\" id=\"syLerResp\">Ler a resposta do outro celular</button>' : '<button class=\"btn pri\" id=\"syCliOk\">Pronto, o outro já leu</button>'}`;\n  const cv = $('#qrc'); let i = 0, pausado = false;\n  const mostra = () => { desenharQR(cv, partes[i]); $('#qri').textContent = varias ? `Parte ${i + 1} de ${partes.length}${pausado ? ' · pausado' : ''}` : 'Aponte a câmera do outro celular para este código'; };\n  const avanca = d => { i = (i + d + partes.length) % partes.length; mostra(); };\n  mostra();\n  if (varias) {\n    SYNC.timer = setInterval(() => { if (!pausado) avanca(1); }, 1500);\n    $('#qAnt').onclick = () => { pausado = true; $('#qPausa').textContent = 'Continuar'; avanca(-1); };\n    $('#qProx').onclick = () => { pausado = true; $('#qPausa').textContent = 'Continuar'; avanca(1); };\n    $('#qPausa').onclick = () => { pausado = !pausado; $('#qPausa').textContent = pausado ? 'Continuar' : 'Pausar'; mostra(); };\n  }\n  if (host) $('#syLerResp').onclick = () => lerCodigo(P => concluirSync(P, tentativa));\n  else $('#syCliOk').onclick = () => { SYNC.meio = null; fecharSheet(); };\n}\nasync function carregarJsQR(){\n  if (window.jsQR) return window.jsQR;\n  await new Promise((ok, erro) => { const sc = document.createElement('script'); sc.src = 'lib/jsQR.js'; sc.onload = ok; sc.onerror = erro; document.head.appendChild(sc); });\n  return window.jsQR;\n}\nasync function lerCodigo(aoTerminar){\n  pararSync(); manterTelaAcesa();\n  $('#sheetIn').innerHTML = `<div class=\"grab\"></div><div class=\"shead\"><h2>Aponte para o código</h2><button class=\"iconbtn\" data-close><svg class=\"i\"><use href=\"#i-x\"/>  async texto => {\n    let m = /^FV2:([0-9A-Z]{4}):(\\d+):(\\d+):([\\s\\S]*)$/.exec(texto || ''), v = 2;\n    if (!m) { m = /^FV1\\|(\\w+)\\|(\\d+)\\|(\\d+)\\|([\\s\\S]*)$/.exec(texto || ''); v = 1; }\n    if (!m) return false;\n    if (sid !== m[1]) { sid = m[1]; total = +m[3]; versao = v; for (const k in partes) delete partes[k]; }\n    partes[+m[2]] = m[4];\n    const n = Object.keys(partes).length;\n    const faltam = Array.from({length: total}, (_, k) => k + 1).filter(k => !partes[k]);\n    info(total > 1 ? (faltam.length ? `Recebidas ${n} de ${total}${faltam.length <= 6 ? ' · faltam: ' + faltam.join(', ') : ''}` : 'Todas as partes recebidas!') : 'Lido!');\n    const pr = $('#lpr'); if (pr) pr.style.width = (n / total * 100) + '%';\n    desenharPontos(+m[2]);\n    if (n < total) return false;\n    pararSync();\n    try { const P = await decodificar(Array.from({length: total}, (_, k) => partes[k + 1]), versao); await aoTerminar(P); }\n    catch(e){ info(e.message || 'Código inválido'); toast(e.message || 'Código inválido'); }\n    return true;\n  };\n  let ocupado = false;\n  const rodar = async () => {\n    if (!SYNC.stream) return;\n    if (!ocupado && vid.readyState >= 2) {\n      ocupado = true;\n      try {\n        if (detector) { const cods = await detector.detect(vid); for (const c of cods) if (await tratar(c.rawValue)) return; }\n        else { tela.width = vid.videoWidth; tela.height = vid.videoHeight; ctx.drawImage(vid, 0, 0); const img = ctx.getImageData(0, 0, tela.width, tela.height);\n          const c = jsqr(img.data, img.width, img.height, { inversionAttempts: 'dontInvert' }); if (c && await tratar(c.data)) return; }\n      } catch(e){}\n      ocupado = false;\n    }\n    SYNC.loop = requestAnimationFrame(rodar);\n  };\n  rodar();\n}\n\nfunction telaBoasVindas(){\n  document.querySelector('.nav').style.display = 'none';\n  $('#app').innerHTML = `<div class=\"welcome\">\n    <div class=\"logo\"><svg class=\"i\"><use href=\"#i-wallet\"/></svg></div>\n    <h1>Carteira</h1>\n    <p>Controle de gastos da viagem, em duas moedas, funcionando sem internet. Os dados ficam só neste celular.</p>\n    <button class=\"btn pri\" id=\"wAbrir\">Abrir arquivo da viagem</button>\n    <button class=\"btn ghost\" id=\"wNova\">Criar uma viagem nova</button>\n    <div class=\"hint\" style=\"margin-top:16px\">O arquivo da viagem (.json) vem de quem organizou a viagem ou da exportação de outro celular.</div>\n  </div>`;\n  $('#wAbrir').onclick = () => { MODO_IMP = 'abrir'; $('#imp').click(); };\n  $('#wNova').onclick = formNovaViagem;\n}\nfunction formNovaViagem(){\n  const hojeISO = new Date().toISOString().slice(0,10);\n  $('#sheetIn').innerHTML = `<div class=\"grab\"></div><div class=\"shead\"><h2>Nova viagem</h2><button class=\"iconbtn\" data-close><svg class=\"i\"><use href=\"#i-x\"/></svg></button></div>\n    <div class=\"flabel\">Nome da viagem</div><input class=\"field\" id=\"nNome\" placeholder=\"Ex.: Férias no Chile\">\n    <div class=\"row2\"><div><div class=\"flabel\">Primeiro dia</div><input class=\"field\" type=\"date\" id=\"nIni\" value=\"${hojeISO}\"></div>\n      <div><div class=\"flabel\">Número de dias</div><input class=\"field num\" inputmode=\"numeric\" id=\"nDias\" value=\"10\"></div></div>\n    <div class=\"flabel\">Seu nome</div><input class=\"field\" id=\"nEu\" placeholder=\"Ex.: Ana\">\n    <div class=\"row2\"><div><div class=\"flabel\">Moeda do destino</div><div style=\"display:flex;gap:6px\"><input class=\"field\" id=\"nLc\" value=\"USD\"><input class=\"field\" id=\"nLs\" value=\"US$\"></div></div>\n      <div><div class=\"flabel\">Sua moeda</div><div style=\"display:flex;gap:6px\"><input class=\"field\" id=\"nNc\" value=\"BRL\"><input class=\"field\" id=\"nNs\" value=\"R$\"></div></div></div>\n    <div class=\"flabel\">Cotação (1 moeda do destino = ? sua moeda)</div><input class=\"field num\" inputmode=\"decimal\" id=\"nCot\" value=\"5,18\">\n    <button class=\"btn pri\" id=\"nOk\">Criar viagem</butto const MEM = "cle-viagem";
function memSalvar() {
  if (!S.viagem) return;
  try { localStorage.setItem(MEM, JSON.stringify({ viagem: S.viagem, estado: estadoApp(), roteiro: { dias: DIAS } })); } catch (e) {}
}

function memApagar() { try { localStorage.removeItem(MEM); } catch (e) {} }
const estadoApp = () => ({ fase: S.fase, diaHoje: S.diaHoje, confirmados: S.confirmados, tarefas: S.tarefas, extras: S.extras, chat: S.chat, lancId: S.lancId || null, listas: S.listas || null });
function aplicarEstado(e) {
  Object.assign(S, { fase: "planejamento", diaHoje: 1, confirmados: {}, tarefas: {}, extras: {}, chat: null, lancId: null, listas: null });
  if (!e) return;
  Object.assign(S, { fase: e.fase || "planejamento", diaHoje: e.diaHoje || 1, confirmados: e.confirmados || {}, tarefas: e.tarefas || {}, extras: e.extras || {}, chat: e.chat || null, lancId: e.lancId || null, listas: e.listas || null });
}
// configuração da Carteira a partir da viagem (o Marco preenche; o usuário não redigita)
const cfgCarteira = (v) => ({ nome: v.nome, inicio: v.inicio, dias: v.dias, seuNome: v.viajantes[0], localCod: (v.moeda && v.moeda.cod) || "USD", localSimb: (v.moeda && v.moeda.simb) || "US$", nativaCod: "BRL", nativaSimb: "R$", cotacao: v.cotacao || 5.5 });
// espera a Carteira terminar a leitura inicial antes de conversar com ela
function carteiraPronta() {
  return new Promise((ok) => {
    let n = 0; const t = setInterval(() => {
      let w = null; try { w = $("#wallet") && $("#wallet").contentWindow; } catch (e) {}
      if ((w && w.CLE_INICIADO && w.CLE) || ++n > 100) { clearInterval(t); ok(w && w.CLE ? w.CLE : null); }
    }, 100);
  });
}
async function montarArquivo() {
  const c = await carteiraPronta();
  return { formato: "cle-viagem", versao: 1, app: "Clé", exportado: new Date().toISOString(), de: S.viagem.dono,
    viagem: S.viagem, roteiro: { dias: DIAS }, estado: estadoApp(), carteira: c ? c.exportar() : null };
}
const slug = (t) => String(t).toLowerCase().normalize("NFD").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
async function salvarArquivo(nome, dados) {
  if (location.protocol === "file:" || !window.claude) {
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([dados])); a.download = nome; a.click();
    toast(`Arquivo salvo: ${nome}`); render(); return;
  }
  const dl = await window.claude.use("downloads");
  if (!dl) { toast("Este visualizador não permite salvar arquivos. Abra o protótipo pelo computador."); render(); return; }
  try { await dl.save({ filename: nome, data: dados }); toast(`Arquivo pronto: ${nome}`); }
  catch (e) { toast(e && e.code === "declined" ? "Salvamento cancelado." : "Não foi possível salvar o arquivo aqui."); }
  render();
}
async function lerArquivo(file) {
  const txt = await file.text();
  if (txt.startsWith("%PDF")) { const c = await carteiraPronta(); if (!c) throw new Error("pdf"); return c.lerPdf(txt); }
  return JSON.parse(txt);
}
// aceita o arquivo da viagem do app ou um arquivo antigo só da Carteira
function normalizarArquivo(d) {
  if (d && d.formato === "cle-viagem") return d;
  if (d && d.viagem && Array.isArray(d.lanc)) {
    const v = d.viagem;
    return { formato: "cle-viagem", viagem: { nome: v.nome, inicio: v.inicio, dias: v.dias, viajantes: v.viajantes.map((p) => p.nome), dono: null }, roteiro: null, estado: null, carteira: d, soCarteira: true };
  }
  throw new Error("formato");
}
async function abrirArquivoViagem(file) {
  try {
    const d = normalizarArquivo(await lerArquivo(file));
    S.viagem = { ...d.viagem, dono: null };
    DIAS = d.roteiro && Array.isArray(d.roteiro.dias) ? d.roteiro.dias : [];
    aplicarEstado(d.estado);
    S.diaSel = S.diaHoje;
    const c = await carteiraPronta();
    if (c) { if (d.carteira) c.carregar(d.carteira, null); else c.criar(cfgCarteira(S.viagem), S.viagem.viajantes.slice(1), null); }
    S.donoOpcoes = c ? c.viajantes() : S.viagem.viajantes.map((n) => ({ id: null, nome: n }));
    S.overlay = "dono"; S.hist = []; S.tela = S.fase === "viagem" ? "hoje" : "conversa"; render();
    if (d.soCarteira) { toast("Arquivo da Carteira aberto. O roteiro desta viagem ainda está vazio."); render(); }
  } catch (e) { toast("Este arquivo não é um arquivo de viagem válido."); render(); }
}
async function juntarArquivo(file) {
  try {
    const d = normalizarArquivo(await lerArquivo(file));
    let r = null; const c = await carteiraPronta();
    if (c && d.carteira) r = c.juntar(d.carteira);
    const e = d.estado || {};
    let extra = 0;
    for (const [k, v] of Object.entries(e.confirmados || {})) if (v && !S.confirmados[k]) { S.confirmados[k] = true; extra++; }
    for (const [k, v] of Object.entries(e.tarefas || {})) if (v && !S.tarefas[k]) { S.tarefas[k] = true; extra++; }
    for (const [dia, lista] of Object.entries(e.extras || {})) for (const p of lista) { S.extras[dia] = S.extras[dia] || []; if (!S.extras[dia].some((x) => x.n === p.n)) { S.extras[dia].push(p); extra++; } }
    render(); toast(`Juntado${d.de ? " o arquivo de " + d.de : ""}: ${r ? `${r.novos} lançamento(s) novo(s), ${r.atualizados} atualizado(s)` : "sem Carteira"} · ${extra} mudança(s) no roteiro e checklist.`); render();
  } catch (e) { toast("Este arquivo não é um arquivo de viagem válido."); render(); }
}
